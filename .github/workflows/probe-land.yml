name: Probe land
on:
  pull_request:
  push:
    branches: ['probe-land/bot-push']
permissions:
  contents: read
jobs:
  probe-ok:
    name: probe-ok
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
  bot-push:
    name: bot-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B tmp origin/probe-land/main
          git commit --allow-empty -m "bot commit without probe-ok"
          git push origin HEAD:probe-land/main
