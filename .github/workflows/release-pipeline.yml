# The whole release: guard, build, sign, publish, attest. Called only by `release.yml`, so
# `github.ref_name`, `github.event_name`, and `vars` here are the caller's: the tag, the event, and
# this repo's variables. It's a reusable workflow so the provenance it signs names THIS file as the
# signer (SLSA Build Level 3 on GitHub); see the `attest` job and `docs/guides/releasing.md`.
#
# Who signs the update archives is one repository variable, `RELEASE_UPDATE_SIGNING`:
# - `ci` (or unset): the tag push does everything, the `sign` job signing with the updater key
#   from the `release` environment.
# - `local`: the tag push builds, notarizes, and attests into a DRAFT release, with no updater
#   signatures and no manifest move, while the release's full CI run goes on beside it.
#   `scripts/release-finish.sh` on David's laptop waits for both, verifies each archive's
#   provenance, signs it with the key from sops, uploads the `.sig` files, then dispatches this
#   workflow on the tag (`workflow_dispatch`), which runs only `guard`, `ci-gate`,
#   `vet-update-archives`, `publish`, `attest`, and `bump-tap`. The updater key never reaches GitHub.
# `ci-gate` runs in whichever run publishes, so nothing ships without a green full CI run on the
# tagged commit: before `compile` in `ci` mode, before `publish` in the `local` dispatch.
# `docs/guides/releasing.md` § Who signs the update archives.
name: Release pipeline

on:
  workflow_call:

# The caller grants the union of what the jobs below need; a called workflow can only narrow it.
# Jobs without a `permissions` block get this read-only one; every job that writes asks for it in
# its own block (`workflows-hardening` enforces it, and it's what Scorecard's Token-Permissions scores).
permissions:
  contents: read

jobs:
  # Gates everything below. A `v*` tag push runs this whole workflow, and the `publish` job
  # makes whatever tag fired it the live update manifest, with no regard for which version
  # that is. Every user's updater reads that manifest, so re-pushing an old tag points the
  # whole install base at an old build. That has happened: retagging `v0.4.0` onto its rebased
  # commit rebuilt a January release, re-uploaded its assets, and published a manifest naming
  # 0.4.0 over the live 0.41.0, which only a `[skip ci]` kept off the website.
  #
  # It also verifies that the tag itself was signed by a release key trusted in
  # `.github/release-signers`, so every shipped tag carries independently verifiable provenance
  # and a release cannot accidentally go out unsigned. This runs in seconds and gates `compile`,
  # so a bad push costs nothing: no parallel 90-minute macOS builds, and no assets
  # overwritten on an old release.
  guard:
    name: Verify this release tag
    runs-on: ubuntu-latest
    outputs:
      update-signing: ${{ steps.signing.outputs.mode }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pick who signs the update archives
        id: signing
        env:
          MODE: ${{ vars.RELEASE_UPDATE_SIGNING }}
        run: |
          # Unset means `ci`, so the pipeline behaves as it always did until the variable says
          # otherwise. Anything else fails here: a typo must not silently pick a mode.
          case "${MODE:-ci}" in
            ci | local) echo "mode=${MODE:-ci}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::RELEASE_UPDATE_SIGNING is '$MODE'; it must be 'ci', 'local', or unset."
              exit 1
              ;;
          esac
          # A dispatch is the second half of a `local` release, and it must name the tag it
          # finishes (`gh workflow run release.yml --ref vX.Y.Z`), never a branch.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Dispatch this workflow on a release tag (--ref vX.Y.Z), not '$GITHUB_REF_NAME'."
            exit 1
          fi
          echo "Event $GITHUB_EVENT_NAME, update archives signed in mode: ${MODE:-ci}"

      - name: Require a trusted tag signature
        run: |
          # Fetch the tag object explicitly: checkout may dereference an annotated tag to its
          # commit, but `verify-tag` needs the signed object itself.
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/.github/release-signers" \
            verify-tag "$GITHUB_REF_NAME"

      - name: Refuse to move the update manifest backwards
        env:
          # Repository variable, deliberately out-of-band from git: no combination of tag pushes
          # can satisfy it by accident, which matters because a tag push IS the mistake class.
          # It must name the exact tag, so a stale value can never act as a blanket "always
          # allow" — it only ever unblocks the one tag written in it.
          REPUBLISH: ${{ vars.RELEASE_REPUBLISH_TAG }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # The live manifest is the `latest.json` of the release GitHub marks "Latest": `publish`
          # flips that mark once the manifest is up, and the website serves that file. ❌ Never the
          # checkout's `apps/website/public/latest.json`: that's a frozen copy for dev builds.
          CURRENT=$(curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" | jq -er .version)

          if [ "$REPUBLISH" = "$TAG" ]; then
            echo "::warning::RELEASE_REPUBLISH_TAG names $TAG, so publishing $VERSION over $CURRENT is deliberate. Clear that variable once this run finishes."
            exit 0
          fi

          # `sort -V` orders the two plain X.Y.Z versions; the tag has to come out on top, and a
          # re-push of the current version is refused too (it would rebuild and re-sign a release
          # users already have).
          NEWEST=$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)
          if [ "$VERSION" = "$CURRENT" ] || [ "$NEWEST" != "$VERSION" ]; then
            echo "::error::$TAG would set the update manifest to $VERSION, but it currently advertises $CURRENT. Every user's updater reads that file, so publishing an older build offers the whole install base a downgrade."
            echo "If this is a deliberate rollback: set the repository variable RELEASE_REPUBLISH_TAG to exactly '$TAG', re-run this workflow, then clear the variable. Full procedure: docs/guides/releasing.md § Rolling back a release."
            exit 1
          fi

          echo "$TAG moves the manifest $CURRENT -> $VERSION. Proceeding."

  # Only a commit with a fully green CI run ships: a `workflow_dispatch` run of `ci.yml` with
  # `run_all` on the tagged commit (`release.sh` starts it on the release branch as it pushes the
  # tag), never a push or PR run, since those skip every lane whose paths didn't change. Plus
  # CodeQL: a green run on that commit and no open high or critical alert on `main`. The rules
  # live in `scripts/release-finish/ci.go` (`release-finish.sh -ci-gate`), which the laptop runs
  # too: there with a wait that fails on the first red job, here once, with no waiting.
  #
  # It runs in whichever run publishes: a `ci` mode tag push (before `compile`, the old gate-first
  # order, since that run ships on its own: `release.sh` waits for green before pushing a `ci` mode
  # tag) or the dispatch that finishes a `local` release (before `publish`). A `local` tag push
  # builds into a private draft beside the CI run, so it skips this and nothing waits for CI.
  ci-gate:
    name: Require green CI on the released commit
    needs: [guard]
    if: github.event_name == 'workflow_dispatch' || needs.guard.outputs.update-signing == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # list CI and CodeQL runs
      security-events: read # list open CodeQL alerts

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tagged commit and its parent, whose run counts for a hand-made security-only release.
          fetch-depth: 2

      - name: Fetch the release tag
        # The gate resolves the tag itself, and checkout may leave only the commit.
        run: git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Install Go for the gate
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: go

      - name: Require a green full CI run and CodeQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # Same shape as RELEASE_REPUBLISH_TAG: names one exact tag, so a stale value can't act as
          # a blanket bypass. It turns on the gate's own bypass, RELEASE_SKIP_CI_GATE=1.
          SKIP: ${{ vars.RELEASE_SKIP_CI_GATE_TAG }}
        run: |
          set -euo pipefail
          if [ "$SKIP" = "$TAG" ]; then
            echo "::warning::RELEASE_SKIP_CI_GATE_TAG names $TAG, so this release ships WITHOUT a green full CI run or the CodeQL gate. Clear that variable once this run finishes."
            export RELEASE_SKIP_CI_GATE=1
          fi
          ./scripts/release-finish.sh -ci-gate "${TAG#v}"

  # `local` mode only: the draft release the three `sign` jobs upload into. Created once, up front,
  # because three parallel jobs each looking for a draft by tag (drafts can't be fetched by tag)
  # can each find none and create one. Re-runs reuse the draft.
  draft:
    name: Create the draft release
    needs: [guard]
    if: github.event_name == 'push' && needs.guard.outputs.update-signing == 'local'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}

    steps:
      - name: Find or create the draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          FOUND=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"')
          COUNT=$(printf '%s' "$FOUND" | grep -c . || true)
          case "$COUNT" in
            0)
              ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" \
                -f name="Cmdr $TAG" -f body='See CHANGELOG.md for details.' -F draft=true --jq .id)
              echo "Created draft release $ID for $TAG." ;;
            1)
              read -r ID IS_DRAFT <<< "$FOUND"
              if [ "$IS_DRAFT" != true ]; then
                echo "::error::$TAG already has a PUBLISHED release ($ID). Local signing builds into a draft, so this tag can't go through it."
                exit 1
              fi
              echo "Reusing draft release $ID for $TAG." ;;
            *)
              echo "::error::$TAG has more than one release: $FOUND. Delete the extra drafts, then re-run."
              exit 1 ;;
          esac
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  # A release build is two jobs per arch: `compile` makes the binary with no signing material
  # anywhere near it, and `sign` bundles, signs, notarizes, and uploads that binary on a fresh
  # runner. Compiling runs every third-party build hook there is (npm install scripts, Vite
  # plugins, each crate's `build.rs`), and code from one step can stay behind on its machine and
  # read a later step's environment or keychain, so the split is by job, not by step.
  # ❌ Don't give `compile` a secret, the `release` environment, or a signing step, and don't
  # make `sign` build anything. `docs/guides/releasing.md` § How a release build is split.
  compile:
    name: Compile (${{ matrix.arch }})
    needs: [guard, ci-gate, draft]
    # `ci` mode skips `draft` and builds only after `ci-gate`, since its run publishes. `local`
    # mode skips `ci-gate` (the build goes into a private draft while CI runs beside it, and
    # `publish` is what waits for green) and needs `draft`, so `sign` never uploads into anything
    # but the draft.
    if: >-
      !cancelled() && needs.guard.result == 'success' && (
        (needs.guard.outputs.update-signing == 'ci' && needs.ci-gate.result == 'success' && needs.draft.result == 'skipped') ||
        (needs.guard.outputs.update-signing == 'local' && needs.draft.result == 'success'))
    # Two runners can build this: GitHub's hosted macOS images, and David's self-hosted M3 MBP
    # (`[self-hosted, macOS, ARM64]`). GitHub-hosted is the ACTIVE one; see
    # `docs/guides/releasing.md` § "Which runner builds the release" for the trade-offs and the
    # Finder-Automation permission problem that took the self-hosted one out of service.
    # Switching back is this line and the one in `sign`, plus re-enabling the runner service on
    # the Mac.
    #
    # ❗ Pinned to the IMAGE, ❌ never `macos-latest`: an image carries exactly one Xcode major, so
    # this line picks the macOS SDK the bundle links against, and Apple gates behavior changes on
    # that SDK. `macos-latest` follows GitHub's schedule, which would change the shipped app in a
    # release nobody touched. Moving to an Xcode 27 image hides every menu-item image that hasn't
    # opted in, "Open with" and `Share` included, so read
    # `apps/desktop/src-tauri/src/menu/DETAILS.md` § SF Symbol icons before changing it. Same arch
    # as before: `macos-26` is arm64, as `macos-latest` already was.
    runs-on: macos-26
    # Generous because a hosted runner is ephemeral: every job pays a cold ~1000-crate Tauri
    # compile (the self-hosted runner's warm cargo cache made 30 minutes plenty). The two arch
    # jobs run in PARALLEL here rather than queueing on one machine, so wall-clock is one cold
    # build, not two.
    timeout-minutes: 90
    permissions:
      contents: read
    # No universal compile: its `sign` job joins these two binaries with `lipo -create`, which is
    # all `tauri build --target universal-apple-darwin` does after compiling both arches (one after
    # the other, so it was the release's slowest job).
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, so the build hooks get no token to find in `.git/config`.
          persist-credentials: false

      - name: Check the macOS SDK is the one we pinned
        # Fails before the ~1000-crate compile rather than after it, and loudly: a silently
        # different SDK ships a different app. Only the MAJOR is load-bearing; the image rotates
        # Xcode minors freely and those don't move the behavior we care about.
        # ❌ Don't raise this to get a release out. Moving SDK means checking the menu-bar icons,
        # the "Open with" app icons, the `Share` service icons, the File Provider logos, and the
        # tag row first (`apps/desktop/src-tauri/src/menu/DETAILS.md` § SF Symbol icons), then
        # bumping `runs-on` and this number in the same commit.
        env:
          EXPECTED_SDK_MAJOR: '26'
        run: |
          sdk="$(xcrun --show-sdk-version)"
          echo "Xcode $(xcodebuild -version | head -1 | cut -d' ' -f2), macOS SDK $sdk"
          if [ "${sdk%%.*}" != "$EXPECTED_SDK_MAJOR" ]; then
            echo "::error::macOS SDK $sdk, expected ${EXPECTED_SDK_MAJOR}.x. The runner image moved under us; see the runs-on comment in this file."
            exit 1
          fi

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        # Caching left at the action's default (on). A hosted runner is ephemeral, so there's no
        # local ~/.local/share/mise to persist and the cache is what keeps `mise install` cheap.
        # ❌ Don't set `cache: false` here without also moving back to the self-hosted runner;
        # that setting only made sense when the tools already lived on the machine.

      - name: Install tools with mise
        run: mise install

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./apps/desktop

      - name: Generate SvelteKit types
        run: pnpm exec svelte-kit sync
        working-directory: ./apps/desktop

      # `beforeBuildCommand` (the llama-server fetch and the Vite build), then cargo. `--no-bundle`
      # stops before the bundler, which is the only part of `tauri build` that signs.
      - name: Compile the frontend and the app
        run: pnpm tauri build --no-bundle --target ${{ matrix.target }}
        working-directory: ./apps/desktop

      - name: Hand the binary to the sign job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compiled-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/Cmdr
          if-no-files-found: error
          # Long enough to "Re-run failed jobs" on a `sign` job days later.
          retention-days: 7

  # Turns the `compile` job's binary into `Cmdr.app`, the DMG, and the updater archive, signs and
  # notarizes them (and in `ci` mode updater-signs the archive), and uploads them to the release.
  # The only job holding the app's signing secrets, which is why it compiles nothing: the code it
  # runs is the Tauri CLI (the bundler that signs), our stdlib-only llama-server script, Apple's
  # tools, and the pinned actions. `pnpm install` runs no install scripts, and `tauri bundle` runs
  # no `beforeBuildCommand` and no cargo build, only `cargo metadata --no-deps` (verified on Tauri
  # CLI 2.12.1 by reading `crates/tauri-cli/src/bundle.rs` and bundling a copied binary,
  # 2026-10-15). It never executes the binary it signs.
  sign:
    name: Sign and notarize (${{ matrix.arch }})
    needs: [guard, compile]
    if: >-
      !cancelled() && needs.guard.result == 'success' && needs.compile.result == 'success'
    # The same image as `compile`; see the comment there before changing either.
    runs-on: macos-26
    # Apple's notarization sits inside this budget.
    timeout-minutes: 60
    # The only job that signs the app, notarizes it, or (in `ci` mode) updater-signs it, so the
    # only one in the `release` environment besides `pkg`. That environment holds those secrets
    # and deploys from `v*` tags alone; an environment secret wins over a same-named repo secret.
    # See `docs/guides/releasing.md` § Signing secrets.
    environment: release
    permissions:
      contents: write # upload the build to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          # `asset-arch` is the arch as Tauri's bundler spells it in file names (`x64`, never
          # `x86_64`), which every asset name downstream relies on. `slices` names the
          # `compiled-*` artifacts the job takes; the universal app is both.
          - target: aarch64-apple-darwin
            arch: aarch64
            asset-arch: aarch64
            slices: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
            asset-arch: x64
            slices: x86_64
          - target: universal-apple-darwin
            arch: universal
            asset-arch: universal
            slices: aarch64 x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Install the Tauri CLI
        # The desktop app's packages with no install scripts (the way `sbom` fetches them), so the
        # npm tree lands on disk without running. Only the Tauri CLI from it ever runs here.
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @cmdr/desktop

      # Each into its own folder: `download-artifact` puts a lone artifact straight into `path`.
      - name: Fetch the compiled aarch64 binary
        if: contains(matrix.slices, 'aarch64')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-aarch64
          path: ${{ runner.temp }}/compiled/aarch64

      - name: Fetch the compiled x86_64 binary
        if: contains(matrix.slices, 'x86_64')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-x86_64
          path: ${{ runner.temp }}/compiled/x86_64

      # The universal binary is `lipo -create` of the two, in the order and with the output path
      # `tauri build --target universal-apple-darwin` uses (Tauri CLI 2.12.3,
      # `crates/tauri-cli/src/interface/rust/desktop.rs`), so `tauri bundle` gets what a one-step
      # universal build would have handed it. `lipo` is Apple's, so no build code runs here.
      - name: Put the binary where the bundler looks
        env:
          TARGET: ${{ matrix.target }}
          SLICES: ${{ matrix.slices }}
        run: |
          set -euo pipefail
          INPUTS=()
          for slice in $SLICES; do
            # The artifact comes from a job that ran third-party code, so take exactly one regular
            # file from it and nothing else. An artifact doesn't keep the executable bit.
            DIR="$RUNNER_TEMP/compiled/$slice"
            if [ "$(ls -A "$DIR")" != Cmdr ] || [ -L "$DIR/Cmdr" ] || [ ! -f "$DIR/Cmdr" ]; then
              echo "::error::The compiled-$slice artifact should hold one file, Cmdr. It holds: $(ls -lA "$DIR")"
              exit 1
            fi
            case "$slice" in
              aarch64) WANT=arm64 ;;
              x86_64) WANT=x86_64 ;;
            esac
            GOT="$(lipo -archs "$DIR/Cmdr")"
            if [ "$GOT" != "$WANT" ]; then
              echo "::error::The compiled-$slice binary is built for '$GOT', expected '$WANT'."
              exit 1
            fi
            INPUTS+=("$DIR/Cmdr")
          done
          OUT="target/$TARGET/release/Cmdr"
          mkdir -p "target/$TARGET/release"
          if [ "${#INPUTS[@]}" = 1 ]; then
            install -m 755 "${INPUTS[0]}" "$OUT"
          else
            lipo -create -output "$OUT" "${INPUTS[@]}"
            chmod 755 "$OUT"
            GOT="$(lipo -archs "$OUT")"
            if [ "$GOT" != "x86_64 arm64" ]; then
              echo "::error::The universal binary is built for '$GOT', expected 'x86_64 arm64'."
              exit 1
            fi
          fi
          echo "$OUT: $(lipo -archs "$OUT")"

      - name: Fetch llama-server
        # Downloads and checks the pinned archive against its SHA-256; `compile` did the same for
        # its build, but this job builds nothing and starts from a fresh checkout.
        run: go run scripts/download-llama-server.go
        working-directory: ./apps/desktop

      - name: Detach stale Cmdr* DMG mounts
        # The DMG bundler's `bundle_dmg.sh` fails fast (~3 s) when the "Cmdr" volume name is already
        # taken in /Volumes (typically from a previous Finder double-click on an old DMG). A
        # hosted runner has a clean /Volumes so this is a no-op there; it earns its keep on the
        # self-hosted Mac, which shares /Volumes with the dev's interactive session. Kept either
        # way because it costs nothing and the runner choice is one line away from flipping.
        # scripts/release.sh has the same guard pre-tag-push; this catches mounts appearing AFTER.
        run: |
          while IFS= read -r vol; do
            if [[ -n "$vol" ]]; then
              echo "Detaching stale mount: $vol"
              hdiutil detach "$vol" -force >/dev/null 2>&1 || true
            fi
          done < <(mount | awk -F' on ' '/\/Volumes\/Cmdr/ { sub(/ \(.*$/, "", $2); print $2 }')

      # `local` mode: the Tauri CLI refuses to bundle without an updater key once the config has a
      # pubkey, and the updater archive must still come out of the bundler (byte-for-byte the shape
      # `ci` mode ships). So it gets a key made here and thrown away with the runner: it only
      # mismatches the pubkey (a warning), and its `.sig` files are never uploaded (the upload
      # step below). The password must be non-empty, or the `||` fallback in the bundle step would
      # hand the real secret to it.
      - name: Make a throwaway updater key (local signing)
        id: throwaway-key
        if: needs.guard.outputs.update-signing == 'local'
        working-directory: ./apps/desktop
        run: |
          PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$PASSWORD"
          pnpm exec tauri signer generate --ci -p "$PASSWORD" -w "$RUNNER_TEMP/throwaway-updater.key" > /dev/null
          {
            echo "path=$RUNNER_TEMP/throwaway-updater.key"
            echo "password=$PASSWORD"
          } >> "$GITHUB_OUTPUT"

      - name: Set up llama-server signing keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # The bundler does the APP-BUNDLE signing-keychain setup itself from the
          # APPLE_CERTIFICATE env vars, but it never signs the llama-server binaries it copies in
          # as resources, so the "Sign the llama-server binaries" step needs an identity of its
          # own. On a hosted runner there is no login keychain holding the cert at all; on the
          # self-hosted Mac there is one, but the runner's launchd service (SessionCreate=true)
          # lives in its own security session where its private key isn't usable and codesign
          # fails with errSecInternalComponent (the same command works from a GUI shell). A
          # hermetic keychain is the answer on both.
          #
          # The keychain MUST be both targeted explicitly (codesign --keychain via
          # $LLAMA_SIGN_KEYCHAIN in download-llama-server.go) AND in the user keychain search
          # list: --keychain alone fails with errSecInternalComponent for a keychain outside the
          # search list (verified empirically on the self-hosted runner). The explicit --keychain
          # pins identity resolution to this keychain, so a login keychain's copy of the same
          # identity can't make resolution ambiguous (the failure mode an earlier manual-import
          # step had). The "Remove the signing material" step below deletes it and resets the
          # search list to login-only on every run, pass or fail.
          KEYCHAIN_PATH="$RUNNER_TEMP/llama-sign.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/llama-sign-cert.p12"
          security import "$RUNNER_TEMP/llama-sign-cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/llama-sign-cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"
          echo "LLAMA_SIGN_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Set up notarization credentials
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode \
            > ~/private_keys/"AuthKey_${APPLE_API_KEY}.p8"

      - name: Sign the llama-server binaries
        # Before bundling, so the bundler copies signed binaries into the app and signs the app
        # around them; notarization refuses unsigned or untimestamped ones.
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: go run scripts/download-llama-server.go sign
        working-directory: ./apps/desktop

      - name: Bundle, sign, and notarize
        working-directory: ./apps/desktop
        env:
          # The throwaway key in `local` mode; the step that makes it is skipped in `ci` mode, so
          # these fall through to the real key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.throwaway-key.outputs.path || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
            ${{ steps.throwaway-key.outputs.password || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          # With `CI` set, the DMG bundler skips the Finder AppleScript that lays out the DMG
          # window (icon positions, background). This keeps it, as every release so far had it.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: pnpm exec tauri bundle --target ${{ matrix.target }}

      - name: Remove the signing material
        if: always()
        run: |
          rm -rf ~/private_keys
          if [ -n "${LLAMA_SIGN_KEYCHAIN:-}" ] && [ -f "$LLAMA_SIGN_KEYCHAIN" ]; then
            security delete-keychain "$LLAMA_SIGN_KEYCHAIN"
          fi
          # The bundler creates a temporary signing keychain, appends it to the user keychain
          # search list, and on teardown deletes the keychain file but never restores the search
          # list. A hosted runner is thrown away, so this is only insurance there; on the
          # self-hosted Mac it is load-bearing, since a stale (deleted) entry persists across
          # releases and can re-introduce identity ambiguity. Reset the user search list to the
          # canonical login keychain so `gh` (its OAuth token lives there via secure storage) and
          # other keychain-backed tools keep working after a release.
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db"

      # The last thing between a signed build and a Mac that can't open it. A framework
      # link is a hard `LC_LOAD_DYLIB`, so one that arrived after the floor we promise
      # makes dyld refuse the app before `main`, with no runtime gate able to help.
      # v0.42.0 shipped exactly that and could not launch on Catalina at all. This is
      # the only run that sees the real bundled binary: `ci.yml` never links the app (its
      # macOS job lints and tests), so there's no Mach-O to read and `desktop-macos-framework-floor`
      # skips there. After the step above, since the check runner is Go code with third-party modules.
      - name: Check the bundled binary's frameworks against the macOS floor
        run: |
          (cd scripts/check && go build -o check .)
          # Found rather than hardcoded: this step doesn't own the bundle layout, and a
          # path that moves should not fail every release over a stale literal. Finding
          # nothing still fails, because a gate that quietly reads no binary at all is
          # worse than one that is loudly wrong.
          BINARY=$(find target -type f -path '*/bundle/macos/Cmdr.app/Contents/MacOS/Cmdr' -print -quit)
          if [ -z "$BINARY" ]; then
            echo "Found no bundled Cmdr binary under target/; the build layout moved and this gate has stopped gating." >&2
            exit 1
          fi
          echo "Reading $BINARY"
          CMDR_MACOS_BINARY="$BINARY" ./scripts/check/check --check desktop-macos-framework-floor --ci
          # The same gate one level down: a symbol INSIDE a framework that does exist.
          # `kIOMainPortDefault` (macOS 12) shipped in v0.46.0 and aborted every macOS
          # 10.15 and 11 launch with `Symbol not found`, which the framework check above
          # can't see. Runs here too because it needs both the SDK headers and a Mach-O.
          CMDR_MACOS_BINARY="$BINARY" ./scripts/check/check --check desktop-macos-symbol-floor --ci

      # Uploads under the names everything downstream builds from the version (`publish`'s
      # `latest.json` and signature checks, `pkg`, `attest`, `release-finish.sh`, the website and
      # the cask): `Cmdr_<version>_<arch>.dmg` and `Cmdr_<version>_<arch>.app.tar.gz[.sig]`. The
      # bundler names the DMG that way already; the archive gets its name here.
      - name: Upload the build to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ASSET_ARCH: ${{ matrix.asset-arch }}
          MODE: ${{ needs.guard.outputs.update-signing }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BUNDLE="target/$TARGET/release/bundle"
          STAGE="$RUNNER_TEMP/assets"
          mkdir -p "$STAGE"
          cp "$BUNDLE/dmg/Cmdr_${VERSION}_${ASSET_ARCH}.dmg" "$STAGE/"
          cp "$BUNDLE/macos/Cmdr.app.tar.gz" "$STAGE/Cmdr_${VERSION}_${ASSET_ARCH}.app.tar.gz"
          # The `.sig` assets are what `publish` reads to build `latest.json`. In `local` mode
          # they're the throwaway key's, so they stay on the runner and the laptop signs instead.
          if [ "$MODE" = ci ]; then
            cp "$BUNDLE/macos/Cmdr.app.tar.gz.sig" "$STAGE/Cmdr_${VERSION}_${ASSET_ARCH}.app.tar.gz.sig"
          fi

          # Drafts can't be fetched by tag, so the release is found in the list, like `draft` does.
          find_release() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"'
          }
          FOUND=$(find_release)
          if [ "$MODE" = ci ] && [ -z "$FOUND" ]; then
            # The three arch jobs race to create it; a loser's POST fails, and the list then
            # shows the winner's release. Not "Latest" yet: that mark is what the website
            # serves `latest.json` from, so `publish` sets it once the manifest is up.
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" \
              -f name="Cmdr $TAG" -f body='See CHANGELOG.md for details.' -F draft=false \
              -f make_latest=false --silent \
              || echo "Couldn't create the release; another arch job may have. Looking again."
            FOUND=$(find_release)
          fi
          COUNT=$(printf '%s' "$FOUND" | grep -c . || true)
          if [ "$COUNT" != 1 ]; then
            echo "::error::Expected one release for $TAG, found $COUNT: $FOUND"
            exit 1
          fi
          read -r _ IS_DRAFT <<< "$FOUND"
          # `local` mode builds into the `draft` job's draft and nothing else; `ci` mode publishes
          # as it goes, so a draft on the tag there is a leftover (§ Troubleshooting in
          # `docs/guides/releasing.md`).
          if [ "$MODE" = local ] && [ "$IS_DRAFT" != true ]; then
            echo "::error::$TAG's release is published, but local signing builds into a draft."
            exit 1
          fi
          if [ "$MODE" = ci ] && [ "$IS_DRAFT" != false ]; then
            echo "::error::$TAG has a leftover draft release. Delete it, then re-run the failed jobs."
            exit 1
          fi

          # GitHub's asset-upload API fails often enough to cost a release: v0.46.0 lost two runs
          # to it (an HTML 5xx page in place of a response, then `Error saving asset` after an
          # 8m30s hang). So each file gets four tries; `--clobber` replaces a half-saved asset.
          for file in "$STAGE"/*; do
            for attempt in 1 2 3 4; do
              if gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$file" --clobber; then
                break
              fi
              if [ "$attempt" = 4 ]; then
                echo "::error::Couldn't upload $(basename "$file") after four tries."
                exit 1
              fi
              sleep $((attempt * 15))
            done
            echo "Uploaded $(basename "$file")"
          done

  # The installer package for MDM deployment (`Cmdr_<version>_universal.pkg`), built from the app
  # inside the universal DMG AS UPLOADED, so it carries exactly the signed, notarized, stapled app
  # people download. Signed with the Developer ID Installer identity, notarized, and stapled by
  # `scripts/build-pkg.sh`, then uploaded beside the DMG (into the draft in `local` mode).
  #
  # ❗ Skips with a notice, green, while `APPLE_INSTALLER_CERTIFICATE` isn't set, so releases ship
  # without a pkg until the certificate exists. ❗ Nothing requires it to succeed: `publish` and
  # `attest` wait for it (so `checksums.txt` and the provenance cover the pkg) but run whatever it
  # ends as, and a red pkg job is fixed with "Re-run failed jobs". Signed in CI in `local` mode too:
  # an installer certificate is revocable and can't ship an update to anyone, unlike the updater key.
  # `docs/guides/releasing.md` § The installer package.
  pkg:
    name: Build the installer package
    needs: [guard, sign]
    if: >-
      !cancelled() && github.event_name == 'push' && needs.sign.result == 'success'
    runs-on: macos-26
    timeout-minutes: 45
    # It signs and notarizes, so it reads the `release` environment's Apple secrets, like `sign`.
    environment: release
    permissions:
      contents: write # upload the pkg to the release

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for the installer certificate
        id: cert
        env:
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
        run: |
          if [ -z "$APPLE_INSTALLER_CERTIFICATE" ]; then
            echo "::notice::APPLE_INSTALLER_CERTIFICATE isn't set in the release environment, so this release ships without a .pkg. Setup: docs/guides/releasing.md § The installer package."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up the installer signing keychain
        if: steps.cert.outputs.present == 'true'
        env:
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          # Same hermetic-keychain shape as `sign`'s llama-server keychain, for the same reasons:
          # targeted explicitly (`productbuild --keychain`) AND in the search list.
          KEYCHAIN_PATH="$RUNNER_TEMP/installer-sign.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo -n "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/installer-cert.p12"
          security import "$RUNNER_TEMP/installer-cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/productsign
          rm "$RUNNER_TEMP/installer-cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"
          echo "INSTALLER_SIGN_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          # The identity is the application one with the certificate kind swapped, so the team
          # has one source: `tauri.conf.json`. It must be in the keychain, or the p12 is for
          # another team or isn't an installer certificate.
          APP_IDENTITY=$(jq -r .bundle.macOS.signingIdentity apps/desktop/src-tauri/tauri.conf.json)
          IDENTITY="Developer ID Installer: ${APP_IDENTITY#Developer ID Application: }"
          security find-identity -v "$KEYCHAIN_PATH" | grep -qF "\"$IDENTITY\"" || {
            echo "::error::The certificate in APPLE_INSTALLER_CERTIFICATE isn't \"$IDENTITY\"."
            security find-identity -v "$KEYCHAIN_PATH"
            exit 1
          }
          echo "INSTALLER_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Set up notarization credentials
        if: steps.cert.outputs.present == 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode \
            > ~/private_keys/"AuthKey_${APPLE_API_KEY}.p8"

      - name: Take the app from the universal DMG as uploaded
        if: steps.cert.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "Cmdr_${VERSION}_universal.dmg" -D "$RUNNER_TEMP/dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/dmg-mount" \
            "$RUNNER_TEMP/dmg/Cmdr_${VERSION}_universal.dmg" > /dev/null
          ditto "$RUNNER_TEMP/dmg-mount/Cmdr.app" "$RUNNER_TEMP/app/Cmdr.app"
          hdiutil detach "$RUNNER_TEMP/dmg-mount" > /dev/null
          # The DMG's app is the notarized one; a pkg around anything else would be a different app.
          xcrun stapler validate "$RUNNER_TEMP/app/Cmdr.app"
          spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/app/Cmdr.app"

      - name: Build, sign, notarize, and staple the pkg
        if: steps.cert.outputs.present == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          APPLE_API_KEY_PATH="$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8" ./scripts/build-pkg.sh --app "$RUNNER_TEMP/app/Cmdr.app" --out "$RUNNER_TEMP/pkg" \
            --sign "$INSTALLER_SIGN_IDENTITY" --keychain "$INSTALLER_SIGN_KEYCHAIN" --notarize

      - name: Upload the pkg to the release
        if: steps.cert.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$RUNNER_TEMP/pkg/Cmdr_${VERSION}_universal.pkg" --clobber

      - name: Delete the installer signing keychain
        if: always()
        run: |
          if [ -n "${INSTALLER_SIGN_KEYCHAIN:-}" ] && [ -f "$INSTALLER_SIGN_KEYCHAIN" ]; then
            security delete-keychain "$INSTALLER_SIGN_KEYCHAIN"
          fi
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db"

  # CycloneDX SBOMs for what ships inside the app: the Rust crate graph (one per arch, since
  # the two target triples resolve slightly different crates) and the frontend's npm packages.
  # The `attest` job attaches them to the release and signs them.
  #
  # ❗ Its own job, with a read-only token and no OIDC, ❌ never folded into `attest`: this is
  # where third-party code runs (`cargo install` compiles build scripts, `pnpm install` pulls
  # the npm tree), and the job that can mint a signing identity should run none of it.
  # It needs only the checkout, so it runs beside the macOS builds and costs no wall-clock.
  sbom:
    name: Generate SBOMs
    needs: [guard, ci-gate]
    # The tag push only, gated like `compile`: after `ci-gate` in `ci` mode, right away in `local`.
    if: >-
      !cancelled() && github.event_name == 'push' && needs.guard.result == 'success' && (
        needs.ci-gate.result == 'success' || needs.guard.outputs.update-signing == 'local')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Install cargo-cyclonedx
        # Pinned version, `--locked` so its own dependency tree is the one it was released
        # with. The first `cargo` call here also syncs the toolchain `rust-toolchain.toml` pins.
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Fetch the frontend's npm packages
        # Only the desktop app's packages, and no install scripts: none of its packages is on
        # `allowBuilds` in `pnpm-workspace.yaml`, so a release build runs none either.
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @cmdr/desktop

      - name: Generate the SBOMs
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # `cargo cyclonedx` stamps the commit time rather than "now". The frontend SBOM carries no timestamp.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          mkdir -p sbom

          # Default features only: those are what the release build compiles. `cargo
          # cyclonedx` writes one file per workspace member beside its `Cargo.toml` (even
          # with `--manifest-path`), so the app's own file is picked out by name.
          # File names say `x64`, matching the DMGs (docs/guides/releasing.md).
          for pair in aarch64-apple-darwin:aarch64 x86_64-apple-darwin:x64; do
              triple="${pair%%:*}"
              arch="${pair##*:}"
              cargo cyclonedx --manifest-path apps/desktop/src-tauri/Cargo.toml \
                  --format json --spec-version 1.5 --target "$triple" \
                  --override-filename "sbom-$arch" -q
              mv "apps/desktop/src-tauri/sbom-$arch.json" "sbom/Cmdr_${VERSION}_${arch}.rust.cdx.json"
          done

          # The npm packages whose code is in the built frontend, read from the bundle itself by
          # a frontend build with `CMDR_FRONTEND_SBOM=1` (`apps/desktop/scripts/vite-frontend-sbom.ts`).
          # `package.json` can't answer this: Svelte ships from devDependencies, and most
          # devDependencies don't ship at all. Same commit and lockfile as the compile job, so the
          # same modules; this build's own output is thrown away.
          pnpm --filter @cmdr/desktop exec svelte-kit sync
          CMDR_FRONTEND_SBOM=1 pnpm --filter @cmdr/desktop build
          mv apps/desktop/build/sbom/frontend.cdx.json "sbom/Cmdr_${VERSION}_frontend.cdx.json"

          # Resolving must not have changed a lockfile, or the SBOM describes something
          # other than what the compile job compiled.
          git diff --exit-code -- Cargo.lock pnpm-lock.yaml

          # `actions/attest` takes a CycloneDX SBOM only if it has a `serialNumber` (optional in the
          # spec, and neither generator writes one; v0.47.0's SBOM attestations failed on exactly
          # this). Each gets a UUIDv5 of the release and file name, so a re-run writes identical files.
          for f in sbom/*.json; do
              serial="urn:uuid:$(python3 -c 'import sys, uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, sys.argv[1]))' \
                  "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}/$(basename "$f")")"
              jq --arg serial "$serial" '.serialNumber = $serial' "$f" > "$f.tmp"
              mv "$f.tmp" "$f"
          done

          # Each SBOM must be CycloneDX, name this version as its root, list a real tree, and
          # carry the serial number the attest job needs. A silently empty or mislabelled SBOM is
          # worse than none. The frontend's floor is lower because it lists only what ships
          # (about 50 packages), not every tool.
          for f in sbom/*.json; do
              case "$f" in *_frontend.cdx.json) floor=30 ;; *) floor=100 ;; esac
              jq -e --arg v "$VERSION" --argjson floor "$floor" \
                  '.bomFormat == "CycloneDX" and .metadata.component.version == $v and (.components | length) > $floor and (.serialNumber | test("^urn:uuid:"))' \
                  "$f" > /dev/null || { echo "::error::$f is not a CycloneDX SBOM of $VERSION with a full component list"; exit 1; }
              echo "$f: $(jq '.components | length' "$f") components, $(wc -c < "$f") bytes"
          done

      - name: Hand the SBOMs to the attest job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sboms
          path: sbom/
          if-no-files-found: error
          retention-days: 7

  # The release gate's GitHub half: every update archive on the release must be one the macOS
  # updater would install, checked by the app's own code (`cmdr-vet-update`: the installer's
  # extraction, Cmdr's Developer ID code signature, and the release's version). A bundle the
  # updater refuses, once in `latest.json`, would strand every install on its current version with
  # no update able to reach it. `publish` needs this job in both modes; in a `local` tag push it
  # also runs, so a bad build shows up before the laptop is asked to sign it (`release-finish.sh`
  # runs the same check again before signing). `docs/guides/releasing.md` § The release gate.
  vet-update-archives:
    name: Vet the update archives
    needs: [guard, sign]
    if: >-
      !cancelled() && needs.guard.result == 'success' && (
        github.event_name == 'workflow_dispatch' || needs.sign.result == 'success')
    # Apple's code-signature check needs macOS. Same image as `sign`.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write # read the draft release in `local` mode: a read-only token can't see drafts

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # First, and the only step that sees the token: the cargo build below runs third-party build
      # scripts, which then find no token in their environment or in `.git/config`.
      - name: Download the update archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for arch in aarch64 x64 universal; do
              gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
                  -p "Cmdr_${VERSION}_${arch}.app.tar.gz" -D "$RUNNER_TEMP/archives"
          done
          ls -l "$RUNNER_TEMP/archives"

      # The runner image's rustup syncs the toolchain `rust-toolchain.toml` pins on the first call.
      - name: Run the updater's own check on each archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          cargo run --quiet --release --locked -p cmdr-update-trust --bin cmdr-vet-update -- \
              --version "$VERSION" \
              "$RUNNER_TEMP/archives/Cmdr_${VERSION}_aarch64.app.tar.gz" \
              "$RUNNER_TEMP/archives/Cmdr_${VERSION}_x64.app.tar.gz" \
              "$RUNNER_TEMP/archives/Cmdr_${VERSION}_universal.app.tar.gz"

  # Builds `latest.json` from the `.sig` assets and ships it. In `ci` mode it follows the builds;
  # in `local` mode it's the dispatch that `scripts/release-finish.sh` starts once its signatures
  # are on the draft, and its first act is publishing that draft. Same steps either way, so the
  # manifest has one builder whoever signed.
  publish:
    name: Publish release
    # `pkg` only for ordering: its pkg (if any) is on the release before the checksums are taken.
    # The `if` below ignores how it ended. `ci-gate` (a green full CI run and CodeQL on the tagged
    # commit) and `vet-update-archives` are hard requirements.
    needs: [guard, ci-gate, sign, pkg, vet-update-archives]
    if: >-
      !cancelled() && needs.guard.result == 'success' && needs.ci-gate.result == 'success' &&
      needs.vet-update-archives.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        (needs.guard.outputs.update-signing == 'ci' && needs.sign.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the draft, upload `latest.json` and checksums, mark the release Latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download signatures from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p /tmp/signatures
          gh release download "$TAG" -p "Cmdr_*.app.tar.gz.sig" -D /tmp/signatures

          # Verify all 3 arch sigs were downloaded. The `sign` job names the `.app.tar.gz` and
          # `.app.tar.gz.sig` assets with the app version, the way the DMG names always have:
          # `Cmdr_<version>_<arch>.app.tar.gz.sig`. `gh` writes each file under the release
          # asset's own name, so these are the names on disk too.
          for arch in aarch64 x64 universal; do
              [ -f "/tmp/signatures/Cmdr_${VERSION}_${arch}.app.tar.gz.sig" ] || { echo "Missing sig for $arch"; exit 1; }
          done

      - name: Extract changelog for this version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          # Extract section for this version from CHANGELOG.md
          NOTES=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '1d;$d' | sed '/./,$!d')

          printf '%s\n' "$NOTES" > /tmp/notes.txt

      # A dispatch publishes signatures made off CI, so it proves them before anything goes public:
      # each archive needs a `.sig` that verifies against a key the app trusts, the main or the offline
      # backup one (`docs/guides/releasing.md` § Rotating to the backup updater key; an empty or foreign
      # one would otherwise land in `latest.json` and strand every install). The same verifier
      # `release-finish.sh` ran before uploading. `ci` mode's signatures come from its own build.
      - name: Install Go to verify the signatures
        if: github.event_name == 'workflow_dispatch'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: go

      - name: Verify the signatures against the app's trusted keys
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p /tmp/verify
          cp /tmp/signatures/*.app.tar.gz.sig /tmp/verify/
          for arch in aarch64 x64 universal; do
              gh release download "$TAG" -p "Cmdr_${VERSION}_${arch}.app.tar.gz" -D /tmp/verify
          done
          ./scripts/release-finish.sh -verify-dir /tmp/verify "$VERSION"

      # `local` mode's draft goes public here, after the steps above proved all three signatures
      # are on it and before anything reads the release by tag (the tags API can't see a draft).
      # Not "Latest" yet: the last step here sets that, once `latest.json` is on the release.
      # Idempotent on a re-run.
      - name: Publish the draft release
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest=false

      - name: Generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          TAG="${{ github.ref_name }}"

          # Read signatures downloaded from the release
          SIG_AARCH64=$(cat "/tmp/signatures/Cmdr_${VERSION}_aarch64.app.tar.gz.sig")
          SIG_X86_64=$(cat "/tmp/signatures/Cmdr_${VERSION}_x64.app.tar.gz.sig")
          SIG_UNIVERSAL=$(cat "/tmp/signatures/Cmdr_${VERSION}_universal.app.tar.gz.sig")

          # Query DMG sizes from the release assets (Tauri's bundler says "x64" in DMG names)
          RELEASE_JSON=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG")
          SIZE_AARCH64=$(echo "$RELEASE_JSON" | jq '[.assets[] | select(.name | endswith("_aarch64.dmg"))][0].size // 0')
          SIZE_X86_64=$(echo "$RELEASE_JSON" | jq '[.assets[] | select(.name | endswith("_x64.dmg"))][0].size // 0')
          SIZE_UNIVERSAL=$(echo "$RELEASE_JSON" | jq '[.assets[] | select(.name | endswith("_universal.dmg"))][0].size // 0')

          # Read notes from file, escape for JSON
          NOTES=$(jq -Rs . < /tmp/notes.txt)

          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG"

          jq -n --indent 2 \
            --arg version "$VERSION" \
            --argjson size_aarch64 "$SIZE_AARCH64" \
            --argjson size_x86_64 "$SIZE_X86_64" \
            --argjson size_universal "$SIZE_UNIVERSAL" \
            --argjson notes "$NOTES" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig_universal "$SIG_UNIVERSAL" \
            --arg sig_aarch64 "$SIG_AARCH64" \
            --arg sig_x86_64 "$SIG_X86_64" \
            --arg base_url "$BASE_URL" \
            '{
              version: $version,
              dmgSizes: { aarch64: $size_aarch64, x86_64: $size_x86_64, universal: $size_universal },
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-universal": { signature: $sig_universal, url: "\($base_url)/Cmdr_\($version)_universal.app.tar.gz" },
                "darwin-aarch64": { signature: $sig_aarch64, url: "\($base_url)/Cmdr_\($version)_aarch64.app.tar.gz" },
                "darwin-x86_64": { signature: $sig_x86_64, url: "\($base_url)/Cmdr_\($version)_x64.app.tar.gz" }
              }
            }' > /tmp/latest.json

          # Every installed copy of Cmdr fetches these URLs verbatim and has no fallback, so a name
          # that drifts from what the `sign` job uploaded would strand the whole install base. Fail
          # the release here instead, while nothing has shipped.
          for asset in $(jq -r '.platforms[].url | split("/") | last' /tmp/latest.json | sort -u); do
              echo "$RELEASE_JSON" | jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' > /dev/null \
                  || { echo "latest.json points at \"$asset\", which is not an asset on release $TAG"; exit 1; }
          done

      - name: Upload latest.json to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "$TAG" /tmp/latest.json --clobber

      # The only way someone who clicks Download on the website can check what they got. The
      # Homebrew cask carries a `sha256` and the updater verifies a minisign signature, but a
      # plain download had nothing to compare against, and Cmdr is listed on aggregator sites
      # that have historically served hijacked downloads (MacUpdate, 2018).
      # ❗ Hash the assets AS PUBLISHED, by downloading them back from the release, ❌ never a
      # local copy: the point is to describe what a user will actually receive.
      - name: Publish SHA-256 checksums for the DMGs and the pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          rm -rf /tmp/checksums && mkdir -p /tmp/checksums
          for arch in aarch64 x64 universal; do
              gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
                  -p "Cmdr_${VERSION}_${arch}.dmg" -D /tmp/checksums
          done
          # The pkg only when the release has one (the `pkg` job skips without its certificate).
          EXPECTED=3
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -qx "Cmdr_${VERSION}_universal.pkg"; then
              gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
                  -p "Cmdr_${VERSION}_universal.pkg" -D /tmp/checksums
              EXPECTED=4
          fi
          ( cd /tmp/checksums && shasum -a 256 ./* | sed 's| \./| |' > /tmp/checksums.txt )
          mv /tmp/checksums.txt /tmp/checksums/checksums.txt
          # One line per DMG plus the pkg: a missing file would silently ship a short list.
          LINES=$(wc -l < /tmp/checksums/checksums.txt)
          [ "$LINES" -eq "$EXPECTED" ] || { echo "expected $EXPECTED checksum lines, got $LINES"; cat /tmp/checksums/checksums.txt; exit 1; }
          cat /tmp/checksums/checksums.txt
          gh release upload "$TAG" /tmp/checksums/checksums.txt --clobber

      - name: Update release body with changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release edit "$TAG" --notes-file /tmp/notes.txt

      # The switch that ships it. The website serves the `latest.json` of the release marked
      # "Latest" (`apps/website/scripts/fetch-live-manifest.ts`, run by each deploy), and the guard
      # reads the same file, so this mark is the one pointer to the live release: nothing is
      # committed to `main`, which only takes commits CI passed. Safe because the guard proved
      # this is the newest version (or the deliberate rollback `RELEASE_REPUBLISH_TAG` names).
      - name: Mark the release Latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --latest

      - name: Trigger website deploy
        run: |
          # Compute HMAC-SHA256 signature
          PAYLOAD='{}'
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" | cut -d' ' -f2)

          # Send signed request to webhook
          curl -f -X POST https://getcmdr.com/hooks/deploy-website \
              -H "Content-Type: application/json" \
              -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
              -d "$PAYLOAD"

  # Signed SLSA build provenance for every asset on the release, and signed SBOM attestations
  # binding each SBOM to the builds it describes. Anyone can then check a download with
  # `gh attestation verify <file> --repo vdavid/cmdr`. Because this runs inside a reusable
  # workflow, the signing certificate names `release-pipeline.yml` as the signer, so
  # `--signer-workflow vdavid/cmdr/.github/workflows/release-pipeline.yml` pins it.
  #
  # ❗ In `ci` mode it runs AFTER `publish`, and nothing waits on it. Two reasons:
  # - It attests the assets AS PUBLISHED, downloaded back from the release, ❌ never the
  #   runner's `target/`: the digests have to be the exact bytes users get, after signing,
  #   notarization, stapling, and the upload.
  # - Attestation depends on Sigstore and GitHub's attestation API. If either is down, the
  #   release still ships exactly as it did before this job existed; the run goes red and
  #   "Re-run failed jobs" retries this job alone (the guard doesn't run again).
  # It runs even when `sbom` failed, so provenance never waits on the SBOM tooling.
  #
  # `local` mode runs it twice. The tag push attests the draft's build outputs right after the
  # builds, and here the laptop DOES wait on it: `scripts/release-finish.sh` refuses to sign an
  # archive without that provenance. (The draft's bytes are final, so "as published" holds.) The
  # dispatch attests the published release again, which adds `latest.json` and `checksums.txt`;
  # it skips the `.sig` files, which come from the laptop, not from this workflow.
  attest:
    name: Attest provenance and publish SBOMs
    # `pkg` for ordering only, like `publish`: in `local` mode the tag push's run attests the
    # pkg along with the rest of the draft.
    needs: [guard, sign, pkg, publish, sbom]
    if: >-
      !cancelled() && (needs.publish.result == 'success' || (
        github.event_name == 'push' && needs.guard.outputs.update-signing == 'local' &&
        needs.sign.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-scoped on purpose (`desktop-workflows-hardening` enforces it for `id-token`). A job
    # that sets `permissions` loses the workflow-level ones, so `contents` is restated.
    permissions:
      contents: write # upload the SBOMs to the release
      id-token: write # request the short-lived Sigstore signing certificate
      attestations: write # store the attestations on the repository

    steps:
      - name: Download the release assets as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Every asset, not a list of names: whatever the release carries gets attested,
          # including assets a future workflow change adds. SBOMs from an earlier run of
          # this job come along too; the step below overwrites them with this run's copies.
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D release-assets
          # A dispatch finishes a `local` release, whose signatures were made on the laptop, so
          # provenance naming this workflow as their builder would be false.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              rm -f release-assets/*.sig
          fi
          # An earlier run's provenance bundle is a statement about the other assets, not one of
          # them; this run uploads its own below.
          rm -f release-assets/*.intoto.jsonl
          # The six files people and the updater actually fetch must be here, or this job
          # would attest a partial release and look green.
          for arch in aarch64 x64 universal; do
              for ext in dmg app.tar.gz; do
                  [ -f "release-assets/Cmdr_${VERSION}_${arch}.${ext}" ] \
                      || { echo "::error::Cmdr_${VERSION}_${arch}.${ext} is not on release $TAG"; exit 1; }
              done
          done
          ls -l release-assets

      - name: Download the SBOMs
        if: ${{ needs.sbom.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
          path: sbom

      - name: Upload the SBOMs to the release
        if: ${{ needs.sbom.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" -R "$GITHUB_REPOSITORY" sbom/*.cdx.json --clobber
          # Into the provenance subjects below, so the SBOM files carry provenance too.
          cp sbom/*.cdx.json release-assets/

      - name: Attest build provenance for every release asset
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*

      # The same signed provenance, as a file on the release: one Sigstore bundle whose subjects
      # are every asset above (the DMGs, the pkg, the archives, the SBOMs). Offline tools and
      # OpenSSF Scorecard's Signed-Releases check look for an `*.intoto.jsonl` asset; the
      # attestation stored on the repo stays what `gh attestation verify` reads.
      - name: Upload the provenance bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          OUT="Cmdr_${VERSION}.intoto.jsonl"
          # One bundle per line, whatever layout the action wrote.
          jq -c . "$BUNDLE" > "$OUT"
          [ -s "$OUT" ] || { echo "::error::The provenance bundle at $BUNDLE is empty."; exit 1; }
          gh release upload "${{ github.ref_name }}" -R "$GITHUB_REPOSITORY" "$OUT" --clobber

      # One SBOM attestation per SBOM, bound to the builds it describes. The universal build
      # is both arch slices joined, so both Rust SBOMs describe it, and the pkg (universal, the
      # only one) wraps that same app. A release without a pkg is fine: the action fails only
      # when no pattern matches anything.
      - name: Attest the Apple Silicon Rust SBOM
        if: ${{ needs.sbom.result == 'success' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: sbom/Cmdr_${{ env.VERSION }}_aarch64.rust.cdx.json
          subject-path: |
            release-assets/Cmdr_${{ env.VERSION }}_aarch64.dmg
            release-assets/Cmdr_${{ env.VERSION }}_aarch64.app.tar.gz
            release-assets/Cmdr_${{ env.VERSION }}_universal.dmg
            release-assets/Cmdr_${{ env.VERSION }}_universal.app.tar.gz
            release-assets/Cmdr_${{ env.VERSION }}_*.pkg

      - name: Attest the Intel Rust SBOM
        if: ${{ needs.sbom.result == 'success' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: sbom/Cmdr_${{ env.VERSION }}_x64.rust.cdx.json
          subject-path: |
            release-assets/Cmdr_${{ env.VERSION }}_x64.dmg
            release-assets/Cmdr_${{ env.VERSION }}_x64.app.tar.gz
            release-assets/Cmdr_${{ env.VERSION }}_universal.dmg
            release-assets/Cmdr_${{ env.VERSION }}_universal.app.tar.gz
            release-assets/Cmdr_${{ env.VERSION }}_*.pkg

      - name: Attest the frontend SBOM
        if: ${{ needs.sbom.result == 'success' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: sbom/Cmdr_${{ env.VERSION }}_frontend.cdx.json
          subject-path: |
            release-assets/Cmdr_${{ env.VERSION }}_*.dmg
            release-assets/Cmdr_${{ env.VERSION }}_*.app.tar.gz
            release-assets/Cmdr_${{ env.VERSION }}_*.pkg

  bump-tap:
    name: Bump Homebrew tap
    needs: [publish]
    # ❗ Explicit, because the default `success()` reads every job upstream, and `draft` always
    # skips in `ci` mode: without this the tap silently never bumped (v0.51.0 had to be bumped by hand).
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # The repo's cask is the source of truth for everything but version and sha256, so the tap
      # gets a fresh copy of it each release. Only that one file, at the tagged commit.
      - name: Check out the cask
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/packaging/homebrew/cmdr.rb
          sparse-checkout-cone-mode: false

      - name: Bump the cask in vdavid/homebrew-tap
        env:
          # SSH deploy key with write access to vdavid/homebrew-tap and nothing else.
          # When absent (e.g. a fork or before the secret is created), skip cleanly:
          # the tap is a fallback channel, not part of the release contract.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]; then
            echo "HOMEBREW_TAP_DEPLOY_KEY absent; skipping tap bump (tap is a fallback channel)."
            exit 0
          fi

          VERSION="${TAG#v}"

          # Compute the universal DMG's sha256 from the published release asset itself,
          # not from any pre-existing checksum file (the pipeline ships none).
          DMG="Cmdr_${VERSION}_universal.dmg"
          # -R is required: this job has no checkout, so gh has no repo context to infer.
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$DMG" -D /tmp/tap-dmg
          SHA256=$(shasum -a 256 "/tmp/tap-dmg/$DMG" | cut -d' ' -f1)
          echo "Universal DMG sha256: $SHA256"

          # Clone the tap with the deploy key, copy the repo's cask over it, and fill in version and
          # sha256. Rewriting only those two lines in the tap's own copy let every other cask change
          # (the `cmdr` binary, a new zap path) silently never ship. GitHub's host keys come from
          # its API over TLS, so the SSH connection is verified, not trusted on first use.
          REPO_CASK="$GITHUB_WORKSPACE/apps/desktop/packaging/homebrew/cmdr.rb"
          SSH_DIR="$RUNNER_TEMP/tap-ssh"
          mkdir -m 700 "$SSH_DIR"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$SSH_DIR/key"
          chmod 600 "$SSH_DIR/key"
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$SSH_DIR/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $SSH_DIR/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o StrictHostKeyChecking=yes"
          git clone git@github.com:vdavid/homebrew-tap.git /tmp/homebrew-tap
          CASK="/tmp/homebrew-tap/Casks/cmdr.rb"

          cp "$REPO_CASK" "$CASK"
          sed -i -E "s|^(  version \").*(\")|\1${VERSION}\2|" "$CASK"
          sed -i -E "s|^(  sha256 \").*(\")|\1${SHA256}\2|" "$CASK"

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Cask already at version ${VERSION} with this sha256; nothing to bump."
            exit 0
          fi

          git add Casks/cmdr.rb
          git commit -m "cmdr ${VERSION}"
          git push origin HEAD
