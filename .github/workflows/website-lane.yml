name: Website lane

# The website lane, called by `ci.yml` (`website`): the released browser demo, then the site's
# checks, E2E, and Lighthouse around it. Its own file so an edit here reruns this lane alone (the
# `website` filter in `ci.yml` lists it). The deploy stays in `ci.yml`, gated on this lane.
# `docs/tooling/ci.md` § Lane files.
on:
  workflow_call:
    inputs:
      demo-suite:
        description: Whether to build the browser demo from these sources and run its full suite (the nightly full run)
        type: boolean
        required: true
      playwright-image:
        description: 'The pinned Playwright container image the site job runs in (from `changes`)'
        type: string
        required: true
      marker-key:
        description: The lane's marker key from `ci.yml`'s lane plan, saved by the `marker` job once both jobs passed
        type: string
        required: true
    secrets:
      LHCI_GITHUB_APP_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  # The browser demo the site publishes at /demo/: the LAST RELEASE's demo image, which the
  # release pipeline built from the tagged sources and attested (`scripts/released-demo.sh`), so
  # the site's E2E tests exactly the /demo/ the deploy ships, and no land builds Rust for wasm.
  # Its own job on the bare runner because `site` runs inside the Playwright image, which has no
  # Docker; `site` takes the files as an artifact and builds the site around them.
  # `apps/website/DETAILS.md` § Browser demo.
  demo:
    name: Released demo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Find the released demo image
        id: demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/released-demo.sh >>"$GITHUB_OUTPUT"

      # The image is `FROM scratch` with the bundle at its root, so a build whose only stage is
      # that image, exported as plain files, is the bundle itself (the website's Dockerfile copies
      # the same image the same way). The image is files only, but its manifest names the
      # platform it was pushed from, so the platform is spelled out for a non-amd64 host.
      - name: Unpack the browser demo
        env:
          DIGEST: ${{ steps.demo.outputs.digest }}
        run: |
          echo "FROM ghcr.io/vdavid/cmdr-demo@sha256:$DIGEST" |
            docker buildx build --platform linux/amd64 --output type=local,dest=apps/desktop/build-demo -
          test -f apps/desktop/build-demo/index.html

      - name: Upload the browser demo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: website-demo
          path: apps/desktop/build-demo/
          if-no-files-found: error
          retention-days: 1

  site:
    name: Checks, E2E, and Lighthouse
    runs-on: ubuntu-latest
    # Everything in this job runs inside the pinned Playwright image, so the E2E lane renders the
    # visual baselines in the same environment that shot them (see the `Resolve the Playwright
    # container image` step in `ci.yml`'s `changes` for why, and `apps/website/DETAILS.md` §
    # Visual baselines). The build steps ride along rather than running on the host: one
    # toolchain per job is simpler than two, and the site the baselines are shot against is then
    # built by the same Node.
    container:
      image: ${{ inputs.playwright-image }}
    timeout-minutes: 20
    needs: demo

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The checkout is owned by the host runner's UID, but this job (alone among CI's jobs)
      # runs inside the pinned Playwright `container:`, whose process UID doesn't match. Git's
      # dubious-ownership guard then refuses to read repo state, and `go build`'s VCS stamping
      # fails with "error obtaining VCS status: exit status 128" before it ever reaches our code.
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # Saved from `main` only, so a PR reads `main`'s entry and adds none (`docs/tooling/ci.md` § Build caching).
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools with mise
        run: mise install

      # Inside the container `HOME` differs, so this store is an entry of its own, saved here on `main`.
      - name: Restore the pnpm store
        id: pnpm-store
        uses: ./.github/actions/pnpm-store
        with:
          phase: restore

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Save the pnpm store
        uses: ./.github/actions/pnpm-store
        with:
          phase: save
          save: 'true'
          hit: ${{ steps.pnpm-store.outputs.hit }}

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Sync Astro types
        run: pnpm exec astro sync
        working-directory: ./apps/website

      - name: Run ESLint
        run: ./scripts/check/check --check website-eslint --ci

      - name: Check CSP connect-src covers every fetch
        run: ./scripts/check/check --check website-csp-connect-src --ci

      - name: Run typecheck
        run: ./scripts/check/check --check website-typecheck --ci

      # Where the site's build expects it (src/plugins/demo.ts), which then fails on a missing demo
      # instead of publishing a site without /demo/.
      - name: Download the browser demo
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-demo
          path: apps/desktop/build-demo/

      - name: Build website
        run: ./scripts/check/check --check website-build --ci
        env:
          CMDR_WEBSITE_DEMO: '1'

      - name: Run html-validate
        run: ./scripts/check/check --check website-html-validate --ci

      - name: Check for dead links
        run: ./scripts/check/check --check website-dead-links --ci

      - name: Check analytics injection
        run: ./scripts/check/check --check website-analytics-injection --ci

      # No browser install step: the container image ships the browsers this Playwright version
      # pins, at `PLAYWRIGHT_BROWSERS_PATH`. Installing them again would download a build for
      # whatever version npm resolved, which is how a render could quietly stop matching the image
      # the baselines were shot in. If the two ever disagree, Playwright says so ("Executable
      # doesn't exist at /ms-playwright/chromium-…") instead of rendering on the wrong Chromium.
      - name: Run E2E tests
        run: ./scripts/check/check --check website-e2e --ci

      # A visual failure is unreadable without the images: `test-results/` carries the `-actual`,
      # `-expected`, and `-diff` PNGs plus the retry traces.
      - name: Upload Playwright results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: website-playwright-results
          path: apps/website/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Lighthouse hunts for a system Chrome, which this image doesn't carry: it ships the
      # browsers Playwright pins, under `PLAYWRIGHT_BROWSERS_PATH`. Point it at that one rather
      # than installing a second Chrome. (`chromium_headless_shell-*` deliberately doesn't match
      # the glob; Lighthouse wants the full browser.)
      #
      # The build dir is `chrome-linux64` on amd64 (the runner) and `chrome-linux` on arm64
      # (a local `docker run` on an Apple Silicon laptop), so the glob has to cover both
      # (verified against `mcr.microsoft.com/playwright:v1.62.1-noble` on both arches,
      # `docker run ... ls /ms-playwright/chromium-*/`, 2026-09-08).
      - name: Point Lighthouse at the container's Chromium
        # Bash arrays and `[[`: this container's default `run:` shell is `sh` (dash), which has
        # neither, and silently ran this as a syntax error once the job got far enough to reach it.
        shell: bash
        run: |
          shopt -s nullglob
          chromes=("$PLAYWRIGHT_BROWSERS_PATH"/chromium-*/chrome-linux*/chrome)
          if [[ ${#chromes[@]} -eq 0 || ! -x "${chromes[0]}" ]]; then
            echo "No Chromium under $PLAYWRIGHT_BROWSERS_PATH; the image layout changed." >&2
            ls -la "$PLAYWRIGHT_BROWSERS_PATH" >&2 || true
            exit 1
          fi
          echo "CHROME_PATH=${chromes[0]}" >>"$GITHUB_ENV"

      - name: Run Lighthouse CI
        run: pnpm test:lighthouse
        working-directory: ./apps/website
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: lighthouse-report
          path: apps/website/.lighthouseci/
          retention-days: 7

  # The nightly full run only (`demo-suite`): the browser demo built from THESE sources and the full
  # demo suite against it (`demo.spec.ts`, the `demo` Playwright project), which the land path never
  # runs (its `site` job smoke-tests the released image), so a change that breaks the demo surfaces in
  # the next morning's CI health digest instead of in the release's `demo` job. On the bare runner:
  # it needs Rust for the demo, and the demo suite has no visual baselines tying it to the pinned
  # Playwright image. It reads the `website-demo` Rust cache the Rust lane's nightly `wasm` job
  # saves, and saves nothing. `apps/website/DETAILS.md` § Browser demo.
  demo-suite:
    name: Full browser demo suite
    if: inputs.demo-suite
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache_save: false

      - name: Install tools with mise
        run: mise install

      - name: Build the browser demo and ready its suite
        uses: ./.github/actions/website-demo-suite
        with:
          save-rust-cache: 'false'

      - name: Build the website with the demo
        run: ./scripts/check/check --check website-build --ci
        env:
          CMDR_WEBSITE_DEMO: '1'

      - name: Run the full browser demo suite
        run: ./scripts/check/check --check website-demo-e2e --ci

      - name: Upload Playwright results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: website-demo-suite-results
          path: apps/website/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The lane's marker, once every job passed (`site` needs `demo`, and this needs `site`), on the
  # bare runner (`scripts/lane-markers/DETAILS.md`). `demo-suite` may skip, but only when it
  # wasn't asked for.
  marker:
    name: Lane marker
    needs: [demo, site, demo-suite]
    if: >-
      !cancelled() && needs.demo.result == 'success' && needs.site.result == 'success' && (needs.demo-suite.result ==
      'success' || (needs.demo-suite.result == 'skipped' && !inputs.demo-suite))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Save the lane marker
        uses: ./.github/actions/lane-marker
        with:
          key: ${{ inputs.marker-key }}
