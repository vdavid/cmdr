name: Gradle wrapper

# Checks `tools/intellij-plugin/gradle/wrapper/gradle-wrapper.jar` (the repo's only binary) against
# the checksums Gradle publishes for every official release, so a tampered or unofficial wrapper jar
# can't run on a contributor's machine or in CI. Takes about 10 seconds.
#
# ❗ It runs on EVERY push to `main`, without a path filter, on purpose: OpenSSF Scorecard's
# Binary-Artifacts check stops counting a `gradle-wrapper.jar` only when a workflow using
# `gradle/actions/wrapper-validation` has a SUCCESSFUL run on the latest commit of `main`
# (`gradleWrapperValidated` in Scorecard's `checks/raw/binary_artifact.go`, verified against
# Scorecard v5.5.0, 2026-10-08). A path filter would leave most commits without a run.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '7 5 * * 1' # weekly, Monday 5:07 AM UTC, ahead of the 5:23 Scorecard run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate wrapper jar checksums
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
