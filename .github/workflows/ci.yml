name: CI

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all checks (bypass change detection)'
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Feature branches reach CI through their PR (the land script opens one on the first push), so a
# branch push runs this once, as `pull_request`; `push` covers only `main`, for the post-land deploy
# and the release gates. A new push to a PR cancels that PR's older run. `main` pushes and dispatches
# each get a group of their own (the run ID): a shared group would queue them, and GitHub cancels a QUEUED run
# when a newer one joins even without `cancel-in-progress`, which would drop a deploy or leave a
# release commit without its run.
concurrency:
  group:
    ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Rust caches (`rust-cache` in the Rust jobs) save only from `main`; a PR run restores
# `main`'s entry and saves nothing. Each entry is ~1–2 GB against the repo's 10 GB ceiling, and
# per-PR saves kept it over the line, so LRU evicted entries within minutes and nearly every PR
# run built cold (2026-10-20, PR #593). The `warm-rust-*` jobs keep `main`'s entries current.
# The E2E lane's Cargo + target cache follows the same switch (`warm-e2e-linux-cache`).
# Named so it doesn't start with `RUST` or `CARGO`: rust-cache hashes env vars with those
# prefixes into its key.
env:
  SAVE_RUST_CACHE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # ===========================================
  # Determine which jobs to run based on changed files
  # ===========================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Every job here carries a `timeout-minutes` at roughly 2x its healthy run, because the
    # GitHub default is SIX HOURS and a job that stops making progress will happily spend
    # them. A single wedged E2E app once burned 136 minutes of runner on 223 tests that each
    # sat out their own timeout. These caps are the backstop, never the mechanism: a check
    # that can hang is supposed to notice and say so (the E2E lane's own circuit breaker is
    # `apps/desktop/test/e2e-playwright/app-death.ts`). Raise a cap when the run grows into it.
    timeout-minutes: 5
    # A job-level block replaces the workflow-level one, so it restates the reads it needs.
    permissions:
      contents: read # check out the code
      checks: read # look up this commit's `CI OK` from its PR run
      pull-requests: read # find the PR a GitHub rebase merge came from
    # A landed commit already passed every lane on its PR. `pnpm land` either fast-forwards (same
    # SHA, so its PR run's green `CI OK` is on it) or has GitHub rebase-merge a green PR onto a
    # moved `main` (new SHAs; the PR's head carries the green `CI OK`). Either way the push sets
    # `verified` and every lane output reads `false`: the lanes skip, `CI OK` reports green, and
    # the post-land jobs still run off the raw `*-changed` filter. A semantic clash between two
    # PRs that each passed alone surfaces on the next PR's run (it tests the PR merged with the
    # current `main`) and on the release gate's full run. `ci-coverage` keeps every lane on this gate.
    outputs:
      verified: ${{ steps.verified.outputs.verified }}
      rust: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.rust || 'false' }}
      svelte: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.svelte || 'false' }}
      desktop: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.desktop || 'false' }}
      website: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.website || 'false' }}
      api-server: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.api-server || 'false' }}
      dashboard: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.dashboard || 'false' }}
      scripts: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.scripts || 'false' }}
      website-changed: ${{ steps.filter.outputs.website }}
      playwright-image: ${{ steps.playwright-image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Push events only: a dispatch (the release gate's `run_all`) always runs in full. Only a
      # completed, successful `CI OK` from GitHub Actions counts; this run's own is still pending.
      # Verified means a green `CI OK` on this SHA itself (fast-forward), or this SHA is the
      # `merge_commit_sha` of a merged PR into `main` whose head has one (GitHub rebase or squash
      # merge). Keying on the push's head SHA is enough: a rebase merge pushes all the PR's
      # commits at once, `github.sha` is the last, and GitHub reports exactly that one as the
      # merge commit, so the earlier replayed commits never need a verdict of their own.
      # An API hiccup falls back to a full run, never to a skip.
      - name: Look for a green CI OK on this commit or its PR's head
        id: verified
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          green_ci_ok() {
            gh api "repos/$REPO/commits/$1/check-runs?check_name=CI%20OK&filter=all" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success")] | length'
          }
          if ! count=$(green_ci_ok "$SHA"); then
            echo "::warning::Couldn't look up CI OK for $SHA; running every lane."
            count=0
          fi
          if [[ "$count" -gt 0 ]]; then
            echo "verified=true" >>"$GITHUB_OUTPUT"
            echo "$SHA already has a green CI OK (its PR run), so the lanes skip."
            exit 0
          fi
          if ! pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq \
            "[.[] | select(.merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"$SHA\")][0] // empty | \"\(.number) \(.head.sha)\""); then
            echo "::warning::Couldn't look up the PR behind $SHA; running every lane."
            pr=""
          fi
          if [[ -n "$pr" ]]; then
            read -r pr_number head_sha <<<"$pr"
            if ! count=$(green_ci_ok "$head_sha"); then
              echo "::warning::Couldn't look up CI OK for PR #$pr_number's head $head_sha; running every lane."
              count=0
            fi
            if [[ "$count" -gt 0 ]]; then
              echo "verified=true" >>"$GITHUB_OUTPUT"
              echo "$SHA is GitHub's merge of PR #$pr_number, whose head $head_sha has a green CI OK, so the lanes skip."
              exit 0
            fi
          fi
          echo "No green CI OK on $SHA or on the head of a PR it merged; running the lanes."

      # Filter design rules (the `ci-coverage` check validates the non-glob paths exist):
      # - A filter must cover every path its job's checks read, not just the obvious app dir.
      #   Example: `rust` includes both fixture-server dirs because the integration lane runs
      #   against those container configs; `svelte` includes `eslint-plugins/` and BOTH
      #   `test/e2e-shared/` and `test/e2e-playwright/`, because Vitest runs `*.test.ts` under
      #   each (see vitest.config.ts's `include`), `e2e-stale-selector` scans both roots, and
      #   ESLint covers them. Leaving `test/e2e-playwright/` out meant a change to those tests
      #   never ran the lane that runs them, so a red `svelte-tests` could only be caught by a
      #   push that happened to touch `src/` too.
      # - `.mise.toml` (toolchain versions) and this workflow file are in every filter:
      #   changing either can change any job's behavior, so everything reruns.
      # - `pnpm-lock.yaml` is in every Node-based filter so lockfile-only bumps
      #   (pnpm dedupe, transitive updates) still run the affected apps' checks.
      - name: Detect file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'apps/desktop/src-tauri/**'
              - 'apps/desktop/test/s3-servers/**'
              - 'apps/desktop/test/sftp-servers/**'
              - 'apps/desktop/test/smb-servers/**'
              - 'apps/desktop/test/webdav-servers/**'
              # The managed-policy drift guard embeds these (`managed_policy/public_docs_test.rs`).
              - 'apps/website/public/mdm/**'
              - 'apps/website/src/lib/trust.ts'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - 'rust-toolchain.toml'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
            svelte:
              - 'apps/desktop/src/**'
              - 'apps/desktop/static/**'
              - 'apps/desktop/test/e2e-shared/**'
              - 'apps/desktop/test/e2e-playwright/**'
              - 'apps/desktop/eslint-plugins/**'
              - 'eslint-plugins/**'
              - 'apps/desktop/scripts/**'
              - 'apps/desktop/package.json'
              - 'apps/desktop/vite.config.js'
              - 'apps/desktop/vitest.config.ts'
              - 'apps/desktop/eslint.config.js'
              - 'apps/desktop/tsconfig.json'
              - 'pnpm-lock.yaml'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
            desktop:
              # Gates the Linux E2E job, which builds the full app: frontend + the whole
              # Rust workspace, so the Rust workspace inputs belong here too.
              - 'apps/desktop/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
            website:
              - 'apps/website/**'
              - '.dockerignore'
              - 'CHANGELOG.md'
              - 'pnpm-lock.yaml'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
            api-server:
              - 'apps/api-server/**'
              - 'pnpm-lock.yaml'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'apps/analytics-dashboard/**'
              - 'eslint-plugins/**'
              - 'pnpm-lock.yaml'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
            scripts:
              # `apps/desktop/scripts/` holds Go files the scripts-go-* checks scan
              # (see GetGoDirectories in scripts/check/checks/common.go).
              - 'scripts/**'
              - 'apps/desktop/scripts/**'
              - '.mise.toml'
              - '.github/workflows/ci.yml'

      # The Website job runs inside this image. Its visual baselines
      # (`apps/website/e2e/visual.spec.ts`) are pixel comparisons, so the renderer that verifies
      # them has to be the renderer that shot them, and
      # `apps/website/scripts/update-visual-baselines.sh` shoots them in the pinned Playwright
      # container. Verifying on the bare runner instead put ~10% of the pixels in the tightest
      # region shots over the threshold with no change behind them: same Chromium build, different
      # host font stack.
      #
      # Both sides DERIVE the tag from the resolved `@playwright/test` version instead of naming
      # it (the script from the installed package, this from the lockfile), so a Renovate bump
      # moves capture and verification together and neither can silently drift onto another
      # renderer. This lives here because `container:` is evaluated before a job starts, so the
      # image can only come from an earlier job's output.
      - name: Resolve the Playwright container image
        id: playwright-image
        run: |
          version=$(awk '
            /^  apps\/website:$/ { site = 1; next }
            site && /^  [^ ]/ { exit }
            site && /^      .@playwright\/test.:$/ { want = 1; next }
            want && /^        version:/ { print $2; exit }
          ' pnpm-lock.yaml)
          if [[ -z "$version" ]]; then
            echo "Could not read apps/website's resolved @playwright/test version from pnpm-lock.yaml." >&2
            echo "The lockfile layout likely changed; fix this step and update-visual-baselines.sh together." >&2
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:v$version-noble" >>"$GITHUB_OUTPUT"
          echo "Website renderer: mcr.microsoft.com/playwright:v$version-noble"

  # ===========================================
  # Desktop app - Rust backend
  # ===========================================
  # No "Free disk space" step, here or in `desktop-rust-fixtures`: the runner's root disk is
  # 145 GB with 86 GB free at the start, and a cold run of each job peaked at ~80 GB used,
  # leaving 68 GB free (sampled every 5 s, PR #593, 2026-10-20). The reclaim cost ~1.5 min a
  # run. Each job ends by printing `df -h /`, so a future squeeze shows in the log.
  desktop-rust:
    name: Desktop (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: inputs.run_all || needs.changes.outputs.rust == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      # Caches the compiled `target/` dir plus the cargo registry/index/git deps,
      # keyed on Cargo.lock + rustc. The old registry-only cache left the full
      # ~1000-crate Tauri tree to recompile cold every run (~16 min); with target/
      # cached, an unchanged-deps push recompiles only the `cmdr` crate. rust-cache
      # prunes intelligently to stay under GitHub's 10 GB per-repo cache ceiling.
      #
      # `cache-on-failure` is load-bearing, not a nicety: the action's save step
      # is `post-if: success() || CACHE_ON_FAILURE`, so by default one failing
      # check means the whole job saves nothing, and every later run recompiles
      # the Tauri tree from cold while still failing. A red job is exactly when
      # the cache matters most, because that's the state you push fixes into.
      #
      # `shared-key` names the entry explicitly (it equals the job-ID key rust-cache would
      # derive anyway), so `desktop-rust-fixtures` and `warm-rust-cache` use this same entry.
      # Saved from `main` only (`SAVE_RUST_CACHE`, top of file).
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-rust
          cache-on-failure: true
          save-if: ${{ env.SAVE_RUST_CACHE }}

      - name: Install Tauri dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libacl1-dev

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Check rustfmt
        run: ./scripts/check/check --check desktop-rust-rustfmt --ci

      # Cheap static lints first, so a violation fails before the long compiles below.
      # Member coverage leads: if a crate has fallen outside the lanes, every check
      # after it is green over a smaller tree than anyone thinks.
      - name: Check workspace member coverage
        run: ./scripts/check/check --check workspace-member-coverage --ci

      # The index crates' boundary: no tauri in their trees, and the public surface
      # stays where the audit put it. Cheap (cargo metadata + a source walk), and a
      # breach here makes every later green misleading about what's encapsulated.
      - name: Check index-crate isolation
        run: ./scripts/check/check --check index-crate-isolation --ci

      # A dependency bump past a vendored fork's version makes cargo quietly resolve
      # crates.io again, so the fix stops shipping with nothing but a build warning.
      - name: Check vendored patches still apply
        run: ./scripts/check/check --check desktop-rust-vendor-patch-applied --ci

      # The app reads the advisory list leniently (a broken one is "no advisory"), so a
      # typo would silently drop a notice users should act on. Validate it before it ships.
      - name: Check the security advisory list
        run: ./scripts/check/check --check desktop-security-advisories --ci

      - name: Check cfg-gate
        run: ./scripts/check/check --check desktop-rust-cfg-gate --ci

      - name: Check log-error-macro
        run: ./scripts/check/check --check desktop-rust-log-error-macro --ci

      # The macOS deployment floor. Linux has no SDK, so this scans against the
      # committed selector list a macOS run refreshes; it's the only gate between a
      # too-new selector and an app that aborts on launch for everyone on an older Mac.
      - name: Check macos-availability
        run: ./scripts/check/check --check desktop-rust-macos-availability --ci

      - name: Check sqlite-open-direct
        run: ./scripts/check/check --check desktop-rust-sqlite-open-direct --ci

      - name: Check prompt-lint
        run: ./scripts/check/check --check desktop-prompt-lint --ci

      - name: Check discarded-outcome
        run: ./scripts/check/check --check desktop-rust-discarded-outcome --ci

      - name: Check error-string-match
        run: ./scripts/check/check --check desktop-rust-error-string-match --ci

      - name: Check fixture-lane-coverage
        run: ./scripts/check/check --check desktop-fixture-lane-coverage --ci

      - name: Check lock-poison
        run: ./scripts/check/check --check desktop-rust-lock-poison --ci

      - name: Check log-private-values
        run: ./scripts/check/check --check desktop-rust-log-private-values --ci

      - name: Check test-sleep
        run: ./scripts/check/check --check desktop-rust-test-sleep --ci

      - name: Check fixed-temp-dir
        run: ./scripts/check/check --check desktop-rust-fixed-temp-dir --ci

      - name: Check no-hand-rolled-fixture
        run: ./scripts/check/check --check desktop-rust-no-hand-rolled-fixture --ci

      - name: Check derive-default-justified
        run: ./scripts/check/check --check desktop-rust-derive-default-justified --ci

      - name: Check probe-unwrap-justified
        run: ./scripts/check/check --check desktop-rust-probe-unwrap-justified --ci

      - name: Check mtp-dropping-timeout
        run: ./scripts/check/check --check desktop-rust-mtp-dropping-timeout --ci

      - name: Check mtp-no-transport-reset
        run: ./scripts/check/check --check desktop-rust-mtp-no-transport-reset --ci

      - name: Check ipc-enum-camelcase
        run: ./scripts/check/check --check desktop-rust-ipc-enum-camelcase --ci

      - name: Check pluralize-noun
        run: ./scripts/check/check --check desktop-pluralize-noun --ci

      - name: Run jscpd
        run: ./scripts/check/check --check desktop-rust-jscpd --ci

      - name: Run cargo-machete
        run: ./scripts/check/check --check desktop-rust-cargo-machete --ci

      # Fails if THIRD-PARTY-NOTICES.md doesn't match the current lockfiles.
      # Lives in this job for the cargo toolchain plus rust-cache, which keeps
      # the `cargo install cargo-about` build out of every subsequent run.
      - name: Check third-party notices
        run: ./scripts/check/check --check desktop-third-party-notices --ci

      - name: Run clippy
        run: ./scripts/check/check --check desktop-rust-clippy --ci

      # A broken intra-doc link is invisible to every other lane, because only
      # `cargo doc` resolves one. These steps are sequential, so this lane keeps
      # the shared, cached `target/` here; locally it gets a private one to stay
      # off cargo's build-directory lock (see `desktop-rust-rustdoc.go`).
      - name: Check rustdoc links
        run: ./scripts/check/check --check desktop-rust-rustdoc --ci

      # Rendered HTML nothing downstream reads, and caching it costs twice: ~200 MB of
      # rust-cache payload, and eight `##[error]` annotations on every cold-cache run, in a
      # log where each red line reads as a cause. `Swatinem/rust-cache` treats any dir under
      # `target/` named `tests` as a cargo test profile, then walks its `target`/`trybuild`
      # children without awaiting (`src/cleanup.ts`), so the rejection escapes its `try` and
      # Node prints `ENOENT ... opendir '.../doc/cmdr_index/indexing/tests/target'`. This
      # lane documents `cmdr_index::indexing::tests` because it runs `--all-features` and the
      # module is `cfg(any(test, feature = "testing"))`. `always()`, so a failing step above
      # still leaves a doc-free cache.
      - name: Drop rustdoc HTML before it reaches the cache
        if: always()
        run: rm -rf target/doc

      # Before the suite, because it says whether the suite is running under the
      # caps and groups its config claims. A filter that selects nothing drops
      # its tests back to the global cap and full parallelism, silently.
      - name: Check nextest filter coverage
        run: ./scripts/check/check --check nextest-filter-coverage --ci

      - name: Run Rust tests
        run: ./scripts/check/check --check desktop-rust-tests --ci

      - name: Report disk usage
        if: always()
        run: df -h /

  # ===========================================
  # Desktop app - Rust against the Docker fixtures
  # ===========================================
  # The fixture lanes (SMB, SFTP, WebDAV, and S3 containers, plus a real Nextcloud) in their
  # own job, so their ~10 min of container bring-up runs alongside `desktop-rust` instead of
  # after it. Same filter and gate as `desktop-rust`; it restores that job's rust-cache entry
  # by name and never saves, so the repo keeps one Linux Rust entry. Dependency-only, like
  # every rust-cache entry: the workspace crates compile here once, with the same cargo flags
  # as `desktop-rust-tests` (`HostCargoLaneArgs`).
  desktop-rust-fixtures:
    name: Desktop (Rust, fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: changes
    if: inputs.run_all || needs.changes.outputs.rust == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-rust
          save-if: false

      - name: Install Tauri dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libacl1-dev

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Run the Docker fixture integration tests (SMB, SFTP, WebDAV, and S3)
        run: ./scripts/check/check --check desktop-rust-integration-tests --ci

      # The sabre/dav cells, against a real Nextcloud. Slow-lane locally (a ~1 GB
      # pull plus a self-install before the container listens, so a default
      # `pnpm check` never pays for it), but CI is where "does a real server
      # still answer this way" has to be asked: the three claims these cells pin
      # are the only ones in `crates/cmdr-webdav` that no Apache fixture can
      # reach. Measured 2026-09-02: ~1 min of container, seconds of tests, on a
      # build the step above already warmed.
      - name: Run the WebDAV cells against a real Nextcloud (sabre/dav)
        run: ./scripts/check/check --check desktop-rust-webdav-nextcloud --ci

      - name: Report disk usage
        if: always()
        run: |
          df -h /
          docker system df

  # ===========================================
  # Desktop app - Rust on macOS
  # ===========================================
  # Cmdr ships on macOS, but every other job here runs on ubuntu, so the code under
  # `cfg(target_os = "macos")` (FSEvents, AppKit, DiskArbitration, File Provider, TCC, the
  # `cmdr-fsevent-stream` member) was compiled, linted, and tested only on whichever Mac last ran
  # `pnpm check`. This job asks the three questions Linux can't answer for that code: does it
  # lint clean, do its intra-doc links resolve, and do its tests pass. Everything platform-blind
  # (the static scanners, rustfmt, notices, jscpd) stays in `desktop-rust` alone. Last, it runs
  # module cycles, whose baseline is a macOS module graph (an ubuntu analysis drops the
  # macOS-gated modules).
  #
  # One job, deliberately: splitting the suite into a second macOS job saved ~5 min of wall
  # time, but the account runs at most five macOS jobs at once (of 20), and with several PRs
  # in flight a second macOS job per run cost more in queue time than it saved (2026-10-20).
  #
  # Deliberately left out:
  # - `macos-availability`: the committed selector list records the NEWEST SDK it was built on
  #   (David's Mac), and an older runner SDK that knows a different selector set fails by design.
  # - `disk-images` (`hdiutil` attaches): opt-in locally for a reason; a candidate once this job
  #   has a green track record.
  # - The Docker fixture lanes: GitHub's macOS runners have no Docker.
  #
  # Required: in `ci-ok`'s `needs`, so a red macOS job fails the run and both release gates.
  # `docs/tooling/ci.md` § macOS lane. The lane's steps live in `macos-lane.yml`.
  #
  # On `main` pushes the lane shares one job-level group across runs: one runs, the newest
  # waits, and a newer push replaces the waiting one, because each `main` commit checks a
  # superset of the one before it and a burst of lands used to queue a ~40 min macOS run each.
  # `ci-ok` counts that replaced (cancelled) job as covered. PRs and dispatches (the release
  # gate's `run_all`) keep a group of their own (the run ID), so this never cancels them.
  desktop-rust-macos:
    name: Desktop (Rust, macOS)
    needs: changes
    if: inputs.run_all || needs.changes.outputs.rust == 'true'
    concurrency:
      group: macos-lane-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
      cancel-in-progress: false
    uses: ./.github/workflows/macos-lane.yml

  # ===========================================
  # Desktop app - Svelte frontend
  # ===========================================
  desktop-svelte:
    name: Desktop (Svelte)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: inputs.run_all || needs.changes.outputs.svelte == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Cache pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SvelteKit types
        run: pnpm exec svelte-kit sync
        working-directory: ./apps/desktop

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Run ESLint
        run: ./scripts/check/check --check desktop-svelte-eslint --ci

      - name: Run Stylelint
        run: ./scripts/check/check --check desktop-svelte-stylelint --ci

      - name: Check unused CSS
        run: ./scripts/check/check --check desktop-svelte-css-unused --ci

      - name: Check a11y contrast
        run: ./scripts/check/check --check desktop-svelte-a11y-contrast --ci

      - name: Check a11y coverage
        run: ./scripts/check/check --check desktop-svelte-a11y-coverage --ci

      - name: Check UI primitive coverage
        run: ./scripts/check/check --check desktop-svelte-ui-primitive-coverage --ci

      - name: Check dialog gallery coverage
        run: ./scripts/check/check --check desktop-svelte-dialog-gallery-coverage --ci

      - name: Check btn-restyle
        run: ./scripts/check/check --check desktop-svelte-btn-restyle --ci

      - name: Check bare polls
        run: ./scripts/check/check --check desktop-svelte-bare-poll --ci

      - name: Check IPC wrappers and commands have callers
        run: ./scripts/check/check --check desktop-ipc-unused --ci

      - name: Check E2E stale selectors
        run: ./scripts/check/check --check desktop-svelte-e2e-stale-selector --ci

      - name: Check Vite build target
        run: ./scripts/check/check --check desktop-vite-build-target --ci

      - name: Run svelte-check
        run: ./scripts/check/check --check desktop-svelte-check --ci

      - name: Check import cycles
        run: ./scripts/check/check --check desktop-svelte-import-cycles --ci

      - name: Run jscpd
        run: ./scripts/check/check --check desktop-svelte-jscpd --ci

      - name: Check message-keys freshness
        run: ./scripts/check/check --check desktop-message-keys-fresh --ci

      # These two live in the Svelte job, not the Rust one, even though both
      # artifacts are Rust: what goes stale is a change under
      # `apps/desktop/src/lib/intl/messages/` (a catalog directory added, or a
      # `menu.*` label edited), which only the `svelte` filter sees. Both
      # generators are dependency-light Node, so they run fine here.
      - name: Check shipped-locales freshness
        run: ./scripts/check/check --check desktop-shipped-locales-fresh --ci

      - name: Check native-strings freshness
        run: ./scripts/check/check --check desktop-native-strings-fresh --ci

      - name: Check message-key naming
        run: ./scripts/check/check --check desktop-message-key-naming --ci

      - name: Check for unused message keys
        run: ./scripts/check/check --check desktop-message-keys-unused --ci

      - name: Check message screenshot couplings
        run: ./scripts/check/check --check desktop-message-screenshots-fresh --ci

      - name: Check i18n placeholder/tag parity
        run: ./scripts/check/check --check desktop-i18n-parity --ci

      - name: Check i18n ICU validity
        run: ./scripts/check/check --check desktop-i18n-icu --ci

      - name: Check i18n tag/param name collisions
        run: ./scripts/check/check --check desktop-i18n-tag-param-collision --ci

      - name: Check <Trans> snippet parity
        run: ./scripts/check/check --check desktop-i18n-trans-snippet-parity --ci

      - name: Check i18n plural-category coverage
        run: ./scripts/check/check --check desktop-i18n-plural --ci

      - name: Check i18n translation coverage
        run: ./scripts/check/check --check desktop-i18n-coverage --ci

      - name: Check accessible names still contain their visible label
        run: ./scripts/check/check --check desktop-i18n-aria-label --ci

      - name: Run Knip
        run: ./scripts/check/check --check desktop-svelte-knip --ci

      - name: Check type drift
        run: ./scripts/check/check --check desktop-svelte-type-drift --ci

      - name: Typecheck Linux E2E suite
        run: ./scripts/check/check --check desktop-svelte-e2e-linux-typecheck --ci

      - name: Run Svelte tests
        run: ./scripts/check/check --check desktop-svelte-tests --ci

  # ===========================================
  # Desktop app - type-aware ESLint
  # ===========================================
  # The rules that need TypeScript's types (`no-unnecessary-condition`, `no-floating-promises`,
  # `no-deprecated`, ...). The `desktop-svelte` job's ESLint step runs with them OFF. They used
  # to live only in the every-six-days slow workflow, where 25 errors sat on a green `main`
  # (2026-10-21), one of them a real toast bug. Their own job, so the 2-4 min they take run
  # beside `desktop-svelte` instead of lengthening it.
  desktop-svelte-eslint-typecheck:
    name: Desktop (Svelte, type-aware ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: inputs.run_all || needs.changes.outputs.svelte == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Cache pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The type-aware config extends `$app/tsconfig`, which only `svelte-kit sync` generates.
      - name: Generate SvelteKit types
        run: pnpm exec svelte-kit sync
        working-directory: ./apps/desktop

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      # Two passes, one projectService batch per file type, each far faster than one combined.
      - name: Run type-aware ESLint (Svelte files)
        run: ./scripts/check/check --check desktop-svelte-eslint-typecheck-svelte --ci

      - name: Run type-aware ESLint (TypeScript files)
        run: ./scripts/check/check --check desktop-svelte-eslint-typecheck-typescript --ci

  # ===========================================
  # Desktop app - Playwright E2E on Linux
  # ===========================================
  desktop-e2e-linux:
    name: E2E tests (Playwright, Linux)
    runs-on: ubuntu-latest
    # ~12 min warm build + ~8.5 min for 455 tests on a green run (a cold build is ~21
    # min), so 40 leaves room for a slow runner while still cutting a runaway short.
    timeout-minutes: 40
    # Gated ONLY on change detection — not on desktop-rust OR desktop-svelte:
    # - desktop-rust: independent. A Rust unit-test failure shouldn't skip e2e
    #   (and vice versa). Gating them together hid a 4-day red-main streak in
    #   May 2026 where a flaky accent-color unit test blocked e2e on PRs that
    #   touched neither path.
    # - desktop-svelte: dropped (June 2026) to cut the critical path. e2e's
    #   Docker build runs its OWN frontend build (beforeBuildCommand), so it
    #   never consumed desktop-svelte's artifacts — the gate was only a "don't
    #   spend e2e compute if svelte's quality checks are red" optimization, and
    #   it forced e2e to wait ~4 min for desktop-svelte before starting. Now e2e
    #   starts at t=0, the single biggest wall-clock win on the per-push path.
    #   Trade: e2e runs even when svelte-check / eslint / svelte tests fail
    #   (rare); a genuine frontend BUILD error still fails e2e's own build.
    # `changes` always runs, so no always()/skip handling is needed here.
    needs: changes
    if: inputs.run_all || needs.changes.outputs.desktop == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No "Free disk space" step: it cost ~1.6 min a run for room this job doesn't
      # need. The runner's root disk is 145 GB, and every one of 109 runs
      # (2026-10-12 to 2026-10-19, #557) showed 107–108 GB free AFTER the reclaim,
      # which only ever removed preinstalled SDKs (tens of GB at most). This job
      # peaks at roughly 15 GB: the base image plus its tar on a miss, the
      # cargo/target caches, and the fixture images. The `df` keeps the headroom
      # visible in the log; if it ever runs tight, bring the reclaim back.
      - name: Prepare Docker cache dirs
        run: |
          mkdir -p /tmp/cmdr-docker-cache/cargo /tmp/cmdr-docker-cache/target /tmp/cmdr-docker-base-image
          df -h /

      # Restores main's entry on a PR (a PR can read its base branch's caches, never
      # another PR's); `warm-e2e-linux-cache` below keeps that entry alive. Restore and
      # save are split so only `main` saves (the save step after the ownership reclaim):
      # a ~1.2 GB entry per PR kept the repo over its 10 GB ceiling and evicted
      # everything into cold builds (2026-10-20, PR #593). Same switch as the Rust caches.
      - name: Restore Cargo + target (via host bind mounts into Docker)
        id: e2e-target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cmdr-docker-cache/cargo
            /tmp/cmdr-docker-cache/target
          key: ${{ runner.os }}-docker-e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-docker-e2e-

      # The E2E base image (apt packages, Node, Rust — see Dockerfile.base) as
      # a docker-save tar, so each run skips the cold ~4-min image build.
      # Keyed on the Dockerfile.base content, matching e2e-linux.sh's own
      # content-hash tag. Deliberately NO restore-keys: a stale tar's image
      # carries a different content-hash tag, so the script would rebuild
      # anyway — restoring multi-GB of unusable tar only wastes disk and time.
      - name: Cache E2E Docker base image
        id: base-image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/cmdr-docker-base-image
          key: ${{ runner.os }}-e2e-base-image-${{ hashFiles('apps/desktop/test/e2e-linux/docker/Dockerfile.base') }}

      - name: Load E2E base image from cache
        if: steps.base-image-cache.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/cmdr-docker-base-image/base.tar
          # Reclaim ~3.5 GB right away: with no restore-keys, a hit is always
          # exact, so the cache post-step won't save and the tar is dead weight.
          rm /tmp/cmdr-docker-base-image/base.tar

      - name: Run E2E tests in Docker
        run: ./scripts/e2e-linux.sh
        working-directory: ./apps/desktop
        env:
          # Point Docker volumes at host paths so actions/cache can persist them
          CARGO_VOLUME: /tmp/cmdr-docker-cache/cargo
          TARGET_VOLUME: /tmp/cmdr-docker-cache/target

      # On a base-cache miss, export the freshly built base image so the
      # actions/cache post-step (which runs even when tests fail) can save it.
      # `docker save cmdr-e2e-base` packs every tag of the repo (the content
      # hash + latest), so the next run's `docker load` restores the exact tag
      # e2e-linux.sh looks for. Guarded on the image existing in case the run
      # died before the base build.
      - name: Export E2E base image for the cache save
        if: always() && steps.base-image-cache.outputs.cache-hit != 'true'
        run: |
          if [ -n "$(docker image ls -q cmdr-e2e-base)" ]; then
            docker save cmdr-e2e-base -o /tmp/cmdr-docker-base-image/base.tar
          fi

      # The Docker build runs as root, so it writes the bind-mounted cache dirs
      # as root. The actions/cache post-step then runs as the runner user and
      # `tar` can't read root-owned files — so the save failed (warning only,
      # never fatal) on EVERY run since this cache was added, and the next run
      # always restored nothing → a fully cold ~10-min Tauri build every time.
      # Hand ownership back so the post-step can pack the cache. `always()` so
      # the build cache still saves when a test fails (the build succeeded).
      - name: Reclaim cache dir ownership for the save step
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" /tmp/cmdr-docker-cache

      # `main` only (`SAVE_RUST_CACHE`), and not on an exact hit, which has nothing new.
      # The paths and key must match the restore step above and `warm-e2e-linux-cache`.
      - name: Save Cargo + target
        if: >-
          !cancelled() && env.SAVE_RUST_CACHE == 'true' && steps.e2e-target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cmdr-docker-cache/cargo
            /tmp/cmdr-docker-cache/target
          key: ${{ steps.e2e-target-cache.outputs.cache-primary-key }}

      # ❗ The path is the Playwright `outputDir`, which for THIS lane is
      # `./test-results` resolved against the config's own directory
      # (`playwright.config.ts`), NOT the app root. Only the macOS lane overrides
      # `CMDR_E2E_OUTPUT_DIR` (see `desktop-svelte-e2e-playwright.go`). Pointed at
      # `apps/desktop/test-results/` this step matched nothing, so every failing run
      # uploaded an empty artifact and the `error-context.md` page snapshots (the
      # only evidence of what the UI actually looked like) were discarded. That's
      # why the search-open-in-pane flake outlived two fix attempts.
      # `if-no-files-found: error` keeps a future path drift loud instead of silent.
      - name: Upload E2E screenshots on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-screenshots
          path: apps/desktop/test/e2e-playwright/test-results/
          if-no-files-found: error
          retention-days: 7

      # Every app thread's stack, taken inside the container while the app is still
      # alive: after a failed run, or once the run has gone on long enough to be a
      # runaway (`dump_app_stacks` in `e2e-linux.sh`). Permanent on purpose: the drive
      # index hang in GitHub issue #564 struck one run in two to seven and logged
      # nothing at INFO, so a one-off diagnostic push can't be timed to catch the next
      # hang of any kind; this way the run that hits it names the blocked call. It
      # costs nothing on a green run. `warn`, since a failure before the app started
      # leaves nothing to dump.
      - name: Upload app thread stacks on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-app-stacks
          path: /tmp/cmdr-e2e-stacks/
          if-no-files-found: warn
          retention-days: 7

  # ===========================================
  # Keep the E2E build cache warm on main
  # ===========================================
  # A PR can restore its base branch's caches but never another PR's. Since a verified
  # `main` push skips every lane, `desktop-e2e-linux` stopped running on `main`, so no
  # main-scoped `Linux-docker-e2e-*` entry existed and each new PR's first E2E run
  # built cold: ~21 min instead of ~11, 4 of 9 PR runs on 2026-10-19 (#557). This job
  # rebuilds the two E2E caches on `main` whenever an entry for the current key is
  # missing, and costs ~20 s when both are there.
  # - Post-land, so `ci-ok` doesn't wait for it (exempt in `ciOKGateExempt`); a
  #   failure here costs the next PR a cold build, nothing more.
  # - Skips when the E2E lane itself runs on this push: that job saves the same keys.
  # - The cache `path`s and keys MUST match `desktop-e2e-linux` byte for byte, or the
  #   entries it saves are invisible to the lane (a cache's version hashes its paths).
  warm-e2e-linux-cache:
    name: Warm E2E build cache
    runs-on: ubuntu-latest
    # A cold build is ~22 min; 45 leaves room for a slow runner.
    timeout-minutes: 45
    needs: changes
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.result == 'success' &&
      needs.changes.outputs.desktop != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Look up the E2E Cargo + target cache
        id: target-lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cmdr-docker-cache/cargo
            /tmp/cmdr-docker-cache/target
          key: ${{ runner.os }}-docker-e2e-${{ hashFiles('Cargo.lock') }}
          lookup-only: true

      - name: Look up the E2E base image cache
        id: base-lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/cmdr-docker-base-image
          key: ${{ runner.os }}-e2e-base-image-${{ hashFiles('apps/desktop/test/e2e-linux/docker/Dockerfile.base') }}
          lookup-only: true

      - name: Decide whether to warm
        id: decide
        env:
          TARGET_HIT: ${{ steps.target-lookup.outputs.cache-hit }}
          BASE_HIT: ${{ steps.base-lookup.outputs.cache-hit }}
        run: |
          if [[ "$TARGET_HIT" == "true" && "$BASE_HIT" == "true" ]]; then
            echo "Both E2E caches exist on main for the current keys; nothing to warm."
            echo "warm=false" >>"$GITHUB_OUTPUT"
          else
            echo "warm=true" >>"$GITHUB_OUTPUT"
          fi

      # From here on, the same cache steps as `desktop-e2e-linux` (see its comments).
      - name: Prepare Docker cache dirs
        if: steps.decide.outputs.warm == 'true'
        run: |
          mkdir -p /tmp/cmdr-docker-cache/cargo /tmp/cmdr-docker-cache/target /tmp/cmdr-docker-base-image
          df -h /

      - name: Cache Cargo + target (via host bind mounts into Docker)
        if: steps.decide.outputs.warm == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cmdr-docker-cache/cargo
            /tmp/cmdr-docker-cache/target
          key: ${{ runner.os }}-docker-e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-docker-e2e-

      - name: Cache E2E Docker base image
        id: base-image-cache
        if: steps.decide.outputs.warm == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/cmdr-docker-base-image
          key: ${{ runner.os }}-e2e-base-image-${{ hashFiles('apps/desktop/test/e2e-linux/docker/Dockerfile.base') }}

      - name: Load E2E base image from cache
        if: steps.decide.outputs.warm == 'true' && steps.base-image-cache.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/cmdr-docker-base-image/base.tar
          rm /tmp/cmdr-docker-base-image/base.tar

      - name: Build the E2E app in Docker
        if: steps.decide.outputs.warm == 'true'
        run: ./scripts/e2e-linux.sh --build-app-only
        working-directory: ./apps/desktop
        env:
          CARGO_VOLUME: /tmp/cmdr-docker-cache/cargo
          TARGET_VOLUME: /tmp/cmdr-docker-cache/target

      - name: Export E2E base image for the cache save
        if: always() && steps.decide.outputs.warm == 'true' && steps.base-image-cache.outputs.cache-hit != 'true'
        run: |
          if [ -n "$(docker image ls -q cmdr-e2e-base)" ]; then
            docker save cmdr-e2e-base -o /tmp/cmdr-docker-base-image/base.tar
          fi

      - name: Reclaim cache dir ownership for the save step
        if: always() && steps.decide.outputs.warm == 'true'
        run: sudo chown -R "$(id -u):$(id -g)" /tmp/cmdr-docker-cache

  # ===========================================
  # Keep the Rust build caches warm on main
  # ===========================================
  # The Rust lanes save their caches from `main` only (`SAVE_RUST_CACHE`), and a verified `main`
  # push skips them, so without these jobs `main` would never hold an entry and every PR would
  # build cold. Same shape as `warm-e2e-linux-cache`: post-land, exempt from `ci-ok`
  # (`ciOKGateExempt`), skipped when the Rust lanes run on this push (they save the same keys).
  # One job per entry, since a job can only drive one rust-cache step cleanly.
  # - Each restores its entry with the lane's exact `rust-cache` inputs and the same steps
  #   before it (rust-cache hashes the rustc version and `CARGO*`/`RUST*` env into the key). On
  #   an exact hit (`cache-hit`) every build step skips and the post-step saves nothing, ~1 min.
  # - On a miss it runs the lane's compiling checks, so the save holds what the lane needs,
  #   including the tools they install into `~/.cargo/bin`.
  warm-rust-cache:
    name: Warm Rust build cache (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.result == 'success' &&
      needs.changes.outputs.rust != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      # Must match `desktop-rust`'s step.
      - name: Cache Rust build
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-rust
          cache-on-failure: true
          save-if: ${{ env.SAVE_RUST_CACHE }}

      - name: Install Tauri dependencies (Linux)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libacl1-dev

      - name: Build check tool
        if: steps.cache.outputs.cache-hit != 'true'
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Install cargo-about (third-party notices)
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-third-party-notices --ci

      - name: Install cargo-machete
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-rust-cargo-machete --ci

      - name: Build for clippy
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-rust-clippy --ci

      - name: Build for rustdoc
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-rust-rustdoc --ci

      - name: Drop rustdoc HTML before it reaches the cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: rm -rf target/doc

      # Compiles the test binaries (and installs cargo-nextest) without running the suite.
      - name: Build the test binaries
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check nextest-filter-coverage --ci

  # The `desktop-rust-macos` entry; see `warm-rust-cache`.
  warm-rust-macos-cache:
    name: Warm Rust build cache (macOS)
    runs-on: macos-26
    timeout-minutes: 90
    needs: changes
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.result == 'success' &&
      needs.changes.outputs.rust != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      # Must match the lane's step in `macos-lane.yml`.
      - name: Cache Rust build
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-rust-macos
          cache-on-failure: true
          save-if: ${{ env.SAVE_RUST_CACHE }}

      - name: Build check tool
        if: steps.cache.outputs.cache-hit != 'true'
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Build for clippy
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-rust-clippy --ci

      - name: Build for rustdoc
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-rust-rustdoc --ci

      - name: Drop rustdoc HTML before it reaches the cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: rm -rf target/doc

      # Compiles the test binaries (and installs cargo-nextest) without running the suite.
      - name: Build the test binaries
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check nextest-filter-coverage --ci

      - name: Install cargo-modules (pinned)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          version="$(./scripts/check/check --print-cargo-modules-version)"
          if [ "$(cargo-modules --version 2>/dev/null)" != "cargo-modules $version" ]; then
            cargo install cargo-modules --version "$version" --locked
          fi

  # ===========================================
  # Website
  # ===========================================
  website:
    name: Website
    runs-on: ubuntu-latest
    # Everything in this job runs inside the pinned Playwright image, so the E2E lane renders the
    # visual baselines in the same environment that shot them (see the `Resolve the Playwright
    # container image` step in `changes` for why, and `apps/website/DETAILS.md` § Visual baselines).
    # The build steps ride along rather than running on the host: one toolchain per job is simpler
    # than two, and the site the baselines are shot against is then built by the same Node.
    container:
      image: ${{ needs.changes.outputs.playwright-image }}
    timeout-minutes: 20
    needs: changes
    if: inputs.run_all || needs.changes.outputs.website == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The checkout is owned by the host runner's UID, but this job (alone among ci.yml's jobs)
      # runs inside the pinned Playwright `container:`, whose process UID doesn't match. Git's
      # dubious-ownership guard then refuses to read repo state, and `go build`'s VCS stamping
      # fails with "error obtaining VCS status: exit status 128" before it ever reaches our code.
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Cache pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Sync Astro types
        run: pnpm exec astro sync
        working-directory: ./apps/website

      - name: Run ESLint
        run: ./scripts/check/check --check website-eslint --ci

      - name: Check CSP connect-src covers every fetch
        run: ./scripts/check/check --check website-csp-connect-src --ci

      - name: Run typecheck
        run: ./scripts/check/check --check website-typecheck --ci

      - name: Build website
        run: ./scripts/check/check --check website-build --ci

      - name: Run html-validate
        run: ./scripts/check/check --check website-html-validate --ci

      - name: Check analytics injection
        run: ./scripts/check/check --check website-analytics-injection --ci

      # No browser install step: the container image ships the browsers this Playwright version
      # pins, at `PLAYWRIGHT_BROWSERS_PATH`. Installing them again would download a build for
      # whatever version npm resolved, which is how a render could quietly stop matching the image
      # the baselines were shot in. If the two ever disagree, Playwright says so ("Executable
      # doesn't exist at /ms-playwright/chromium-…") instead of rendering on the wrong Chromium.
      - name: Run E2E tests
        run: ./scripts/check/check --check website-e2e --ci

      # A visual failure is unreadable without the images: `test-results/` carries the `-actual`,
      # `-expected`, and `-diff` PNGs plus the retry traces.
      - name: Upload Playwright results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: website-playwright-results
          path: apps/website/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Lighthouse hunts for a system Chrome, which this image doesn't carry: it ships the
      # browsers Playwright pins, under `PLAYWRIGHT_BROWSERS_PATH`. Point it at that one rather
      # than installing a second Chrome. (`chromium_headless_shell-*` deliberately doesn't match
      # the glob; Lighthouse wants the full browser.)
      #
      # The build dir is `chrome-linux64` on amd64 (the runner) and `chrome-linux` on arm64
      # (a local `docker run` on an Apple Silicon laptop), so the glob has to cover both
      # (verified against `mcr.microsoft.com/playwright:v1.62.1-noble` on both arches,
      # `docker run ... ls /ms-playwright/chromium-*/`, 2026-09-08).
      - name: Point Lighthouse at the container's Chromium
        # Bash arrays and `[[`: this container's default `run:` shell is `sh` (dash), which has
        # neither, and silently ran this as a syntax error once the job got far enough to reach it.
        shell: bash
        run: |
          shopt -s nullglob
          chromes=("$PLAYWRIGHT_BROWSERS_PATH"/chromium-*/chrome-linux*/chrome)
          if [[ ${#chromes[@]} -eq 0 || ! -x "${chromes[0]}" ]]; then
            echo "No Chromium under $PLAYWRIGHT_BROWSERS_PATH; the image layout changed." >&2
            ls -la "$PLAYWRIGHT_BROWSERS_PATH" >&2 || true
            exit 1
          fi
          echo "CHROME_PATH=${chromes[0]}" >>"$GITHUB_ENV"

      - name: Run Lighthouse CI
        run: pnpm test:lighthouse
        working-directory: ./apps/website
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: lighthouse-report
          path: apps/website/.lighthouseci/
          retention-days: 7

  # ===========================================
  # API server
  # ===========================================
  api-server:
    name: API server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: inputs.run_all || needs.changes.outputs.api-server == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Cache pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Generate Worker types
        run: ./scripts/check/check --check api-server-worker-types --ci

      - name: Run ESLint
        run: ./scripts/check/check --check api-server-eslint --ci

      - name: Run typecheck
        run: ./scripts/check/check --check api-server-typecheck --ci

      - name: Run tests
        run: ./scripts/check/check --check api-server-tests --ci

  # ===========================================
  # Analytics dashboard
  # ===========================================
  dashboard:
    name: Analytics dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: inputs.run_all || needs.changes.outputs.dashboard == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Cache pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      # The type-aware checks need `$app/tsconfig` (`node_modules/$app/tsconfig.json`), which the app's tsconfig extends.
      # The `dashboard-svelte-kit-sync` check generates it locally; CI does it as a setup step so
      # the checks below can run in any order.
      - name: Generate SvelteKit types
        run: pnpm exec svelte-kit sync
        working-directory: ./apps/analytics-dashboard

      - name: Run ESLint
        run: ./scripts/check/check --check dashboard-eslint --ci

      - name: Run Stylelint
        run: ./scripts/check/check --check dashboard-stylelint --ci

      - name: Run svelte-check
        run: ./scripts/check/check --check dashboard-svelte-check --ci

      - name: Check for import cycles
        run: ./scripts/check/check --check dashboard-import-cycles --ci

      - name: Run knip
        run: ./scripts/check/check --check dashboard-knip --ci

      - name: Run tests
        run: ./scripts/check/check --check dashboard-tests --ci

      - name: Build
        run: ./scripts/check/check --check dashboard-build --ci

  # ===========================================
  # Repo hygiene (no path gate; skips only on an already-verified `main` push)
  # ===========================================
  # Catches what per-app filters can't: oxfmt formats the whole monorepo (docs,
  # configs, workflows), so a docs-only commit must still run it — otherwise
  # unformatted markdown lands on main and fails the next unrelated PR. Also the
  # single home of changelog-commit-links (it was duplicated across three jobs)
  # and the workflows/registry guards, which watch files no app filter covers.
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every run but an already-verified `main` push (see `changes`).
    needs: changes
    if: needs.changes.outputs.verified != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history so changelog-commit-links can resolve historical SHAs

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Cache pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Check oxfmt
        run: ./scripts/check/check --check oxfmt --ci

      - name: Check CHANGELOG commit links
        run: ./scripts/check/check --check changelog-commit-links --ci

      - name: Check docs reachable from AGENTS.md
        run: ./scripts/check/check --check docs-reachable --ci

      - name: Check no dead links in docs
        run: ./scripts/check/check --check docs-dead-links --ci

      - name: Check § pointers name real headings
        run: ./scripts/check/check --check docs-section-refs --ci

      - name: Check agent-doc table hygiene
        run: ./scripts/check/check --check docs-table-hygiene --ci

      - name: Check no path-shaped link text in docs
        run: ./scripts/check/check --check docs-link-text --ci

      - name: Check every CLAUDE.md has a sibling DETAILS.md
        run: ./scripts/check/check --check claude-md-details-sibling --ci

      - name: Check no source file is over the length limit
        run: ./scripts/check/check --check file-length --ci

      - name: Check no CLAUDE.md is over its word budget
        run: ./scripts/check/check --check claude-md-length --ci

      # Lives here rather than in the Svelte job: the guides it reads sit under
      # `docs/i18n/`, which no app filter watches, so an app-gated job would skip it
      # exactly when a guide edit is what broke a citation.
      - name: Check translator guides cite real message keys
        run: ./scripts/check/check --check desktop-i18n-doc-citations --ci

      # Same reason: the termbase (`concepts.json`, `<tag>/terms.json`) lives under `docs/i18n/`.
      - name: Check the translation termbase schema and coverage drift
        run: ./scripts/check/check --check desktop-i18n-termbase --ci

      # Same reason: each locale's `mechanics.json` lives under `docs/i18n/`.
      - name: Check catalog values follow each locale's declared typography
        run: ./scripts/check/check --check desktop-i18n-mechanics --ci

      - name: Check PostHog events match their catalog
        run: ./scripts/check/check --check analytics-event-catalog --ci

      # Lives here rather than in the dashboard job: its inputs span the desktop settings
      # registry AND the dashboard manifest, so an app-gated job would skip it exactly when a
      # desktop-only change is what made the manifest stale.
      - name: Check the settings-defaults manifest matches the registry
        run: ./scripts/check/check --check analytics-settings-defaults --ci

      - name: Check .mise.toml is the only Go version
        run: ./scripts/check/check --check go-version-single-source --ci

      - name: Check workflow hardening
        run: ./scripts/check/check --check workflows-hardening --ci

      - name: Check workflow rustup pins
        run: ./scripts/check/check --check workflows-rustup --ci

      # `go install` of the pinned scorecard takes a minute or two; its version lives in the
      # check file and the Go toolchain in `.mise.toml`, so either bump changes the key.
      - name: Cache scorecard
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/cmdr-go-tools/scorecard
          key: ${{ runner.os }}-scorecard-${{ hashFiles('scripts/check/checks/scorecard-local.go', '.mise.toml') }}

      - name: Check OpenSSF Scorecard's file-based checks
        run: ./scripts/check/check --check scorecard-local --ci

      - name: Check CI coverage of registry checks
        run: ./scripts/check/check --check ci-coverage --ci

  # ===========================================
  # Scripts (Go checks)
  # ===========================================
  scripts:
    name: Scripts (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: inputs.run_all || needs.changes.outputs.scripts == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Check gofmt
        run: ./scripts/check/check --check scripts-go-gofmt --ci

      - name: Run go vet
        run: ./scripts/check/check --check scripts-go-vet --ci

      - name: Run staticcheck
        run: ./scripts/check/check --check scripts-go-staticcheck --ci

      - name: Run ineffassign
        run: ./scripts/check/check --check scripts-go-ineffassign --ci

      - name: Run misspell
        run: ./scripts/check/check --check scripts-go-misspell --ci

      - name: Run gocyclo
        run: ./scripts/check/check --check scripts-go-gocyclo --ci

      - name: Run nilaway
        run: ./scripts/check/check --check scripts-go-nilaway --ci

      - name: Run deadcode
        run: ./scripts/check/check --check scripts-go-deadcode --ci

      - name: Run Go tests
        run: ./scripts/check/check --check scripts-go-tests --ci

  # ===========================================
  # Website deployment
  # ===========================================
  # This is the ONLY website deploy path. There used to be a standalone
  # deploy-website.yml that fired on the same paths — that deployed twice per
  # push and, worse, deployed even when checks failed (it didn't wait for the
  # website job). Keep deployment here, gated on the website checks passing.
  # `workflow_dispatch` on main (with run_all) doubles as the manual deploy lever.
  deploy-website:
    name: Deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploys when the website lane passed in this run, or when it skipped because the landed
    # commit was already verified on its PR and the push touched the website.
    needs: [changes, website]
    if: >-
      github.ref == 'refs/heads/main' && !cancelled() && (github.event_name == 'push' || github.event_name ==
      'workflow_dispatch') && needs.changes.result == 'success' && (needs.website.result == 'success' ||
      (needs.website.result == 'skipped' && needs.changes.outputs.verified == 'true' &&
      needs.changes.outputs.website-changed == 'true'))

    steps:
      - name: Trigger deploy webhook
        run: |
          # Compute HMAC-SHA256 signature
          PAYLOAD='{}'
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" | cut -d' ' -f2)

          # Send signed request to webhook
          curl -f -X POST https://getcmdr.com/hooks/deploy-website \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD"

  # ===========================================
  # Full-run marker for the release gate
  # ===========================================
  # Runs only when `run_all` is on, so its success is how the release gate
  # (`scripts/release-ci-gate.sh` and `release-pipeline.yml`'s `ci-gate`) tells a full run from a
  # dispatch with `run_all` off, which the runs API can't show (it carries no inputs). The gates
  # match this job's NAME, so ❌ don't rename it without updating both. It needs nothing, so it
  # marks the MODE only; the gates read green-or-red from the run's own conclusion.
  full-run:
    name: Full run (run_all)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: inputs.run_all
    steps:
      - name: Mark this run as full
        run: echo "run_all is on, so no lane skips on change detection."

  # ===========================================
  # Summary job for branch protection
  # ===========================================
  # `main`'s ruleset requires this job's check by its NAME, `CI OK`, so ❌ don't rename it. It must
  # report on every run, never be skipped: GitHub counts a skipped required check as passing.
  # - `needs` lists every job but the post-land `deploy-website` and `warm-e2e-linux-cache`
  #   (`ci-coverage` enforces it). `changes` belongs
  #   here too: when it fails, every lane is skipped, and the gate used to read that as green.
  # - `always()`, not `!cancelled()`, so a cancelled run reports red instead of skipped.
  # - Only `success` and `skipped` pass. A lane skipped by change detection is fine; `changes`
  #   itself never legitimately skips, so it must be `success`.
  # - One exception: on a `main` push, a `cancelled` `desktop-rust-macos` passes when `main`
  #   has moved past this commit, because a newer push replaced it in the lane's shared group
  #   and that run checks this code too. Any failed lookup keeps it red.
  # `docs/tooling/ci.md` § Branch protection.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        changes,
        full-run,
        desktop-rust,
        desktop-rust-fixtures,
        desktop-rust-macos,
        desktop-svelte,
        desktop-svelte-eslint-typecheck,
        desktop-e2e-linux,
        website,
        api-server,
        dashboard,
        scripts,
        hygiene,
      ]
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          covered=false
          if [[ "$EVENT" == "push" && "$REF" == "refs/heads/main" &&
            "$(jq -r '."desktop-rust-macos".result' <<<"$NEEDS")" == "cancelled" ]]; then
            if head=$(gh api "repos/$REPO/commits/main" --jq .sha) && [[ -n "$head" && "$head" != "$SHA" ]] &&
              status=$(gh api "repos/$REPO/compare/$SHA...$head" --jq .status) && [[ "$status" == "ahead" ]]; then
              covered=true
              echo "desktop-rust-macos was replaced by a newer main push's macOS run; main is at $head, which descends from $SHA."
            else
              echo "desktop-rust-macos was cancelled, and main hasn't verifiably moved past $SHA, so it counts as red."
            fi
          fi
          bad=$(jq -r --argjson covered "$covered" 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | select(($covered and .key == "desktop-rust-macos" and .value.result == "cancelled") | not)
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [[ -n "$bad" ]]; then
            echo "These jobs didn't pass:"
            echo "$bad"
            exit 1
          fi
          if [[ "$(jq -r '.changes.result' <<<"$NEEDS")" != "success" ]]; then
            echo "Change detection didn't run, so the skipped lanes prove nothing."
            exit 1
          fi
          echo "All jobs passed or were skipped by change detection"
