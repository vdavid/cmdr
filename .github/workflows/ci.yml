name: CI

# A light run (a PR push nobody asked to land yet) is titled `Light: <PR title>`, so `pnpm land`
# can tell it from a land run on the same head before either finishes; every other run keeps
# GitHub's default title (an empty `run-name` falls back to it). The condition mirrors `changes`'
# `mode` step; drift only makes `land` wait on the wrong run, never land one: the gate's name
# comes from `mode` alone (`docs/tooling/ci.md` § Light runs and land runs).
run-name: >-
  ${{ github.event_name == 'pull_request' && ((github.event.action == 'labeled' && github.event.label.name != 'land') ||
  (!contains(github.event.pull_request.labels.*.name, 'land') && github.event.pull_request.user.type != 'Bot')) &&
  format('Light: {0}', github.event.pull_request.title) || '' }}

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all checks (bypass change detection)'
        type: boolean
        default: true
  # `labeled` is how `pnpm land` asks to land the head: it adds the `land` label, and that run
  # (and every later one while the label stays) runs every lane the change needs. Any other label
  # starts a run that checks nothing (the `verified` step) in a concurrency group of its own.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
  # The nightly full run on `main`: every lane, no lane markers, no Rust test scope, as a
  # `run_all` dispatch runs (`changes`' `full` output). A `main` push that merged a green PR is
  # `verified` and skips its lanes, so a tree made of two PRs that each passed alone is never
  # tested on `main`, and later PR runs may skip or scope away the lane that would fail on it;
  # this catches that within a day. A red scheduled run emails whoever last edited this cron, as
  # a red `main` push emails its pusher. It doesn't deploy (the deploy jobs run on pushes and
  # dispatches only). `docs/tooling/ci.md` § Nightly full run.
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC daily, off-peak and off the hour

permissions:
  contents: read

# Feature branches reach CI through their PR (the land script opens one on the first push), so a
# branch push runs this once, as `pull_request`; `push` covers only `main`, for the post-land deploy
# and the release gates. A new push to a PR cancels that PR's older run. `main` pushes and dispatches
# each get a group of their own (the run ID): a shared group would queue them, and GitHub cancels a QUEUED run
# when a newer one joins even without `cancel-in-progress`, which would drop a deploy or leave a
# release commit without its run. An unrelated label's run (it checks nothing) gets its own group
# too, so it can't cancel the PR's real run.
concurrency:
  group:
    ci-${{ github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name !=
    'land') && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Rust caches (`rust-cache` in the Rust jobs) save only from `main`; a PR run restores
# `main`'s entry and saves nothing. Each entry is ~1–2 GB against the repo's 10 GB ceiling, and
# per-PR saves kept it over the line, so LRU evicted entries within minutes and nearly every PR
# run built cold (2026-10-20, PR #593). `ci-upkeep.yml`'s `warm-rust-*` jobs keep `main`'s
# entries current, after this workflow finishes, so upkeep can't turn a `main` run red.
# The E2E lane's Cargo + target cache follows the same switch (`warm-e2e-linux-cache` there).
# Named so it doesn't start with `RUST` or `CARGO`: rust-cache hashes env vars with those
# prefixes into its key. The lane files restate it (a called workflow doesn't inherit `env`).
env:
  SAVE_RUST_CACHE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # ===========================================
  # Determine which jobs to run based on changed files
  # ===========================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Every job here and in the lane files carries a `timeout-minutes` (a job that calls a lane
    # file can't; the lane's own jobs do) at roughly 2x its healthy run, because the
    # GitHub default is SIX HOURS and a job that stops making progress will happily spend
    # them. A single wedged E2E app once burned 136 minutes of runner on 223 tests that each
    # sat out their own timeout. These caps are the backstop, never the mechanism: a check
    # that can hang is supposed to notice and say so (the E2E lane's own circuit breaker is
    # `apps/desktop/test/e2e-playwright/app-death.ts`). Raise a cap when the run grows into it.
    timeout-minutes: 5
    # A job-level block replaces the workflow-level one, so it restates the reads it needs.
    permissions:
      contents: read # check out the code
      checks: read # look up this commit's `CI OK` from its PR run
      pull-requests: read # find the PR a GitHub merge commit came from, list a PR's files (Scorecard)
      actions: read # list the lane markers (`lane-markers plan`)
    # A landed commit already passed every lane on its PR. `pnpm land` either fast-forwards (same
    # SHA, so its PR run's green `CI OK` is on it) or has GitHub merge a green PR into a moved
    # `main` (a new merge commit; the PR's head carries the green `CI OK`). Either way the push sets
    # `verified` and every lane output reads `false`: the lanes skip, `CI OK` reports green, and
    # the post-land jobs still run off the raw `*-changed` filter. A semantic clash between two
    # PRs that each passed alone surfaces on the next PR's run (it tests the PR merged with the
    # current `main`) and on the release gate's full run. A PR whose tested tree already passed sets
    # `verified` the same way (the `verified` step). `ci-coverage` keeps every lane on this gate.
    outputs:
      verified: ${{ steps.verified.outputs.verified }}
      same-tree: ${{ steps.same-tree.outputs.same-tree }}
      # A land run: every event but a pull request, and a pull request that `pnpm land` asked to
      # land (the `land` label) or a bot opened (Renovate automerges on green `CI OK`). Only a land
      # run runs the heavy lanes and names its gate `CI OK`; a light run's gate is `CI light`,
      # which `main`'s ruleset doesn't accept (`mode` step).
      land: ${{ steps.mode.outputs.land }}
      # The heavy lanes (the three Rust lanes and Linux E2E) run on a land run only.
      rust:
        ${{ steps.verified.outputs.verified != 'true' && steps.mode.outputs.land == 'true' && steps.filter.outputs.rust
        || 'false' }}
      rust-fixtures:
        ${{ steps.verified.outputs.verified != 'true' && steps.mode.outputs.land == 'true' &&
        steps.filter.outputs.rust-fixtures || 'false' }}
      rust-macos:
        ${{ steps.verified.outputs.verified != 'true' && steps.mode.outputs.land == 'true' &&
        steps.filter.outputs.rust-macos || 'false' }}
      svelte: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.svelte || 'false' }}
      desktop:
        ${{ steps.verified.outputs.verified != 'true' && steps.mode.outputs.land == 'true' &&
        steps.filter.outputs.desktop || 'false' }}
      website: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.website || 'false' }}
      api-server: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.api-server || 'false' }}
      dashboard: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.dashboard || 'false' }}
      scripts: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.scripts || 'false' }}
      finder-extension:
        ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.finder-extension || 'false' }}
      termbase: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.termbase || 'false' }}
      changelog: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.changelog || 'false' }}
      # A pull request runs Scorecard on the path filter or the content scan (`scorecard-scan`);
      # a push or dispatch that runs the light lane always runs it.
      scorecard:
        ${{ steps.verified.outputs.verified != 'true' && (steps.filter.outputs.scorecard == 'true' ||
        steps.scorecard-scan.outputs.hit == 'true' || github.event_name != 'pull_request') && 'true' || 'false' }}
      website-changed: ${{ steps.filter.outputs.website }}
      playwright-image: ${{ steps.playwright-image.outputs.image }}
      # A full run: a `run_all` dispatch (the release gate) or the nightly schedule. Every lane
      # runs, markers and the Rust test scope are ignored, and `CI OK` reds any skipped lane.
      full: ${{ inputs.run_all == true || github.event_name == 'schedule' }}
      # Per lane `{hash, key, verified, ref}`: a lane whose exact inputs already passed in a trusted
      # run skips on `verified`, and saves its marker under `key` when it passes
      # (`scripts/lane-markers/DETAILS.md`). Not gated on `steps.verified`: a verified run's lane
      # outputs already read `false`, and the lanes' `if:` reads both.
      lanes: ${{ steps.lanes.outputs.lanes }}
      # The macOS lane's runner, as JSON for `runs-on`: an idle slot of David's M1 for a trusted
      # run while one is free, else GitHub's hosted `macos-26` (`macos-runner` step).
      macos-runs-on: ${{ steps.macos-runner.outputs.runs-on }}
      macos-self-hosted: ${{ steps.macos-runner.outputs.self-hosted }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Light run or land run. A pull request runs light (the cheap lanes, gate `CI light`) until
      # `pnpm land` asks to land it by adding the `land` label; then that run, any re-run of it, and
      # every later push while the label stays run as a land run (every lane the change needs, gate
      # `CI OK`). Everything here is the event payload GitHub writes: only someone with triage
      # access can label a PR, so a fork PR can't ask, and a bot's PR (Renovate, which automerges
      # on green) always lands. Pushes, dispatches (`run_all`), and the schedule always land.
      # `ignored` is a run started by some other label: it checks nothing (the `verified` step).
      # `run-name` at the top mirrors this. `docs/tooling/ci.md` § Light runs and land runs.
      - name: Decide between a light run and a land run
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HAS_LAND_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'land') }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          land=false ignored=false
          if [[ "$EVENT" != "pull_request" ]]; then
            land=true
            echo "A $EVENT run: a land run."
          elif [[ "$ACTION" == "labeled" && "$LABEL" != "land" ]]; then
            ignored=true
            echo "Started by the '$LABEL' label, which asks for nothing: this run checks nothing."
          elif [[ "$HAS_LAND_LABEL" == "true" ]]; then
            land=true
            echo "The PR carries the 'land' label (pnpm land asked to land it): a land run, every lane the change needs."
          elif [[ "$AUTHOR_TYPE" == "Bot" ]]; then
            land=true
            echo "A bot's PR, which lands on green CI by itself: a land run."
          else
            echo "Nobody asked to land this PR yet: a light run. The Rust lanes and Linux E2E wait for 'pnpm land', and the gate reports 'CI light', which main doesn't accept."
          fi
          echo "land=$land" >>"$GITHUB_OUTPUT"
          echo "ignored=$ignored" >>"$GITHUB_OUTPUT"

      # Pushes and pull requests: a dispatch (the release gate's `run_all`) always runs in full.
      # Only a completed, successful `CI OK` from GitHub Actions counts; this run's own is still
      # pending. An API hiccup falls back to running the lanes, never to a skip.
      # - Push: verified means a green `CI OK` on this SHA itself (fast-forward), or this SHA is
      #   the `merge_commit_sha` of a merged PR into `main` whose head has one (a GitHub merge
      #   commit, or a rebase or squash merge). Keying on the push's head SHA is enough: a merge
      #   commit is `github.sha` itself, and a rebase merge's `merge_commit_sha` is the last
      #   replayed commit, which is `github.sha` too.
      # - Pull request: verified means the tree this run tests (the merge ref's, checked out
      #   here) is byte-identical to the PR head's, and the head already has a green `CI OK`. The
      #   trees match exactly when the base hasn't moved past the head's parent, and since `main`
      #   only moves forward, the run that went green tested that same tree. This is what lets a
      #   release's merge-back (`pnpm land -merge`, its head the release commit, which the
      #   release gate's `run_all` run already passed) report green in a minute instead of
      #   re-running every lane its version bump lights up. If `main` moved, the merged tree is
      #   new and the lanes run.
      - name: Look for a green CI OK on this commit, its PR's head, or the same tree
        id: verified
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IGNORED: ${{ steps.mode.outputs.ignored }}
        run: |
          if [[ "$IGNORED" == "true" ]]; then
            echo "verified=true" >>"$GITHUB_OUTPUT"
            echo "An unrelated label started this run, so every lane skips; its gate reports 'CI light'."
            exit 0
          fi
          green_ci_ok() {
            gh api "repos/$REPO/commits/$1/check-runs?check_name=CI%20OK&filter=all" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success")] | length'
          }
          if [[ "$EVENT" == "pull_request" ]]; then
            if ! tested_tree=$(git rev-parse 'HEAD^{tree}') ||
              ! head_tree=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq .tree.sha) ||
              [[ -z "$tested_tree" || -z "$head_tree" ]]; then
              echo "::warning::Couldn't read the trees of this run and of $HEAD_SHA; running the lanes."
              exit 0
            fi
            if [[ "$tested_tree" != "$head_tree" ]]; then
              echo "The base moved past $HEAD_SHA's parent, so this run tests a new tree ($tested_tree); running the lanes."
              exit 0
            fi
            if ! count=$(green_ci_ok "$HEAD_SHA"); then
              echo "::warning::Couldn't look up CI OK for $HEAD_SHA; running the lanes."
              exit 0
            fi
            if [[ "$count" -gt 0 ]]; then
              echo "verified=true" >>"$GITHUB_OUTPUT"
              echo "This run tests $HEAD_SHA's exact tree ($head_tree), which already has a green CI OK, so the lanes skip."
            else
              echo "No green CI OK on $HEAD_SHA yet; running the lanes."
            fi
            exit 0
          fi
          if ! count=$(green_ci_ok "$SHA"); then
            echo "::warning::Couldn't look up CI OK for $SHA; running every lane."
            count=0
          fi
          if [[ "$count" -gt 0 ]]; then
            echo "verified=true" >>"$GITHUB_OUTPUT"
            echo "$SHA already has a green CI OK (its PR run), so the lanes skip."
            exit 0
          fi
          if ! pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq \
            "[.[] | select(.merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"$SHA\")][0] // empty | \"\(.number) \(.head.sha)\""); then
            echo "::warning::Couldn't look up the PR behind $SHA; running every lane."
            pr=""
          fi
          if [[ -n "$pr" ]]; then
            read -r pr_number head_sha <<<"$pr"
            if ! count=$(green_ci_ok "$head_sha"); then
              echo "::warning::Couldn't look up CI OK for PR #$pr_number's head $head_sha; running every lane."
              count=0
            fi
            if [[ "$count" -gt 0 ]]; then
              echo "verified=true" >>"$GITHUB_OUTPUT"
              echo "$SHA is GitHub's merge of PR #$pr_number, whose head $head_sha has a green CI OK, so the lanes skip."
              exit 0
            fi
          fi
          echo "No green CI OK on $SHA or on the head of a PR it merged; running the lanes."

      # Pull requests only. A PR whose head tree is byte-identical to its base's changes no file:
      # a `pnpm land -record N` record, an `ours` merge that only makes a contributor's PR head an
      # ancestor of `main` (`docs/guides/handling-prs.md`). Then `hygiene` has nothing to check
      # and skips, while the path-filtered lanes already skip on a PR with no files, so `CI OK`
      # reports in about a minute. It compares tree SHAs, which match only when every byte does,
      # never a file list. The base side is the branch's tip now: the event's `base.sha` can
      # trail it on a re-push, which would only cost a needless hygiene run. A failed lookup
      # falls back to running hygiene, never to a skip.
      - name: Check whether the PR changes any file at all
        id: same-tree
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if ! head_tree=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq .tree.sha) ||
            ! base_tree=$(gh api "repos/$REPO/branches/$BASE_REF" --jq .commit.commit.tree.sha) ||
            [[ -z "$head_tree" || -z "$base_tree" ]]; then
            echo "::warning::Couldn't read the trees of $HEAD_SHA and $BASE_REF; running hygiene."
            exit 0
          fi
          if [[ "$head_tree" == "$base_tree" ]]; then
            echo "same-tree=true" >>"$GITHUB_OUTPUT"
            echo "The PR head $HEAD_SHA has $BASE_REF's exact tree ($head_tree), so hygiene skips."
          else
            echo "The PR changes the tree ($base_tree to $head_tree), so hygiene runs."
          fi

      # Filter design rules (`ci-coverage` validates the non-glob paths exist and enforces the
      # lane-file and gated-check rules below; `docs/tooling/ci.md` § Change detection):
      # - A filter must cover every path its job's checks read, not just the obvious app dir.
      #   Example: `rust` includes both fixture-server dirs because the integration lane runs
      #   against those container configs; `svelte` includes `eslint-plugins/` and BOTH
      #   `test/e2e-shared/` and `test/e2e-playwright/`, because Vitest runs `*.test.ts` under
      #   each (see vitest.config.ts's `include`), `e2e-stale-selector` scans both roots, and
      #   ESLint covers them. Leaving `test/e2e-playwright/` out meant a change to those tests
      #   never ran the lane that runs them, so a red `svelte-tests` could only be caught by a
      #   push that happened to touch `src/` too.
      # - Each lane's steps live in its own `<lane>-lane.yml`, and only that lane's filter lists
      #   it, plus every composite action it uses, so a lane-file edit reruns that lane alone.
      #   The three Rust lanes share their inputs through the `rust-inputs` anchor and add their
      #   own lane file each.
      # - `.mise.toml` (toolchain versions) and this workflow file are in every filter:
      #   changing either can change any job's behavior, so everything reruns.
      # - `pnpm-lock.yaml` is in every Node-based filter so lockfile-only bumps
      #   (pnpm dedupe, transitive updates) still run the affected apps' checks.
      # - The light lane's gated hygiene checks (`termbase`, `changelog`, `scorecard`) carry
      #   their check's full input set as the check runner fingerprints it (`Inputs`,
      #   `GlobalInputs`, and the runner files its `Run` reaches); `ci-coverage` fails when one
      #   drifts. `scorecard` is the one deliberate narrowing: the check fingerprints the whole
      #   repo, but Scorecard's file checks read only the paths below plus every file's content
      #   for binaries and shell scripts, which the light lane checks on the PR's own files.
      # - `rust`, `svelte`, `desktop`, and `scripts` skip agent docs (`CLAUDE.md`, `DETAILS.md`): their
      #   jobs never read them, while every docs check and `analytics-event-catalog` (which reads one)
      #   run in the light lane on every change. Other `.md` files stay in: the agent prompts
      #   (`src-tauri/src/agent/prompts/*.md`) and `CHANGELOG.md` compile into the app.
      # Not on the nightly schedule: a full run reads no filter, and a schedule has no change to
      # compare against.
      - name: Detect file changes
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            # What the three Rust lanes share; no job reads this output.
            rust-inputs: &rust-inputs
              - 'apps/desktop/src-tauri/**'
              # Compiled in the macOS lane (`finder-extension-compile`).
              - 'apps/desktop/finder-extension/**'
              - 'apps/desktop/test/nfs-servers/**'
              - 'apps/desktop/test/s3-servers/**'
              - 'apps/desktop/test/sftp-servers/**'
              - 'apps/desktop/test/smb-servers/**'
              - 'apps/desktop/test/webdav-servers/**'
              # The managed-policy drift guard embeds these (`managed_policy/public_docs_test.rs`).
              - 'apps/website/public/mdm/**'
              - 'apps/website/src/lib/trust-mdm.ts'
              # The browser listing engine's event drift guard embeds this (`cmdr-listing-wasm`).
              - 'apps/desktop/src/lib/ipc/bindings.ts'
              # Built and smoke-run by `desktop-rust-listing-wasm`.
              - 'scripts/build-listing-wasm.sh'
              - 'scripts/build-listing-wasm/**'
              # Files outside every crate that the app's build or tests read
              # (`rustTestScopeRules` names each reader; `rust-test-scope_test.go` keeps
              # this list and those rules in step).
              - 'CHANGELOG.md'
              - 'apps/desktop/src/lib/commands/command-ids.ts'
              - 'apps/desktop/src/lib/logging/bridge-redaction-cases.json'
              - 'apps/desktop/src/lib/logging/log-markers.json'
              - 'apps/desktop/src/lib/units/drive-figure-cases.json'
              - 'apps/desktop/src/lib/units/free-percent-cases.json'
              - 'apps/desktop/src/lib/intl/messages/**'
              - 'apps/desktop/src/lib/ask-cmdr/ask-cmdr-tool-label-keys.ts'
              - 'apps/desktop/test/fixtures/encodings/**'
              - 'apps/desktop/scripts/download-llama-server.go'
              - 'crates/**'
              - 'vendor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - 'rust-toolchain.toml'
              # clippy and rustfmt read these (`ci-coverage` rule 8 names every check input
              # a lane's filter misses).
              - 'clippy.toml'
              - 'rustfmt.toml'
              # The check runner builds and runs every Rust check; its tests run in the light
              # lane's Go section.
              - 'scripts/check.sh'
              - 'scripts/check/**'
              - '!scripts/check/**/*_test.go'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
              # The composite actions all three Rust lane files use.
              - '.github/actions/lane-marker/**'
              - '.github/actions/rust-test-scope/**'
              - '!**/CLAUDE.md'
              - '!**/DETAILS.md'
            rust:
              - *rust-inputs
              # `desktop-third-party-notices` and `desktop-rust-fuzz-lock-in-step`, which only
              # this lane runs.
              - 'deny.toml'
              - 'pnpm-lock.yaml'
              - 'THIRD-PARTY-NOTICES.md'
              - 'apps/desktop/src/lib/licensing/third-party-packages.gen.json'
              - 'fuzz/Cargo.lock'
              - '.github/workflows/rust-lane.yml'
              - '.github/actions/free-disk-if-small/**'
              - '.github/actions/pinned-rust-toolchain/**'
              - '.github/actions/tauri-linux-deps/**'
              - '.github/actions/wasm-toolchain/**'
            rust-fixtures:
              - *rust-inputs
              - '.github/workflows/rust-fixtures-lane.yml'
              - '.github/actions/free-disk-if-small/**'
              - '.github/actions/pinned-rust-toolchain/**'
              - '.github/actions/tauri-linux-deps/**'
            rust-macos:
              - *rust-inputs
              - '.github/workflows/macos-lane.yml'
              - '.github/actions/pinned-rust-toolchain/**'
            # Gates the macOS lane's Finder extension compile, about a minute on a cold runner,
            # so it runs only when something it builds or runs changed (and on `run_all`).
            finder-extension:
              - 'apps/desktop/finder-extension/**'
              - 'scripts/check/checks/desktop-finder-extension-compile.go'
              - '.github/workflows/macos-lane.yml'
              - '.github/actions/lane-marker/**'
              - '.github/actions/pinned-rust-toolchain/**'
              - '.github/actions/rust-test-scope/**'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
              - '!**/CLAUDE.md'
              - '!**/DETAILS.md'
            svelte:
              - 'apps/desktop/src/**'
              - 'apps/desktop/static/**'
              # The whole test tree: Vitest, ESLint, and the scans read `e2e-shared/` and
              # `e2e-playwright/`, and `desktop-svelte-e2e-linux-typecheck` reads `e2e-linux/`.
              - 'apps/desktop/test/**'
              - 'apps/desktop/knip.json'
              - 'apps/desktop/.stylelintrc.mjs'
              # `desktop-native-strings-fresh` and `desktop-shipped-locales-fresh` compare the
              # catalogs with these generated Rust, plist, and Finder extension files.
              - 'apps/desktop/src-tauri/src/intl/**'
              - 'apps/desktop/src-tauri/Info.plist'
