name: CI

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all checks (bypass change detection)'
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Feature branches reach CI through their PR (the land script opens one on the first push), so a
# branch push runs this once, as `pull_request`; `push` covers only `main`, for the post-land deploy
# and the release gates. A new push to a PR cancels that PR's older run. `main` pushes and dispatches
# each get a group of their own (the run ID): a shared group would queue them, and GitHub cancels a QUEUED run
# when a newer one joins even without `cancel-in-progress`, which would drop a deploy or leave a
# release commit without its run.
concurrency:
  group:
    ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Rust caches (`rust-cache` in the Rust jobs) save only from `main`; a PR run restores
# `main`'s entry and saves nothing. Each entry is ~1–2 GB against the repo's 10 GB ceiling, and
# per-PR saves kept it over the line, so LRU evicted entries within minutes and nearly every PR
# run built cold (2026-10-20, PR #593). The `warm-rust-*` jobs keep `main`'s entries current.
# The E2E lane's Cargo + target cache follows the same switch (`warm-e2e-linux-cache`).
# Named so it doesn't start with `RUST` or `CARGO`: rust-cache hashes env vars with those
# prefixes into its key. The lane files restate it (a called workflow doesn't inherit `env`).
#
# `LIGHT_LANE_RUNNER` is the light lane's runner, the one switch that moves it to the
# self-hosted `cmdr-light` runner. A fork PR never gets it, whatever this says: the `changes`
# job's runner step hands a fork PR `ubuntu-latest` (a self-hosted runner must never run code
# from outside the repo).
env:
  SAVE_RUST_CACHE: ${{ github.ref == 'refs/heads/main' }}
  LIGHT_LANE_RUNNER: ubuntu-latest

jobs:
  # ===========================================
  # Determine which jobs to run based on changed files
  # ===========================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # Every job here and in the lane files carries a `timeout-minutes` (a job that calls a lane
    # file can't; the lane's own jobs do) at roughly 2x its healthy run, because the
    # GitHub default is SIX HOURS and a job that stops making progress will happily spend
    # them. A single wedged E2E app once burned 136 minutes of runner on 223 tests that each
    # sat out their own timeout. These caps are the backstop, never the mechanism: a check
    # that can hang is supposed to notice and say so (the E2E lane's own circuit breaker is
    # `apps/desktop/test/e2e-playwright/app-death.ts`). Raise a cap when the run grows into it.
    timeout-minutes: 5
    # A job-level block replaces the workflow-level one, so it restates the reads it needs.
    permissions:
      contents: read # check out the code
      checks: read # look up this commit's `CI OK` from its PR run
      pull-requests: read # find the PR a GitHub merge commit came from
    # A landed commit already passed every lane on its PR. `pnpm land` either fast-forwards (same
    # SHA, so its PR run's green `CI OK` is on it) or has GitHub merge a green PR into a moved
    # `main` (a new merge commit; the PR's head carries the green `CI OK`). Either way the push sets
    # `verified` and every lane output reads `false`: the lanes skip, `CI OK` reports green, and
    # the post-land jobs still run off the raw `*-changed` filter. A semantic clash between two
    # PRs that each passed alone surfaces on the next PR's run (it tests the PR merged with the
    # current `main`) and on the release gate's full run. A PR whose tested tree already passed sets
    # `verified` the same way (the `verified` step). `ci-coverage` keeps every lane on this gate.
    outputs:
      verified: ${{ steps.verified.outputs.verified }}
      same-tree: ${{ steps.same-tree.outputs.same-tree }}
      rust: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.rust || 'false' }}
      rust-fixtures: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.rust-fixtures || 'false' }}
      rust-macos: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.rust-macos || 'false' }}
      svelte: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.svelte || 'false' }}
      desktop: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.desktop || 'false' }}
      website: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.website || 'false' }}
      api-server: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.api-server || 'false' }}
      dashboard: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.dashboard || 'false' }}
      scripts: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.scripts || 'false' }}
      finder-extension:
        ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.finder-extension || 'false' }}
      termbase: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.termbase || 'false' }}
      changelog: ${{ steps.verified.outputs.verified != 'true' && steps.filter.outputs.changelog || 'false' }}
      # Pull requests only use the path filter (the light lane adds the content-based half); a
      # push or dispatch that runs the light lane always runs Scorecard.
      scorecard:
        ${{ steps.verified.outputs.verified != 'true' && (steps.filter.outputs.scorecard == 'true' || github.event_name
        != 'pull_request') && 'true' || 'false' }}
      website-changed: ${{ steps.filter.outputs.website }}
      playwright-image: ${{ steps.playwright-image.outputs.image }}
      light-runner: ${{ steps.light-runner.outputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pushes and pull requests: a dispatch (the release gate's `run_all`) always runs in full.
      # Only a completed, successful `CI OK` from GitHub Actions counts; this run's own is still
      # pending. An API hiccup falls back to running the lanes, never to a skip.
      # - Push: verified means a green `CI OK` on this SHA itself (fast-forward), or this SHA is
      #   the `merge_commit_sha` of a merged PR into `main` whose head has one (a GitHub merge
      #   commit, or a rebase or squash merge). Keying on the push's head SHA is enough: a merge
      #   commit is `github.sha` itself, and a rebase merge's `merge_commit_sha` is the last
      #   replayed commit, which is `github.sha` too.
      # - Pull request: verified means the tree this run tests (the merge ref's, checked out
      #   here) is byte-identical to the PR head's, and the head already has a green `CI OK`. The
      #   trees match exactly when the base hasn't moved past the head's parent, and since `main`
      #   only moves forward, the run that went green tested that same tree. This is what lets a
      #   release's merge-back (`pnpm land -merge`, its head the release commit, which the
      #   release gate's `run_all` run already passed) report green in a minute instead of
      #   re-running every lane its version bump lights up. If `main` moved, the merged tree is
      #   new and the lanes run.
      - name: Look for a green CI OK on this commit, its PR's head, or the same tree
        id: verified
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          green_ci_ok() {
            gh api "repos/$REPO/commits/$1/check-runs?check_name=CI%20OK&filter=all" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success")] | length'
          }
          if [[ "$EVENT" == "pull_request" ]]; then
            if ! tested_tree=$(git rev-parse 'HEAD^{tree}') ||
              ! head_tree=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq .tree.sha) ||
              [[ -z "$tested_tree" || -z "$head_tree" ]]; then
              echo "::warning::Couldn't read the trees of this run and of $HEAD_SHA; running the lanes."
              exit 0
            fi
            if [[ "$tested_tree" != "$head_tree" ]]; then
              echo "The base moved past $HEAD_SHA's parent, so this run tests a new tree ($tested_tree); running the lanes."
              exit 0
            fi
            if ! count=$(green_ci_ok "$HEAD_SHA"); then
              echo "::warning::Couldn't look up CI OK for $HEAD_SHA; running the lanes."
              exit 0
            fi
            if [[ "$count" -gt 0 ]]; then
              echo "verified=true" >>"$GITHUB_OUTPUT"
              echo "This run tests $HEAD_SHA's exact tree ($head_tree), which already has a green CI OK, so the lanes skip."
            else
              echo "No green CI OK on $HEAD_SHA yet; running the lanes."
            fi
            exit 0
          fi
          if ! count=$(green_ci_ok "$SHA"); then
            echo "::warning::Couldn't look up CI OK for $SHA; running every lane."
            count=0
          fi
          if [[ "$count" -gt 0 ]]; then
            echo "verified=true" >>"$GITHUB_OUTPUT"
            echo "$SHA already has a green CI OK (its PR run), so the lanes skip."
            exit 0
          fi
          if ! pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq \
            "[.[] | select(.merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"$SHA\")][0] // empty | \"\(.number) \(.head.sha)\""); then
            echo "::warning::Couldn't look up the PR behind $SHA; running every lane."
            pr=""
          fi
          if [[ -n "$pr" ]]; then
            read -r pr_number head_sha <<<"$pr"
            if ! count=$(green_ci_ok "$head_sha"); then
              echo "::warning::Couldn't look up CI OK for PR #$pr_number's head $head_sha; running every lane."
              count=0
            fi
            if [[ "$count" -gt 0 ]]; then
              echo "verified=true" >>"$GITHUB_OUTPUT"
              echo "$SHA is GitHub's merge of PR #$pr_number, whose head $head_sha has a green CI OK, so the lanes skip."
              exit 0
            fi
          fi
          echo "No green CI OK on $SHA or on the head of a PR it merged; running the lanes."

      # Pull requests only. A PR whose head tree is byte-identical to its base's changes no file:
      # a `pnpm land -record N` record, an `ours` merge that only makes a contributor's PR head an
      # ancestor of `main` (`docs/guides/handling-prs.md`). Then `hygiene` has nothing to check
      # and skips, while the path-filtered lanes already skip on a PR with no files, so `CI OK`
      # reports in about a minute. It compares tree SHAs, which match only when every byte does,
      # never a file list. The base side is the branch's tip now: the event's `base.sha` can
      # trail it on a re-push, which would only cost a needless hygiene run. A failed lookup
      # falls back to running hygiene, never to a skip.
      - name: Check whether the PR changes any file at all
        id: same-tree
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if ! head_tree=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq .tree.sha) ||
            ! base_tree=$(gh api "repos/$REPO/branches/$BASE_REF" --jq .commit.commit.tree.sha) ||
            [[ -z "$head_tree" || -z "$base_tree" ]]; then
            echo "::warning::Couldn't read the trees of $HEAD_SHA and $BASE_REF; running hygiene."
            exit 0
          fi
          if [[ "$head_tree" == "$base_tree" ]]; then
            echo "same-tree=true" >>"$GITHUB_OUTPUT"
            echo "The PR head $HEAD_SHA has $BASE_REF's exact tree ($head_tree), so hygiene skips."
          else
            echo "The PR changes the tree ($base_tree to $head_tree), so hygiene runs."
          fi

      # The light lane's runner: `LIGHT_LANE_RUNNER` (top of file), except on a PR from a fork,
      # which always gets `ubuntu-latest`. A self-hosted runner keeps state between jobs and sits
      # on our own network, so code from outside the repo must never reach it. Pushes and
      # dispatches come from the repo itself.
      - name: Pick the light lane's runner
        id: light-runner
        env:
          WANT: ${{ env.LIGHT_LANE_RUNNER }}
          FROM_REPO:
            ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name ==
            github.repository }}
        run: |
          if [[ "$FROM_REPO" == true ]]; then
            runner="$WANT"
          else
            runner=ubuntu-latest
            echo "A fork PR, so the light lane runs on ubuntu-latest."
          fi
          echo "runner=$runner" >>"$GITHUB_OUTPUT"
          echo "Light lane runner: $runner"

      # Filter design rules (`ci-coverage` validates the non-glob paths exist and enforces the
      # lane-file and gated-check rules below; `docs/tooling/ci.md` § Change detection):
      # - A filter must cover every path its job's checks read, not just the obvious app dir.
      #   Example: `rust` includes both fixture-server dirs because the integration lane runs
      #   against those container configs; `svelte` includes `eslint-plugins/` and BOTH
      #   `test/e2e-shared/` and `test/e2e-playwright/`, because Vitest runs `*.test.ts` under
      #   each (see vitest.config.ts's `include`), `e2e-stale-selector` scans both roots, and
      #   ESLint covers them. Leaving `test/e2e-playwright/` out meant a change to those tests
      #   never ran the lane that runs them, so a red `svelte-tests` could only be caught by a
      #   push that happened to touch `src/` too.
      # - Each lane's steps live in its own `<lane>-lane.yml`, and only that lane's filter lists
      #   it, plus every composite action it uses, so a lane-file edit reruns that lane alone.
      #   The three Rust lanes share their inputs through the `rust-inputs` anchor and add their
      #   own lane file each.
      # - `.mise.toml` (toolchain versions) and this workflow file are in every filter:
      #   changing either can change any job's behavior, so everything reruns.
      # - `pnpm-lock.yaml` is in every Node-based filter so lockfile-only bumps
      #   (pnpm dedupe, transitive updates) still run the affected apps' checks.
      # - The light lane's gated hygiene checks (`termbase`, `changelog`, `scorecard`) carry
      #   their check's full input set as the check runner fingerprints it (`Inputs`,
      #   `GlobalInputs`, and the runner files its `Run` reaches); `ci-coverage` fails when one
      #   drifts. `scorecard` is the one deliberate narrowing: the check fingerprints the whole
      #   repo, but Scorecard's file checks read only the paths below plus every file's content
      #   for binaries and shell scripts, which the light lane checks on the PR's own files.
      # - `rust`, `svelte`, `desktop`, and `scripts` skip agent docs (`CLAUDE.md`, `DETAILS.md`): their
      #   jobs never read them, while every docs check and `analytics-event-catalog` (which reads one)
      #   run in the light lane on every change. Other `.md` files stay in: the agent prompts
      #   (`src-tauri/src/agent/prompts/*.md`) and `CHANGELOG.md` compile into the app.
      - name: Detect file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            # What the three Rust lanes share; no job reads this output.
            rust-inputs: &rust-inputs
              - 'apps/desktop/src-tauri/**'
              # Compiled in the macOS lane (`finder-extension-compile`).
              - 'apps/desktop/finder-extension/**'
              - 'apps/desktop/test/nfs-servers/**'
              - 'apps/desktop/test/s3-servers/**'
              - 'apps/desktop/test/sftp-servers/**'
              - 'apps/desktop/test/smb-servers/**'
              - 'apps/desktop/test/webdav-servers/**'
              # The managed-policy drift guard embeds these (`managed_policy/public_docs_test.rs`).
              - 'apps/website/public/mdm/**'
              - 'apps/website/src/lib/trust-mdm.ts'
              # The browser listing engine's event drift guard embeds this (`cmdr-listing-wasm`).
              - 'apps/desktop/src/lib/ipc/bindings.ts'
              # Built and smoke-run by `desktop-rust-listing-wasm`.
              - 'scripts/build-listing-wasm.sh'
              - 'scripts/build-listing-wasm/**'
              # Files outside every crate that the app's build or tests read
              # (`rustTestScopeRules` names each reader; `rust-test-scope_test.go` keeps
              # this list and those rules in step).
              - 'CHANGELOG.md'
              - 'apps/desktop/src/lib/commands/command-ids.ts'
              - 'apps/desktop/src/lib/logging/bridge-redaction-cases.json'
              - 'apps/desktop/src/lib/logging/log-markers.json'
              - 'apps/desktop/src/lib/units/drive-figure-cases.json'
              - 'apps/desktop/src/lib/units/free-percent-cases.json'
              - 'apps/desktop/src/lib/intl/messages/**'
              - 'apps/desktop/src/lib/ask-cmdr/ask-cmdr-tool-label-keys.ts'
              - 'apps/desktop/test/fixtures/encodings/**'
              - 'apps/desktop/scripts/download-llama-server.go'
              - 'crates/**'
              - 'vendor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - 'rust-toolchain.toml'
              # The check runner builds and runs every Rust check; its tests run in the light
              # lane's Go section.
              - 'scripts/check.sh'
              - 'scripts/check/**'
              - '!scripts/check/**/*_test.go'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
              - '!**/CLAUDE.md'
              - '!**/DETAILS.md'
            rust:
              - *rust-inputs
              - '.github/workflows/rust-lane.yml'
              - '.github/actions/free-disk-if-small/**'
              - '.github/actions/pinned-rust-toolchain/**'
              - '.github/actions/tauri-linux-deps/**'
              - '.github/actions/wasm-toolchain/**'
            rust-fixtures:
              - *rust-inputs
              - '.github/workflows/rust-fixtures-lane.yml'
              - '.github/actions/free-disk-if-small/**'
              - '.github/actions/pinned-rust-toolchain/**'
              - '.github/actions/tauri-linux-deps/**'
            rust-macos:
              - *rust-inputs
              - '.github/workflows/macos-lane.yml'
              - '.github/actions/pinned-rust-toolchain/**'
            # Gates the macOS lane's Finder extension compile, about a minute on a cold runner,
            # so it runs only when something it builds or runs changed (and on `run_all`).
            finder-extension:
              - 'apps/desktop/finder-extension/**'
              - 'scripts/check/checks/desktop-finder-extension-compile.go'
              - '.github/workflows/macos-lane.yml'
              - '.github/actions/pinned-rust-toolchain/**'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
              - '!**/CLAUDE.md'
              - '!**/DETAILS.md'
            svelte:
              - 'apps/desktop/src/**'
              - 'apps/desktop/static/**'
              - 'apps/desktop/test/e2e-shared/**'
              - 'apps/desktop/test/e2e-playwright/**'
              - 'apps/desktop/eslint-plugins/**'
              - 'eslint-plugins/**'
              - 'apps/desktop/scripts/**'
              - 'apps/desktop/package.json'
              - 'apps/desktop/vite.config.js'
              - 'apps/desktop/vitest.config.ts'
              - 'apps/desktop/eslint.config.js'
              - 'apps/desktop/tsconfig.json'
              - 'pnpm-lock.yaml'
              - 'scripts/check.sh'
              - 'scripts/check/**'
              - '!scripts/check/**/*_test.go'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/svelte-lane.yml'
              - '!**/CLAUDE.md'
              - '!**/DETAILS.md'
            desktop:
              # Gates the Linux E2E lane, which builds the full app: frontend + the whole
              # Rust workspace, so the Rust workspace inputs belong here too.
              - 'apps/desktop/**'
              - 'crates/**'
              # Compiled into the app it builds: the patched crates and the embedded changelog.
              - 'vendor/**'
              - 'CHANGELOG.md'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/e2e-linux-lane.yml'
              - '!**/CLAUDE.md'
              - '!**/DETAILS.md'
            website:
              - 'apps/website/**'
              # The site's ESLint config imports the shared rules.
              - 'eslint-plugins/**'
              - '.dockerignore'
              - 'CHANGELOG.md'
              - 'pnpm-lock.yaml'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/website-lane.yml'
              - '.github/actions/build-website-demo/**'
              - '.github/actions/pinned-rust-toolchain/**'
              - '.github/actions/wasm-toolchain/**'
              # The browser demo the site publishes at /demo/ (`website-demo` builds it), so a
              # change to the desktop frontend or the listing engine redeploys the site. Must
              # cover every path `scripts/website-demo-key.sh` hashes into the demo image's tag
              # (`TestWebsiteDemoInputsMatchTheImageKey`).
              - 'scripts/website-demo-key.sh'
              - 'package.json'
              - 'feature-status.json'
              - 'apps/desktop/src/**'
              - 'apps/desktop/static/**'
              - 'apps/desktop/package.json'
              - 'apps/desktop/vite.config.js'
              - 'apps/desktop/tsconfig.json'
              - 'apps/desktop/scripts/precompress-demo.ts'
              - 'crates/cmdr-listing-wasm/**'
              - 'crates/cmdr-listing/**'
              - 'crates/cmdr-fs/**'
              - 'crates/cmdr-collation/**'
              - 'crates/cmdr-brief-columns/**'
              - 'crates/cmdr-menu/**'
              - 'crates/cmdr-operations/**'
              - 'crates/cmdr-operation-log/**'
              - 'crates/cmdr-archive/**'
              - 'crates/cmdr-viewer/**'
              - 'brand/screenshots/**'
              - 'apps/desktop/test/e2e-shared/media-fixtures/**'
              - 'crates/cmdr-sort/**'
              - 'crates/cmdr-search/**'
              - 'crates/cmdr-recents/**'
              - 'vendor/**'
              - 'scripts/build-listing-wasm.sh'
              - 'scripts/build-listing-wasm/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'scripts/check.sh'
              - 'scripts/check/**'
              - '!scripts/check/**/*_test.go'
              - '!**/CLAUDE.md'
              - '!**/DETAILS.md'
            api-server:
              - 'apps/api-server/**'
              # Its ESLint config imports the shared rules.
              - 'eslint-plugins/**'
              - 'pnpm-lock.yaml'
              - 'scripts/check.sh'
              - 'scripts/check/**'
              - '!scripts/check/**/*_test.go'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/light-lane.yml'
              - '.github/actions/light-cache/**'
            dashboard:
              - 'apps/analytics-dashboard/**'
              - 'eslint-plugins/**'
              - 'pnpm-lock.yaml'
              - 'scripts/check.sh'
              - 'scripts/check/**'
              - '!scripts/check/**/*_test.go'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/light-lane.yml'
              - '.github/actions/light-cache/**'
            scripts:
              # `apps/desktop/scripts/` holds Go files the scripts-go-* checks scan
              # (see GetGoDirectories in scripts/check/checks/common.go).
              - 'scripts/**'
              - 'apps/desktop/scripts/**'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/light-lane.yml'
              - '.github/actions/light-cache/**'
              - '!**/CLAUDE.md'
              - '!**/DETAILS.md'
            # The light lane's gated hygiene checks. Each lists its check's fingerprint inputs
            # (`ci-coverage` names any that's missing), plus the lane's own files.
            termbase:
              - 'docs/i18n/**'
              - 'apps/desktop/src/lib/intl/messages/**'
              - 'apps/desktop/scripts/i18n-*.ts'
              - 'apps/desktop/scripts/i18n-termbase-baseline.json'
              - 'scripts/check/checks/desktop-i18n-termbase.go'
              - 'scripts/check/checks/desktop-i18n-term-consistency.go'
              - 'scripts/check/checks/desktop-message-screenshots-fresh.go'
              - 'scripts/check.sh'
              - 'scripts/check/*.go'
              - 'scripts/check/go.mod'
              - 'scripts/check/go.sum'
              - 'scripts/check/stack-lease/**'
              - 'scripts/check/stacklease/**'
              - 'scripts/check/checks/cache.go'
              - 'scripts/check/checks/common.go'
              - 'scripts/check/checks/fingerprint.go'
              - 'scripts/check/checks/fixture-stacks.go'
              - 'scripts/check/checks/inputs.go'
              - 'scripts/check/checks/nfs_ports.go'
              - 'scripts/check/checks/registry.go'
              - 'scripts/check/checks/runner-sources.go'
              - 'scripts/check/checks/s3_ports.go'
              - 'scripts/check/checks/sftp_ports.go'
              - 'scripts/check/checks/smb_ports.go'
              - 'scripts/check/checks/test-log.go'
              - 'scripts/check/checks/webdav_ports.go'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/light-lane.yml'
              - '.github/actions/light-cache/**'
            changelog:
              - 'CHANGELOG.md'
              - 'scripts/check/checks/changelog-commit-links.go'
              - 'scripts/check.sh'
              - 'scripts/check/*.go'
              - 'scripts/check/go.mod'
              - 'scripts/check/go.sum'
              - 'scripts/check/stack-lease/**'
              - 'scripts/check/stacklease/**'
              - 'scripts/check/checks/cache.go'
              - 'scripts/check/checks/common.go'
              - 'scripts/check/checks/fingerprint.go'
              - 'scripts/check/checks/fixture-stacks.go'
              - 'scripts/check/checks/inputs.go'
              - 'scripts/check/checks/nfs_ports.go'
              - 'scripts/check/checks/registry.go'
              - 'scripts/check/checks/runner-sources.go'
              - 'scripts/check/checks/s3_ports.go'
              - 'scripts/check/checks/sftp_ports.go'
              - 'scripts/check/checks/smb_ports.go'
              - 'scripts/check/checks/test-log.go'
              - 'scripts/check/checks/webdav_ports.go'
              - '.mise.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/light-lane.yml'
              - '.github/actions/light-cache/**'
            # The paths OpenSSF Scorecard's file-based checks read (scorecard v5.5.0, `checks/raw/`),
            # minus the content-based half the light lane looks for itself:
            # - `.github/**`: Dangerous-Workflow, SAST, and Token-Permissions read
            #   `.github/workflows/*`; Pinned-Dependencies reads their `uses:` and `run:` blocks;
            #   Dependency-Update-Tool reads `.github/dependabot.yml` and `.github/renovate.json*`;
            #   Security-Policy reads `.github/security.*`. It also covers this file, the lane
            #   files, and the composite actions.
            # - Pinned-Dependencies' container half reads `*Dockerfile*`, case-insensitively.
            # - Dependency-Update-Tool: `renovate.json*` and `.renovaterc*` at the root.
            # - License: a top-level `LICENSE`/`COPYING`/`COPYRIGHT`/`PATENT` file or folder, in any case.
            # - Security-Policy: `security.*` at the root or in `docs/`, in any case (it also reads
            #   `doc/`, which doesn't exist; a new policy there can't move a score that's at 10).
            # - Fuzzing: the cargo-fuzz harness under `fuzz/`, what scores it 10. (ClusterFuzzLite's
            #   `.clusterfuzzlite/Dockerfile` already matches the Dockerfile pattern.)
            # - The check itself: its baseline, its runner files, and `GlobalInputs`.
            scorecard:
              - '.github/**'
              - '**/*[Dd][Oo][Cc][Kk][Ee][Rr][Ff][Ii][Ll][Ee]*'
              - 'renovate.json*'
              - '.renovaterc*'
              - '*[Ll][Ii][Cc][Ee][Nn][CcSs][Ee]*'
              - '*[Ll][Ii][Cc][Ee][Nn][CcSs][Ee]*/**'
              - '*[Cc][Oo][Pp][Yy][Ii][Nn][Gg]*'
              - '*[Cc][Oo][Pp][Yy][Ii][Nn][Gg]*/**'
              - '*[Cc][Oo][Pp][Yy][Rr][Ii][Gg][Hh][Tt]*'
              - '*[Cc][Oo][Pp][Yy][Rr][Ii][Gg][Hh][Tt]*/**'
              - '*[Pp][Aa][Tt][Ee][Nn][Tt]*'
              - '*[Pp][Aa][Tt][Ee][Nn][Tt]*/**'
              - '[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*'
              - 'docs/[Ss][Ee][Cc][Uu][Rr][Ii][Tt][Yy].*'
              - 'fuzz/**'
              - 'scripts/check/checks/scorecard-local-baseline.json'
              - 'scripts/check/checks/scorecard-local.go'
              - 'scripts/check/checks/tracked-tree.go'
              - 'scripts/check/checks/tool-install.go'
              - 'scripts/check/checks/allowlist.go'
              - 'scripts/check/checks/go-version-single-source.go'
              - 'scripts/check/checks/osv-scanner.go'
              - 'scripts/check.sh'
              - 'scripts/check/*.go'
              - 'scripts/check/go.mod'
              - 'scripts/check/go.sum'
              - 'scripts/check/stack-lease/**'
              - 'scripts/check/stacklease/**'
              - 'scripts/check/checks/cache.go'
              - 'scripts/check/checks/common.go'
              - 'scripts/check/checks/fingerprint.go'
              - 'scripts/check/checks/fixture-stacks.go'
              - 'scripts/check/checks/inputs.go'
              - 'scripts/check/checks/nfs_ports.go'
              - 'scripts/check/checks/registry.go'
              - 'scripts/check/checks/runner-sources.go'
              - 'scripts/check/checks/s3_ports.go'
              - 'scripts/check/checks/sftp_ports.go'
              - 'scripts/check/checks/smb_ports.go'
              - 'scripts/check/checks/test-log.go'
              - 'scripts/check/checks/webdav_ports.go'
              - '.mise.toml'

      # The Website job runs inside this image. Its visual baselines
      # (`apps/website/e2e/visual.spec.ts`) are pixel comparisons, so the renderer that verifies
      # them has to be the renderer that shot them, and
      # `apps/website/scripts/update-visual-baselines.sh` shoots them in the pinned Playwright
      # container. Verifying on the bare runner instead put ~10% of the pixels in the tightest
      # region shots over the threshold with no change behind them: same Chromium build, different
      # host font stack.
      #
      # Both sides DERIVE the tag from the resolved `@playwright/test` version instead of naming
      # it (the script from the installed package, this from the lockfile), so a Renovate bump
      # moves capture and verification together and neither can silently drift onto another
      # renderer. This lives here because `container:` is evaluated before a job starts, so the
      # image can only come from an earlier job's output.
      - name: Resolve the Playwright container image
        id: playwright-image
        run: |
          version=$(awk '
            /^  apps\/website:$/ { site = 1; next }
            site && /^  [^ ]/ { exit }
            site && /^      .@playwright\/test.:$/ { want = 1; next }
            want && /^        version:/ { print $2; exit }
          ' pnpm-lock.yaml)
          if [[ -z "$version" ]]; then
            echo "Could not read apps/website's resolved @playwright/test version from pnpm-lock.yaml." >&2
            echo "The lockfile layout likely changed; fix this step and update-visual-baselines.sh together." >&2
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:v$version-noble" >>"$GITHUB_OUTPUT"
          echo "Website renderer: mcr.microsoft.com/playwright:v$version-noble"

  # ===========================================
  # The lanes
  # ===========================================
  # Each lane's steps live in its own reusable `<lane>-lane.yml`, and only that lane's filter
  # lists its file, so an edit to one lane's definition reruns that lane alone. These jobs keep
  # the gate (`if:` on `changes`), the names `CI OK` and branch history know them by, and the
  # permissions each lane may use (a called workflow can only narrow them).
  # `docs/tooling/ci.md` § Lane files.

  # Linux: the platform-blind scanners, clippy, the wasm builds, rustdoc, and the suite.
  desktop-rust:
    name: Desktop (Rust)
    needs: changes
    if: inputs.run_all || needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-lane.yml

  # The fixture lanes (SMB, SFTP, WebDAV, S3, and NFS containers, plus a real Nextcloud) in their
  # own lane, so their ~10 min of container bring-up runs alongside `desktop-rust` instead of
  # after it.
  desktop-rust-fixtures:
    name: Desktop (Rust, fixtures)
    needs: changes
    if: inputs.run_all || needs.changes.outputs.rust-fixtures == 'true'
    uses: ./.github/workflows/rust-fixtures-lane.yml

  # Cmdr ships on macOS, but every other lane runs on ubuntu, so the code under
  # `cfg(target_os = "macos")` (FSEvents, AppKit, DiskArbitration, File Provider, TCC, the
  # `cmdr-fsevent-stream` member) was compiled, linted, and tested only on whichever Mac last ran
  # `pnpm check`. This lane asks the three questions Linux can't answer for that code: does it
  # lint clean, do its intra-doc links resolve, and do its tests pass. Everything platform-blind
  # (the static scanners, rustfmt, notices, jscpd) stays in `desktop-rust` alone. Last, it runs
  # module cycles, whose baseline is a macOS module graph (an ubuntu analysis drops the
  # macOS-gated modules).
  #
  # One job, deliberately: splitting the suite into a second macOS job saved ~5 min of wall
  # time, but the account runs at most five macOS jobs at once (of 20), and with several PRs
  # in flight a second macOS job per run cost more in queue time than it saved (2026-10-20).
  #
  # Deliberately left out:
  # - `macos-availability`: the committed selector list records the NEWEST SDK it was built on
  #   (David's Mac), and an older runner SDK that knows a different selector set fails by design.
  # - `disk-images` (`hdiutil` attaches): opt-in locally for a reason; a candidate once this job
  #   has a green track record.
  # - The Docker fixture lanes: GitHub's macOS runners have no Docker.
  #
  # Required: in `ci-ok`'s `needs`, so a red macOS job fails the run and both release gates.
  # `docs/tooling/ci.md` § macOS lane.
  #
  # On `main` pushes the lane shares one job-level group across runs: one runs, the newest
  # waits, and a newer push replaces the waiting one, because each `main` commit checks a
  # superset of the one before it and a burst of lands used to queue a ~40 min macOS run each.
  # `ci-ok` counts that replaced (cancelled) job as covered. PRs and dispatches (the release
  # gate's `run_all`) keep a group of their own (the run ID), so this never cancels them.
  desktop-rust-macos:
    name: Desktop (Rust, macOS)
    needs: changes
    if: inputs.run_all || needs.changes.outputs.rust-macos == 'true'
    concurrency:
      group: macos-lane-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
      cancel-in-progress: false
    uses: ./.github/workflows/macos-lane.yml
    with:
      compile-finder-extension: ${{ inputs.run_all || needs.changes.outputs.finder-extension == 'true' }}

  # The desktop frontend: the Svelte checks, i18n, and Vitest, plus the type-aware ESLint passes
  # in a parallel job.
  desktop-svelte:
    name: Desktop (Svelte)
    needs: changes
    if: inputs.run_all || needs.changes.outputs.svelte == 'true'
    uses: ./.github/workflows/svelte-lane.yml

  # The E2E lane's Docker base image (apt packages, Node, Rust: `Dockerfile.base`) lives in
  # GitHub's container registry, tagged by the hash of `Dockerfile.base`. This job builds and
  # pushes it only when the registry lacks the current tag (a `Dockerfile.base` edit, or a new
  # owner after a repo move), and costs ~20 s otherwise. It used to live in the Actions cache,
  # which evicts under size pressure; the E2E job then rebuilt it inside its own 40-min cap,
  # and a slow apt mirror ran it out (2026-10-22). Here a build has its own long cap, and the
  # registry never evicts. `apps/desktop/test/e2e-linux/DETAILS.md` § CI base image.
  # It stays here, not in `e2e-linux-lane.yml`: OpenSSF Scorecard waives a job's
  # `packages: write` only in a workflow it recognizes as packaging, which this one is (its
  # `docker push`), and the lane file would add a Token-Permissions finding.
  e2e-base-image:
    name: E2E base image
    runs-on: ubuntu-latest
    # ~5 min to build on healthy apt mirrors; slow ones have stretched it past 30.
    timeout-minutes: 60
    needs: changes
    if: inputs.run_all || needs.changes.outputs.desktop == 'true'
    permissions:
      contents: read # check out the code
      packages: write # push the image when the registry lacks it

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to the container registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$ACTOR" --password-stdin <<<"$TOKEN"

      - name: Build and push the base image if the registry lacks it
        run: ./scripts/e2e-linux.sh --base-only
        working-directory: ./apps/desktop
        env:
          E2E_BASE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          E2E_BASE_PUSH: 'true'

  # The Playwright suite on Linux, in Docker, once the registry holds the base image. Gated only
  # on change detection, never on the Rust or Svelte lanes (the lane file says why), so it
  # starts at t=0: it's usually the critical path.
  desktop-e2e-linux:
    name: E2E tests (Playwright, Linux)
    needs: [changes, e2e-base-image]
    if: inputs.run_all || needs.changes.outputs.desktop == 'true'
    permissions:
      contents: read # check out the code
      packages: read # pull the E2E base image
    uses: ./.github/workflows/e2e-linux-lane.yml

  # The browser demo build, then the site's checks, E2E, and Lighthouse inside the pinned
  # Playwright image (`changes` resolves it, since `container:` can't read a step output).
  website:
    name: Website
    needs: changes
    if: inputs.run_all || needs.changes.outputs.website == 'true'
    uses: ./.github/workflows/website-lane.yml
    with:
      playwright-image: ${{ needs.changes.outputs.playwright-image }}
    secrets:
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # Everything without Rust or a browser, on one runner: repo hygiene on every change (no path
  # gate), and the Go checks, the API server, the dashboard, and the three slow hygiene checks per
  # filter. It skips only on an already-verified push or PR and on a PR that changes no file (a
  # record-only commit; see `changes`). The runner comes from `changes` (`LIGHT_LANE_RUNNER`,
  # never self-hosted for a fork PR). `docs/tooling/ci.md` § The light lane.
  light:
    name: Light lane (hygiene, Go, API server, dashboard)
    needs: changes
    if: needs.changes.outputs.verified != 'true' && needs.changes.outputs.same-tree != 'true'
    permissions:
      contents: read # check out the code
      pull-requests: read # list the PR's files for the Scorecard trigger
    uses: ./.github/workflows/light-lane.yml
    with:
      runs-on: ${{ needs.changes.outputs.light-runner }}
      full: ${{ inputs.run_all == true }}
      scripts: ${{ needs.changes.outputs.scripts == 'true' }}
      api-server: ${{ needs.changes.outputs.api-server == 'true' }}
      dashboard: ${{ needs.changes.outputs.dashboard == 'true' }}
      scorecard: ${{ needs.changes.outputs.scorecard == 'true' }}
      termbase: ${{ needs.changes.outputs.termbase == 'true' }}
      changelog: ${{ needs.changes.outputs.changelog == 'true' }}

  # ===========================================
  # Keep the E2E build cache warm on main
  # ===========================================
  # A PR can restore its base branch's caches but never another PR's. Since a verified
  # `main` push skips every lane, `desktop-e2e-linux` stopped running on `main`, so no
  # main-scoped `Linux-docker-e2e-*` entry existed and each new PR's first E2E run
  # built cold: ~21 min instead of ~11, 4 of 9 PR runs on 2026-10-19 (#557). This job
  # rebuilds the E2E Cargo + target cache on `main` whenever the current key has no
  # entry, and costs ~20 s when it's there. It pulls the base image like the lane does.
  # - Post-land, so `ci-ok` doesn't wait for it (exempt in `ciOKGateExempt`); a
  #   failure here costs the next PR a cold build, nothing more.
  # - Skips when the E2E lane itself runs on this push: that job saves the same keys.
  # - The cache `path`s and keys MUST match `e2e-linux-lane.yml` byte for byte, or the
  #   entries it saves are invisible to the lane (a cache's version hashes its paths).
  warm-e2e-linux-cache:
    name: Warm E2E build cache
    runs-on: ubuntu-latest
    # A cold build is ~22 min; 45 leaves room for a slow runner.
    timeout-minutes: 45
    needs: changes
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.result == 'success' &&
      needs.changes.outputs.desktop != 'true'
    permissions:
      contents: read # check out the code
      packages: read # pull the E2E base image

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Look up the E2E Cargo + target cache
        id: target-lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cmdr-docker-cache/cargo
            /tmp/cmdr-docker-cache/target
          key: ${{ runner.os }}-docker-e2e-${{ hashFiles('Cargo.lock') }}
          lookup-only: true

      - name: Decide whether to warm
        id: decide
        env:
          TARGET_HIT: ${{ steps.target-lookup.outputs.cache-hit }}
        run: |
          if [[ "$TARGET_HIT" == "true" ]]; then
            echo "The E2E cache exists on main for the current key; nothing to warm."
            echo "warm=false" >>"$GITHUB_OUTPUT"
          else
            echo "warm=true" >>"$GITHUB_OUTPUT"
          fi

      # From here on, the same cache steps as the lane's `tests` job (see its comments).
      - name: Prepare Docker cache dirs
        if: steps.decide.outputs.warm == 'true'
        run: |
          mkdir -p /tmp/cmdr-docker-cache/cargo /tmp/cmdr-docker-cache/target
          df -h /

      - name: Cache Cargo + target (via host bind mounts into Docker)
        if: steps.decide.outputs.warm == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cmdr-docker-cache/cargo
            /tmp/cmdr-docker-cache/target
          key: ${{ runner.os }}-docker-e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-docker-e2e-

      - name: Log in to the container registry
        if: steps.decide.outputs.warm == 'true'
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$ACTOR" --password-stdin <<<"$TOKEN"

      - name: Build the E2E app in Docker
        if: steps.decide.outputs.warm == 'true'
        run: ./scripts/e2e-linux.sh --build-app-only
        working-directory: ./apps/desktop
        env:
          CARGO_VOLUME: /tmp/cmdr-docker-cache/cargo
          TARGET_VOLUME: /tmp/cmdr-docker-cache/target
          E2E_BASE_REGISTRY: ghcr.io/${{ github.repository_owner }}

      - name: Reclaim cache dir ownership for the save step
        if: always() && steps.decide.outputs.warm == 'true'
        run: sudo chown -R "$(id -u):$(id -g)" /tmp/cmdr-docker-cache

  # ===========================================
  # Keep the Rust build caches warm on main
  # ===========================================
  # The Rust lanes save their caches from `main` only (`SAVE_RUST_CACHE`), and a verified `main`
  # push skips them, so without these jobs `main` would never hold an entry and every PR would
  # build cold. Same shape as `warm-e2e-linux-cache`: post-land, exempt from `ci-ok`
  # (`ciOKGateExempt`), skipped when the lane that saves its entry runs on this push.
  # One job per entry, since a job can only drive one rust-cache step cleanly.
  # - Each restores its entry with the lane's exact `rust-cache` inputs and the same steps
  #   before it (rust-cache hashes the rustc version and `CARGO*`/`RUST*` env into the key). On
  #   an exact hit (`cache-hit`) every build step skips and the post-step saves nothing, ~1 min.
  # - On a miss it runs the lane's compiling checks, so the save holds what the lane needs,
  #   including the tools they install into `~/.cargo/bin`.
  warm-rust-cache:
    name: Warm Rust build cache (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.result == 'success' &&
      needs.changes.outputs.rust != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # On a cache miss this job runs the lane's compiling checks, so it needs the lane's room too.
      - name: Free disk space on a small runner
        uses: ./.github/actions/free-disk-if-small

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      # Must match the lane's steps in `rust-lane.yml`.
      - name: Keep only the pinned Rust toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      - name: Cache Rust build
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-rust
          cache-on-failure: true
          save-if: ${{ env.SAVE_RUST_CACHE }}

      # Even on a Rust cache hit: a PR reads only its own and `main`'s caches, so this is what
      # keeps a `main` entry of the action's `.deb` cache current for every PR's first run.
      - name: Install Tauri dependencies (Linux)
        uses: ./.github/actions/tauri-linux-deps
        timeout-minutes: 20

      - name: Build check tool
        if: steps.cache.outputs.cache-hit != 'true'
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Install cargo-about (third-party notices)
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-third-party-notices --ci

      - name: Install cargo-machete
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-rust-cargo-machete --ci

      - name: Build for clippy
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-rust-clippy --ci

      - name: Build for rustdoc
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-rust-rustdoc --ci

      - name: Drop rustdoc HTML before it reaches the cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: rm -rf target/doc

      # Compiles the test binaries (and installs cargo-nextest) without running the suite.
      - name: Build the test binaries
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check nextest-filter-coverage --ci

  # The `desktop-rust-macos` entry; see `warm-rust-cache`.
  warm-rust-macos-cache:
    name: Warm Rust build cache (macOS)
    runs-on: macos-26
    timeout-minutes: 90
    needs: changes
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.result == 'success' &&
      needs.changes.outputs.rust-macos != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      # Must match the lane's steps in `macos-lane.yml`.
      - name: Keep only the pinned Rust toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      - name: Cache Rust build
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-rust-macos
          cache-on-failure: true
          save-if: ${{ env.SAVE_RUST_CACHE }}

      - name: Build check tool
        if: steps.cache.outputs.cache-hit != 'true'
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Build for clippy
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-rust-clippy --ci

      - name: Build for rustdoc
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-rust-rustdoc --ci

      - name: Drop rustdoc HTML before it reaches the cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: rm -rf target/doc

      # Compiles the test binaries (and installs cargo-nextest) without running the suite.
      - name: Build the test binaries
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check nextest-filter-coverage --ci

      - name: Install cargo-modules (pinned)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          version="$(./scripts/check/check --print-cargo-modules-version)"
          if [ "$(cargo-modules --version 2>/dev/null)" != "cargo-modules $version" ]; then
            cargo install cargo-modules --version "$version" --locked
          fi

  # ===========================================
  # Keep the light lane's caches warm on main
  # ===========================================
  # The light lane saves its caches (`node_modules`, the check tool, the Go caches) from `main`
  # only, and a verified `main` push skips it, so this job fills `main`'s entries for every PR to
  # restore. Same shape as `warm-rust-cache`: post-land, exempt from `ci-ok` (`ciOKGateExempt`),
  # skipped when the lane runs on this push (it saves the same keys). On exact hits it only looks
  # (~30 s); on a miss it does what the lane would: installs, builds the check tool, and runs the
  # checks that `go install` their tools and fill the Go build cache. Same keys and paths as the
  # lane, through the same `light-cache` action.
  warm-light-cache:
    name: Warm light lane caches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.result == 'success' &&
      needs.changes.outputs.verified == 'true'
    env:
      GOFLAGS: -count=1 # as in the lane, so the Go build cache it saves holds no test results

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Restore the light lane caches
        id: cache
        uses: ./.github/actions/light-cache
        with:
          phase: restore
          go: 'true'
          scorecard: 'true'

      - name: Install dependencies
        if: steps.cache.outputs.node-modules-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build check tool
        if: steps.cache.outputs.check-tool-hit != 'true'
        run: go build -o check .
        working-directory: ./scripts/check

      # A red check still installed its tool, so the save below still has what the lane needs.
      - name: Install the Go tools and fill the Go build cache
        if: steps.cache.outputs.go-hit != 'true'
        continue-on-error: true
        run: |
          ./scripts/check/check --ci --check scripts-go-vet,scripts-go-staticcheck,scripts-go-ineffassign,scripts-go-misspell,scripts-go-gocyclo,scripts-go-nilaway,scripts-go-deadcode

      - name: Install scorecard
        if: steps.cache.outputs.scorecard-hit != 'true'
        continue-on-error: true
        run: ./scripts/check/check --check scorecard-local --ci

      - name: Save the light lane caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/light-cache
        with:
          phase: save
          go: 'true'
          scorecard: 'true'
          node-modules-hit: ${{ steps.cache.outputs.node-modules-hit }}
          check-tool-hit: ${{ steps.cache.outputs.check-tool-hit }}
          go-hit: ${{ steps.cache.outputs.go-hit }}
          scorecard-hit: ${{ steps.cache.outputs.scorecard-hit }}

  # ===========================================
  # Drop superseded build caches on main
  # ===========================================
  # A new `Cargo.lock` gives every big cache a new key, and the old entry (~1.3–1.9 GB) stays
  # until it ages out after 7 unused days. Two generations of the Rust and E2E caches put the
  # repo at ~11.5 GB against its 10 GB budget, so GitHub's LRU eviction started dropping
  # entries the lanes still used (2026-10-22). After every job that reads or saves one has
  # finished, this keeps the most recently USED `main` entry of each family and deletes the
  # rest. Used, not created: the jobs just before it touched the entry this commit's key names,
  # while a stale key can be the newer one (on 2026-10-22 a flipping toolchain hash saved one
  # after the live entry). A family is the key minus its trailing hash parts, for example
  # `v0-rust-desktop-rust-Linux-x64`. A PR whose lockfile is older still restores the kept
  # entry through its restore-keys prefix. The light lane's `light-*` entries (a new lockfile
  # or Go sum makes a new key each) are families too.
  # Post-land, so exempt from `ci-ok` (`ciOKGateExempt`): a failure only leaves the old
  # entries to age out.
  prune-superseded-caches:
    name: Drop superseded build caches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        desktop-rust,
        desktop-rust-macos,
        desktop-e2e-linux,
        warm-e2e-linux-cache,
        warm-rust-cache,
        warm-rust-macos-cache,
        website,
        publish-website-demo,
        light,
        warm-light-cache,
      ]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: write # delete caches

    steps:
      - name: Keep the most recently used main entry of each Rust, E2E, and light lane cache family
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          declare -A kept
          gh cache list --repo "$REPO" --ref refs/heads/main --sort last_accessed_at --order desc --limit 100 \
            --json id,key --jq '.[] | "\(.id) \(.key)"' >caches.txt
          while read -r id key; do
            case "$key" in
              v0-rust-* | *-docker-e2e-* | light-*) ;;
              *) continue ;;
            esac
            family=$(sed -E 's/(-[0-9a-f]{8,})+$//' <<<"$key")
            if [[ -n "${kept[$family]:-}" ]]; then
              echo "Deleting $key (superseded by ${kept[$family]})"
              gh cache delete "$id" --repo "$REPO"
            else
              kept[$family]=$key
              echo "Keeping $key"
            fi
          done <caches.txt

  # ===========================================
  # Website deployment
  # ===========================================
  # This is the ONLY website deploy path. There used to be a standalone
  # deploy-website.yml that fired on the same paths — that deployed twice per
  # push and, worse, deployed even when checks failed (it didn't wait for the
  # website job). Keep deployment here, gated on the website checks passing.
  # `workflow_dispatch` on main (with run_all) doubles as the manual deploy lever.
  #
  # The browser demo reaches the server as a prebuilt image, so the shared box never compiles
  # Rust: this job pushes `ghcr.io/vdavid/cmdr-demo:<content key>` (`scripts/website-demo-key.sh`)
  # before the deploy fires, and the deploy computes the same key from its checkout. A content key,
  # not this commit's SHA, because the server deploys `origin/main`, which may already be a newer
  # commit than this run's, and because a landed commit's lanes usually skip (verified on its PR),
  # so no run builds per SHA. Same sources, same key, whichever commit asks.
  # `apps/website/DETAILS.md` § Browser demo.
  publish-website-demo:
    name: Publish the browser demo image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read # check out the code
      packages: write # push to ghcr.io/vdavid/cmdr-demo
    outputs:
      key: ${{ steps.image.outputs.key }}
      digest: ${{ steps.digest.outputs.digest }}
    # The deploy's own condition: it runs exactly when a deploy will.
    needs: [changes, website]
    if: >-
      github.ref == 'refs/heads/main' && !cancelled() && (github.event_name == 'push' || github.event_name ==
      'workflow_dispatch') && needs.changes.result == 'success' && (needs.website.result == 'success' ||
      (needs.website.result == 'skipped' && needs.changes.outputs.verified == 'true' &&
      needs.changes.outputs.website-changed == 'true'))

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute the image tag
        id: image
        run: |
          key=$(./scripts/website-demo-key.sh)
          echo "key=$key" >>"$GITHUB_OUTPUT"
          echo "ref=ghcr.io/vdavid/cmdr-demo:$key" >>"$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}

      # Content-keyed, so an image for these sources is final: a deploy that changed no demo
      # source finds it and skips the build.
      - name: Look for an image of these sources
        id: existing
        run: |
          if docker manifest inspect "${{ steps.image.outputs.ref }}" >/dev/null 2>&1; then
            echo "found=true" >>"$GITHUB_OUTPUT"
            echo "${{ steps.image.outputs.ref }} already exists."
          fi

      # This run's website lane built it (its `demo` job) when the lane ran; a verified landed
      # commit skipped that lane, so it builds here.
      - name: Download the browser demo
        if: steps.existing.outputs.found != 'true' && needs.website.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-demo
          path: apps/desktop/build-demo/

      - name: Install mise
        if: steps.existing.outputs.found != 'true' && needs.website.result != 'success'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        if: steps.existing.outputs.found != 'true' && needs.website.result != 'success'
        run: mise install

      - name: Build the browser demo
        if: steps.existing.outputs.found != 'true' && needs.website.result != 'success'
        uses: ./.github/actions/build-website-demo
        with:
          save-rust-cache: ${{ env.SAVE_RUST_CACHE }}

      - name: Push the browser demo image
        if: steps.existing.outputs.found != 'true'
        run: |
          docker build -f apps/website/demo-image.Dockerfile -t "${{ steps.image.outputs.ref }}" apps/desktop/build-demo
          docker push "${{ steps.image.outputs.ref }}"

      # The deploy builds from the digest, never the tag (a tag can be moved): the webhook payload
      # carries it, signed, and the Dockerfile pins `cmdr-demo@sha256:<digest>`.
      - name: Read the image digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "${{ steps.image.outputs.ref }}" --format '{{.Manifest.Digest}}')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Couldn't read the digest of ${{ steps.image.outputs.ref }} (got '$digest')."
            exit 1
          fi
          echo "digest=${digest#sha256:}" >>"$GITHUB_OUTPUT"
          echo "${{ steps.image.outputs.ref }} is $digest"

      # The server pulls anonymously. A new GHCR package can start out private, and then every
      # deploy would fail on the pull; this says so here, before the webhook fires.
      - name: Check the image is public
        run: |
          docker logout ghcr.io
          if ! docker manifest inspect "ghcr.io/vdavid/cmdr-demo@sha256:${{ steps.digest.outputs.digest }}" >/dev/null; then
            echo "::error::${{ steps.image.outputs.ref }} isn't publicly readable. Set the cmdr-demo package's visibility to public: github.com/users/vdavid/packages/container/cmdr-demo/settings."
            exit 1
          fi

  deploy-website:
    name: Deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploys when the website lane passed in this run, or when it skipped because the landed
    # commit was already verified on its PR and the push touched the website. Always after the
    # browser demo image for these sources is public.
    needs: [changes, website, publish-website-demo]
    if: >-
      github.ref == 'refs/heads/main' && !cancelled() && (github.event_name == 'push' || github.event_name ==
      'workflow_dispatch') && needs.changes.result == 'success' && needs.publish-website-demo.result == 'success' &&
      (needs.website.result == 'success' || (needs.website.result == 'skipped' && needs.changes.outputs.verified ==
      'true' && needs.changes.outputs.website-changed == 'true'))

    steps:
      # The payload names the browser demo image by digest plus the content key it was built from;
      # the signature covers the whole body, so the server trusts both. `deploy-website.sh` checks
      # the key against its own checkout before building with the digest.
      - name: Trigger deploy webhook
        env:
          DEMO_KEY: ${{ needs.publish-website-demo.outputs.key }}
          DEMO_DIGEST: ${{ needs.publish-website-demo.outputs.digest }}
        run: |
          # Compute HMAC-SHA256 signature
          PAYLOAD=$(jq -cn --arg key "$DEMO_KEY" --arg digest "$DEMO_DIGEST" '{demo_key: $key, demo_image_digest: $digest}')
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" | cut -d' ' -f2)

          # Send signed request to webhook
          curl -f -X POST https://getcmdr.com/hooks/deploy-website \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD"

  # ===========================================
  # Full-run marker for the release gate
  # ===========================================
  # Runs only when `run_all` is on, so its success is how the release gate
  # (`scripts/release-finish/ci.go`, run by `release-finish.sh` and `release-pipeline.yml`'s
  # `ci-gate`) tells a full run from a dispatch with `run_all` off, which the runs API can't show
  # (it carries no inputs). The gate matches this job's NAME (`fullRunMarker`), so ❌ don't rename
  # it without updating that. It needs nothing, so it marks the MODE only; the gate reads
  # green-or-red from the run's jobs and its own conclusion.
  full-run:
    name: Full run (run_all)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: inputs.run_all
    steps:
      - name: Mark this run as full
        run: echo "run_all is on, so no lane skips on change detection."

  # ===========================================
  # Summary job for branch protection
  # ===========================================
  # `main`'s ruleset requires this job's check by its NAME, `CI OK`, so ❌ don't rename it. It must
  # report on every run, never be skipped: GitHub counts a skipped required check as passing.
  # - `needs` lists every job but the post-land ones (`deploy-website`, the `warm-*` cache jobs,
  #   and `prune-superseded-caches`; `ci-coverage` enforces it). `changes` belongs
  #   here too: when it fails, every lane is skipped, and the gate used to read that as green.
  #   A lane's result is its whole lane file's: one red job inside makes the lane `failure`.
  # - `always()`, not `!cancelled()`, so a cancelled run reports red instead of skipped.
  # - Only `success` and `skipped` pass. A lane skipped by change detection is fine; `changes`
  #   itself never legitimately skips, so it must be `success`.
  # - One exception: on a `main` push, a `cancelled` `desktop-rust-macos` passes when `main`
  #   has moved past this commit, because a newer push replaced it in the lane's shared group
  #   and that run checks this code too. Any failed lookup keeps it red.
  # `docs/tooling/ci.md` § Branch protection.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        changes,
        full-run,
        desktop-rust,
        desktop-rust-fixtures,
        desktop-rust-macos,
        desktop-svelte,
        e2e-base-image,
        desktop-e2e-linux,
        website,
        light,
      ]
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          covered=false
          if [[ "$EVENT" == "push" && "$REF" == "refs/heads/main" &&
            "$(jq -r '."desktop-rust-macos".result' <<<"$NEEDS")" == "cancelled" ]]; then
            if head=$(gh api "repos/$REPO/commits/main" --jq .sha) && [[ -n "$head" && "$head" != "$SHA" ]] &&
              status=$(gh api "repos/$REPO/compare/$SHA...$head" --jq .status) && [[ "$status" == "ahead" ]]; then
              covered=true
              echo "desktop-rust-macos was replaced by a newer main push's macOS run; main is at $head, which descends from $SHA."
            else
              echo "desktop-rust-macos was cancelled, and main hasn't verifiably moved past $SHA, so it counts as red."
            fi
          fi
          bad=$(jq -r --argjson covered "$covered" 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | select(($covered and .key == "desktop-rust-macos" and .value.result == "cancelled") | not)
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [[ -n "$bad" ]]; then
            echo "These jobs didn't pass:"
            echo "$bad"
            exit 1
          fi
          if [[ "$(jq -r '.changes.result' <<<"$NEEDS")" != "success" ]]; then
            echo "Change detection didn't run, so the skipped lanes prove nothing."
            exit 1
          fi
          echo "All jobs passed or were skipped by change detection"
