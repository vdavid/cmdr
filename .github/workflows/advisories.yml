name: Advisory scan

# Daily check of every lockfile against the advisory databases, so a new
# advisory for a dependency that hasn't changed shows up within a day.
# `osv-scanner` sweeps every tracked lockfile (Rust, npm, Go, Python) the way
# OpenSSF Scorecard's Vulnerabilities check does; `cargo-deny` reads the
# shipped macOS Rust graph. Neither compiles anything, so this is cheap next to
# the nightly `slow-checks.yml` lane (which also runs them, beside
# `cargo-udeps` and the rest). The `/trust/development` page on the website
# states this one-day cadence: change both together.
# A red run reaches David as a line in the API server's three-hour digest
# (`apps/api-server/src/ci-health.ts`); GitHub's own failure emails are off.
on:
  schedule:
    - cron: '17 4 * * *' # daily, 5:17 AM CET = 4:17 AM UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      # The checks install their pinned tool versions when missing: `cargo install`
      # compiles cargo-deny for minutes, and `go install` builds osv-scanner. The
      # versions live in the check files (and the Go toolchain in `.mise.toml`), so a
      # bump changes the key and reinstalls. A daily run keeps this cache inside
      # GitHub's 7-day eviction window.
      - name: Cache cargo-deny and osv-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            node_modules/.cache/cmdr-go-tools/osv-scanner
          key:
            ${{ runner.os }}-advisory-tools-${{ hashFiles('scripts/check/checks/desktop-rust-cargo-deny.go',
            'scripts/check/checks/osv-scanner.go', '.mise.toml') }}

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Run osv-scanner
        run: ./scripts/check/check --check osv-scanner --ci

      - name: Run cargo-deny
        run: ./scripts/check/check --check desktop-rust-cargo-deny --ci
