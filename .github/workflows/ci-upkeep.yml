name: CI upkeep

# Post-land cache upkeep for `main`: warms the build caches the lanes restore, then drops the
# superseded ones. It used to be jobs inside `ci.yml`, where a red or cancelled upkeep job made
# `main`'s CI run red though every check passed: on 2026-11-05 GitHub had no macOS runner for the
# macOS warm job, cancelled it after 15 min ("The job was not acquired by Runner of type hosted"),
# and runs 42071578000 and 42072334820 concluded `failure`. `continue-on-error: true` didn't help
# (a job cancelled by its timeout still makes the run `cancelled`). A workflow of its own keeps
# CI's verdict about the code alone. `docs/tooling/ci.md` § CI upkeep.
#
# It runs once CI finishes on a `main` push, whatever CI's conclusion (a red lane says nothing
# about whether the caches need warming, and today's jobs warmed on a red run too). After CI, so
# every lane that restores or saves a cache is done before the prune picks what to keep.
#
# Trust: `workflow_run` runs this file from the default branch with the repo's secrets, and CI
# also completes for PRs, a fork's included. Every job's `if:` therefore requires a push to `main`
# in this repo (`workflows-hardening` enforces it), and `checkout-main-commit` builds the commit
# only after proving `main` contains it, so it's as trusted as what a `push` run builds. GitHub gives `workflow_run` a read-only cache
# token by default (changelog 2026-06-26, against cache poisoning from fork-triggered runs); the
# warm jobs opt back into writes with `cache-mode: write`, which that guard makes safe here.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # ===========================================
  # Keep the E2E build cache warm on main
  # ===========================================
  # A PR can restore its base branch's caches but never another PR's. Since a verified
  # `main` push skips every lane, `desktop-e2e-linux` stopped running on `main`, so no
  # main-scoped `Linux-docker-e2e-*` entry existed and each new PR's first E2E run
  # built cold: ~21 min instead of ~11, 4 of 9 PR runs on 2026-10-19 (#557). This job
  # rebuilds the E2E Cargo + target cache on `main` whenever the current key has no
  # entry, and costs ~20 s when it's there (also when the E2E lane ran on this push and
  # saved it). It pulls the base image like the lane does.
  # - The cache `path`s and keys MUST match `e2e-linux-lane.yml` byte for byte, or the
  #   entries it saves are invisible to the lane (a cache's version hashes its paths).
  warm-e2e-linux-cache:
    name: Warm E2E build cache
    runs-on: ubuntu-latest
    # A cold build is ~22 min; 45 leaves room for a slow runner.
    timeout-minutes: 45
    if: >-
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    cache-mode: write
    permissions:
      contents: read # check out the code
      packages: read # pull the E2E base image

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Switch to the commit CI ran
        uses: ./.github/actions/checkout-main-commit
        with:
          sha: ${{ github.event.workflow_run.head_sha }}

      - name: Look up the E2E Cargo + target cache
        id: target-lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cmdr-docker-cache/cargo
            /tmp/cmdr-docker-cache/target
          key: ${{ runner.os }}-docker-e2e-${{ hashFiles('Cargo.lock') }}
          lookup-only: true

      - name: Decide whether to warm
        id: decide
        env:
          TARGET_HIT: ${{ steps.target-lookup.outputs.cache-hit }}
        run: |
          if [[ "$TARGET_HIT" == "true" ]]; then
            echo "The E2E cache exists on main for the current key; nothing to warm."
            echo "warm=false" >>"$GITHUB_OUTPUT"
          else
            echo "warm=true" >>"$GITHUB_OUTPUT"
          fi

      # From here on, the same cache steps as the lane's `tests` job (see its comments).
      - name: Prepare Docker cache dirs
        if: steps.decide.outputs.warm == 'true'
        run: |
          mkdir -p /tmp/cmdr-docker-cache/cargo /tmp/cmdr-docker-cache/target
          df -h /

      # No `restore-keys`, unlike the lane: this job runs only when the key has no entry, and
      # building on an older entry carries every stale artifact in its `target/` and registry into
      # the new save (nothing prunes them; the Linux Rust entry grew the same way, #981). Starting
      # empty costs a cold build (~22 min) post-land, once per `Cargo.lock` change.
      - name: Cache Cargo + target (via host bind mounts into Docker)
        if: steps.decide.outputs.warm == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cmdr-docker-cache/cargo
            /tmp/cmdr-docker-cache/target
          key: ${{ runner.os }}-docker-e2e-${{ hashFiles('Cargo.lock') }}

      - name: Log in to the container registry
        if: steps.decide.outputs.warm == 'true'
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$ACTOR" --password-stdin <<<"$TOKEN"

      - name: Build the E2E app in Docker
        if: steps.decide.outputs.warm == 'true'
        run: ./scripts/e2e-linux.sh --build-app-only
        working-directory: ./apps/desktop
        env:
          CARGO_VOLUME: /tmp/cmdr-docker-cache/cargo
          TARGET_VOLUME: /tmp/cmdr-docker-cache/target
          E2E_BASE_REGISTRY: ghcr.io/${{ github.repository_owner }}

      - name: Reclaim cache dir ownership for the save step
        if: always() && steps.decide.outputs.warm == 'true'
        run: sudo chown -R "$(id -u):$(id -g)" /tmp/cmdr-docker-cache

  # ===========================================
  # Keep the Rust build caches warm on main
  # ===========================================
  # The Rust lanes save their caches from `main` only (`SAVE_RUST_CACHE` in `ci.yml`), and a
  # verified `main` push skips them, so without these jobs `main` would never hold an entry and
  # every PR would build cold. One job per entry, since a job can only drive one rust-cache step
  # cleanly.
  # - Each restores its entry with the lane's exact `rust-cache` inputs and the same steps
  #   before it (rust-cache hashes the rustc version and `CARGO*`/`RUST*` env into the key). On
  #   an exact hit (`cache-hit`, also when the lane ran on this push and saved it) every build
  #   step skips and the post-step saves nothing, ~1 min.
  # - On a miss it runs the lane's compiling checks, so the save holds what the lane needs,
  #   including the tools they install into `~/.cargo/bin`, built from a clean `target/` (its
  #   step says why).
  warm-rust-cache:
    name: Warm Rust build cache (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    cache-mode: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Switch to the commit CI ran
        uses: ./.github/actions/checkout-main-commit
        with:
          sha: ${{ github.event.workflow_run.head_sha }}

      # On a cache miss this job runs the lane's compiling checks, so it needs the lane's room too.
      - name: Free disk space on a small runner
        uses: ./.github/actions/free-disk-if-small

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      # Must match the lane's steps in `rust-lane.yml`.
      - name: Keep only the pinned Rust toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      - name: Cache Rust build
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-rust
          cache-on-failure: true
          save-if: true

      # On a miss rust-cache restores the newest older entry, and its pre-save cleanup keeps every
      # artifact of a dependency it still lists, whatever version or feature set built it. Building
      # on top carried old builds into each new save: the entry reached 2.7 GB (12 GB unpacked, with
      # three copies of some crates; measured 2026-11-05, #981). A clean `target/` saves only what
      # this commit builds, for a slower post-land build on the pushes that change the key.
      - name: Start the new entry from a clean target
        if: steps.cache.outputs.cache-hit != 'true'
        run: rm -rf target

      # Even on a Rust cache hit: a PR reads only its own and `main`'s caches, so this is what
      # keeps a `main` entry of the action's `.deb` cache current for every PR's first run.
      - name: Install Tauri dependencies (Linux)
        uses: ./.github/actions/tauri-linux-deps
        timeout-minutes: 20

      - name: Build check tool
        if: steps.cache.outputs.cache-hit != 'true'
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Install cargo-about (third-party notices)
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-third-party-notices --ci

      - name: Install cargo-machete
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-rust-cargo-machete --ci

      - name: Build for clippy
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-rust-clippy --ci

      - name: Build for rustdoc
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-rust-rustdoc --ci

      - name: Drop rustdoc HTML before it reaches the cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: rm -rf target/doc

      # Compiles the test binaries (and installs cargo-nextest) without running the suite.
      - name: Build the test binaries
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check nextest-filter-coverage --ci

  # The `desktop-rust-macos` entry, which the hosted macOS lane restores: the cargo registry,
  # `~/.cargo/bin` (cargo-nextest, cargo-modules), and the dependencies' build. Its one writer: the
  # lane only restores it, so this runs on every `main` push (the M1 path touches no Rust cache).
  # On an exact hit it only looks (~1 min); on a miss it builds what the lane compiles from a clean
  # `target/`, like `warm-rust-cache`, so a hosted fallback starts warm. A miss comes with each
  # `Cargo.lock`, profile, or toolchain change, and a cold hosted build is ~60 min.
  warm-rust-macos-cache:
    name: Warm Rust build cache (macOS)
    runs-on: macos-26
    timeout-minutes: 90
    if: >-
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    cache-mode: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Switch to the commit CI ran
        uses: ./.github/actions/checkout-main-commit
        with:
          sha: ${{ github.event.workflow_run.head_sha }}

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      # Must match the lane's steps in `macos-lane.yml`.
      - name: Keep only the pinned Rust toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      - name: Cache the dependency build
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-rust-macos
          save-if: true

      # As in `warm-rust-cache`: a miss restored the newest older entry, and building on it would
      # carry its stale artifacts into the new save.
      - name: Start the new entry from a clean target
        if: steps.cache.outputs.cache-hit != 'true'
        run: rm -rf target

      - name: Build check tool
        if: steps.cache.outputs.cache-hit != 'true'
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Build for clippy
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-rust-clippy --ci

      - name: Build for rustdoc
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check desktop-rust-rustdoc --ci

      # `rust-lane.yml` says why (an unused ~200 MB, and rust-cache's ENOENT on its `tests` dirs).
      - name: Drop rustdoc HTML before it reaches the cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: rm -rf target/doc

      # Compiles the test binaries (and installs cargo-nextest) without running the suite.
      - name: Build the test binaries
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/check/check --check nextest-filter-coverage --ci

      # The checks own the pins and print them here.
      - name: Install cargo-nextest and cargo-modules (pinned)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          nextest="$(./scripts/check/check --print-nextest-version)"
          if [ "$(cargo nextest --version 2>/dev/null | head -1 | cut -d' ' -f2)" != "$nextest" ]; then
            cargo install cargo-nextest --version "$nextest" --locked --force
          fi
          modules="$(./scripts/check/check --print-cargo-modules-version)"
          if [ "$(cargo-modules --version 2>/dev/null)" != "cargo-modules $modules" ]; then
            cargo install cargo-modules --version "$modules" --locked
          fi

  # ===========================================
  # Keep the light lane's caches warm on main
  # ===========================================
  # The one writer of the light lane's caches (`node_modules`, the check tool, the Go caches, the
  # scorecard binary) and of the host-side pnpm store, on every `main` push: the lane only restores.
  # PRs' light lane, the `go-tools` job, the Svelte lane, and the deploys read what it saves. On
  # exact hits it only looks (~30 s); on a miss it does what the lane would: installs, builds the
  # check tool, and runs the checks that `go install` their tools and fill the Go build cache. Same
  # keys and paths as the lane, through the same `light-cache` action. Its Go restore has no
  # `fallback`, so a new key's entry holds only what this commit's checks used (the action says why).
  warm-light-cache:
    name: Warm light lane caches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    cache-mode: write
    env:
      GOFLAGS: -count=1 # as in the lane, so the Go build cache it saves holds no test results

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Switch to the commit CI ran
        uses: ./.github/actions/checkout-main-commit
        with:
          sha: ${{ github.event.workflow_run.head_sha }}

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Restore the light lane caches
        id: cache
        uses: ./.github/actions/light-cache
        with:
          phase: restore
          go: 'true'
          fallback: 'false'
          scorecard: 'true'

      - name: Restore the pnpm store
        id: pnpm-store
        uses: ./.github/actions/pnpm-store
        with:
          phase: restore

      # The store from the lockfile alone, so it's whole even when `node_modules` hit and no
      # install runs below.
      - name: Fill the pnpm store
        if: steps.pnpm-store.outputs.hit != 'true'
        run: pnpm fetch

      - name: Save the pnpm store
        uses: ./.github/actions/pnpm-store
        with:
          phase: save
          save: 'true'
          hit: ${{ steps.pnpm-store.outputs.hit }}

      - name: Install dependencies
        if: steps.cache.outputs.node-modules-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build check tool
        if: steps.cache.outputs.check-tool-hit != 'true'
        run: go build -o check .
        working-directory: ./scripts/check

      # A red check still installed its tool, so the save below still has what the lane needs.
      - name: Install the Go tools and fill the Go build cache
        if: steps.cache.outputs.go-hit != 'true'
        continue-on-error: true
        run: |
          ./scripts/check/check --ci --check scripts-go-vet,scripts-go-staticcheck,scripts-go-ineffassign,scripts-go-misspell,scripts-go-gocyclo,scripts-go-nilaway,scripts-go-deadcode

      # In Go caches of its own, thrown away after: its `go install` pulls ~3 GB of modules and
      # ~1 GB of build cache, which `light-go` would otherwise save (only its binary is worth keeping,
      # in `light-scorecard`).
      - name: Install scorecard
        if: steps.cache.outputs.scorecard-hit != 'true'
        continue-on-error: true
        env:
          GOMODCACHE: ${{ runner.temp }}/scorecard-gomod
          GOCACHE: ${{ runner.temp }}/scorecard-gocache
        run: ./scripts/check/check --check scorecard-local --ci

      - name: Save the light lane caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/light-cache
        with:
          phase: save
          go: 'true'
          scorecard: 'true'
          node-modules-hit: ${{ steps.cache.outputs.node-modules-hit }}
          check-tool-hit: ${{ steps.cache.outputs.check-tool-hit }}
          go-hit: ${{ steps.cache.outputs.go-hit }}
          scorecard-hit: ${{ steps.cache.outputs.scorecard-hit }}

  # ===========================================
  # Drop superseded build caches on main
  # ===========================================
  # A new `Cargo.lock` gives every big cache a new key, and the old entry (~1.3–1.9 GB) stays
  # until it ages out after 7 unused days. Two generations of the Rust and E2E caches put the
  # repo at ~11.5 GB against its 10 GB budget, so GitHub's LRU eviction started dropping
  # entries the lanes still used (2026-10-22). After every job that reads or saves one has
  # finished (CI's lanes and deploy jobs before this workflow started, the warm jobs through
  # `needs`), this keeps the most recently USED `main` entry of each family and deletes the
  # rest. Used, not created: the jobs just before it touched the entry this commit's key names,
  # while a stale key can be the newer one (on 2026-10-22 a flipping toolchain hash saved one
  # after the live entry). A family is the key minus its trailing hash parts, for example
  # `v0-rust-desktop-rust-Linux-x64`. A PR whose lockfile is older still restores the kept
  # entry through its restore-keys prefix. The light lane's `light-*` entries (a new lockfile
  # or Go sum makes a new key each) are families too, and so are mise's (~0.1–0.3 GB each; a
  # `.mise.toml` edit makes a new key for every OS and variant). A failure only leaves the old
  # entries to age out. It reads and writes no cache entry, so it keeps the default cache mode.
  prune-superseded-caches:
    name: Drop superseded build caches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [warm-e2e-linux-cache, warm-rust-cache, warm-rust-macos-cache, warm-light-cache]
    if: >-
      always() && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      actions: write # delete caches

    steps:
      - name: Keep the most recently used main entry of each Rust, E2E, light lane, pnpm store, and mise cache family
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          declare -A kept
          gh cache list --repo "$REPO" --ref refs/heads/main --sort last_accessed_at --order desc --limit 100 \
            --json id,key --jq '.[] | "\(.id) \(.key)"' >caches.txt
          while read -r id key; do
            case "$key" in
              v0-rust-* | *-docker-e2e-* | light-* | pnpm-store-*)
                family=$(sed -E 's/(-[0-9a-f]{8,})+$//' <<<"$key") ;;
              # mise-action's key ends in the config hash, after an optional `install_args` hash that
              # names a variant of its own (the Go-only one), so only the last hash goes.
              mise-v1-*) family=$(sed -E 's/-[0-9a-f]{8,}$//' <<<"$key") ;;
              *) continue ;;
            esac
            if [[ -n "${kept[$family]:-}" ]]; then
              echo "Deleting $key (superseded by ${kept[$family]})"
              gh cache delete "$id" --repo "$REPO"
            else
              kept[$family]=$key
              echo "Keeping $key"
            fi
          done <caches.txt
