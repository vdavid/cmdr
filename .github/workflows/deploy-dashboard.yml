name: Deploy analytics dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'apps/analytics-dashboard/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy analytics dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: ./.github/actions/install-mise

      - name: Install tools with mise
        run: mise install

      - name: Restore the pnpm store
        uses: ./.github/actions/pnpm-store
        with:
          phase: restore

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        working-directory: ./apps/analytics-dashboard

      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy .svelte-kit/cloudflare --project-name=cmdr-analytics-dashboard
        working-directory: ./apps/analytics-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
