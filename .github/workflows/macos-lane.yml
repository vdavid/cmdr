name: macOS lane

# The macOS lane, called by `ci.yml` (`desktop-rust-macos`). Cmdr ships on macOS,
# but every other CI job runs on ubuntu, so the code under `cfg(target_os = "macos")` (FSEvents,
# AppKit, DiskArbitration, File Provider, TCC, the `cmdr-fsevent-stream` member) gets compiled,
# linted, and tested only here. Why it lives in its own file, what it runs, and what it leaves
# out: `docs/tooling/ci.md` § macOS lane.
#
# It runs on one of two kinds of runner, picked by `ci.yml`'s `changes` job: a `cmdr-m1` slot on
# David's M1 (trusted runs, while a slot is idle), or GitHub's hosted `macos-26`. A slot keeps its
# own warm `CARGO_TARGET_DIR` outside the workspace, so it restores and saves no Rust cache; the
# hosted runner restores only a small registry-and-tools entry and builds the rest.
on:
  workflow_call:
    inputs:
      compile-finder-extension:
        description: 'Compile the Finder extension (its files changed, or a run_all)'
        type: boolean
        default: false
      marker-key:
        description: The lane's marker key from `ci.yml`'s lane plan, saved by the last step once every step passed
        type: string
        required: true
      runs-on:
        description: The runner, as JSON for `runs-on` (`changes`' `macos-runs-on` output)
        type: string
        default: '"macos-26"'
      self-hosted:
        description: Whether `runs-on` names the M1's self-hosted slots
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lane:
    name: Clippy, rustdoc, tests, module cycles
    # Hosted: pinned to the release builder's image so the lanes lint against the SDK the app ships
    # with; see the `runs-on` comment in `release-pipeline.yml` for why it's never `macos-latest`.
    # Self-hosted: the M1 runs the same macOS major, provisioned by David's infra repo
    # (`m1mbp/ansible`, the `ci_runner` role).
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # Near the real runtime, so a dead box or a wedged step fails the run instead of hanging it. An
    # M1 slot ran the lane's checks in 6.4 min warm and 11 min cold (2026-11-05, nice 10, one slot
    # busy); 30 leaves room for four cold slots at once. Hosted builds the ~1000-crate Tauri tree
    # cold on 3 cores (clippy, rustdoc, then the test build), runs the suite, and analyzes module
    # cycles.
    timeout-minutes: ${{ inputs.self-hosted && 30 || 90 }}

    steps:
      # Two commits, for the Rust test scope below (see `rust-lane.yml`).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      # The M1 keeps mise's tools between jobs, so it skips the Actions cache. Hosted saves only
      # from `main`, like every other mise cache, so a PR reads `main`'s entry and adds none
      # (`docs/tooling/ci.md` § Build caching).
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: ${{ !inputs.self-hosted }}
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools with mise
        run: mise install

      # Hosted only. Its own cache (keys are per OS), saved from `main` only, like `ci.yml`'s
      # `SAVE_RUST_CACHE` (a called workflow doesn't inherit the caller's `env`, so it's restated).
      # `cache-targets: false` keeps it to the cargo registry and `~/.cargo/bin` (cargo-nextest,
      # cargo-modules): the hosted runner is the fallback, and a `target/` entry was 3.8 GB of the
      # repo's 10 GB cache budget. `shared-key` lets `warm-rust-macos-cache` write this same entry.
      # The toolchain step keeps the key stable across runner images (see the action).
      - name: Keep only the pinned Rust toolchain
        if: ${{ !inputs.self-hosted }}
        uses: ./.github/actions/pinned-rust-toolchain

      - name: Cache the cargo registry and tools
        if: ${{ !inputs.self-hosted }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-rust-macos
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Self-hosted only. The four slots share one rustup home, and rustup takes no lock of its own,
      # so two slots installing a new pin at once could trip over each other. `shlock` takes a
      # PID lock that a killed job can't leave stuck. Older toolchains are pruned by the box.
      - name: Install the pinned Rust toolchain (one slot at a time)
        if: inputs.self-hosted
        run: |
          lock="$HOME/.rustup/cmdr-install.lock"
          until shlock -f "$lock" -p $$; do sleep 2; done
          trap 'rm -f "$lock"' EXIT
          rustup toolchain install

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      # Pull requests only (see `rust-lane.yml`).
      - name: Scope the Rust tests to the crates this change can affect
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/rust-test-scope

      # Nothing else compiles the extension before a release build. About a minute on a cold
      # runner (`swiftc` loading the macOS frameworks), so only when its files changed or on a
      # `run_all`, which the release gate always is. First, so a broken slice fails fast.
      - name: Compile the Finder extension
        if: inputs.compile-finder-extension
        run: ./scripts/check/check --check desktop-finder-extension-compile --ci

      - name: Run clippy
        run: ./scripts/check/check --check desktop-rust-clippy --ci

      - name: Check rustdoc links
        run: ./scripts/check/check --check desktop-rust-rustdoc --ci

      - name: Run Rust tests
        run: ./scripts/check/check --check desktop-rust-tests --ci

      # The check owns the pin and prints it here.
      - name: Install cargo-modules (pinned)
        run: |
          version="$(./scripts/check/check --print-cargo-modules-version)"
          if [ "$(cargo-modules --version 2>/dev/null)" != "cargo-modules $version" ]; then
            cargo install cargo-modules --version "$version" --locked
          fi

      - name: Check Rust module cycles
        run: ./scripts/check/check --check desktop-rust-module-cycles --ci

      # Last, with no `if:` (see `rust-lane.yml`). ❌ Nothing after it.
      - name: Save the lane marker
        uses: ./.github/actions/lane-marker
        with:
          key: ${{ inputs.marker-key }}
