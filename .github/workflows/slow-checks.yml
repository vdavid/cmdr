name: Slow checks

# Security, dependency, and thorough lint checks: things too slow or too
# cadence-driven for per-push CI. Runs every 6 days at 4 AM CET (3 AM UTC).
# (Was nightly; reduced to weekly, then to every-6-days in June 2026. The 6-day
# cadence is deliberate, NOT weekly: it keeps the gap under GitHub's 7-day cache
# eviction so this job's rust-cache (cargo-udeps's nightly target) survives run
# to run. `*/6` on day-of-month fires on the 1st/7th/13th/19th/25th/31st — gaps
# are always ≤6 days, including across month boundaries. Don't switch it back to
# a weekly `* * 1` form: that reintroduces a 7-day gap and the cache goes cold.
# If runs ever stop appearing, check the workflow isn't disabled in GitHub's UI:
# a manual disable survives file changes; `gh workflow enable "Slow checks"`
# re-enables.)
# GitHub automatically emails repo admins on failure
on:
  schedule:
    - cron: '0 3 */6 * *' # every 6 days, 4 AM CET = 3 AM UTC (≤6-day gap < 7-day cache eviction)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  # ===========================================
  # Rust dependency and security checks
  # ===========================================
  dependency-checks:
    name: Dependency checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same reason as the desktop-rust job: a warm rust-cache restore plus the
      # nightly udeps build can crowd the runner's ~14 GB free disk. Reclaim the
      # unused preinstalled SDKs up front. Best-effort; `df -h` for diagnosis.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      # Caches target/ + cargo deps so cargo-udeps's nightly compile is incremental
      # across runs. rust-cache keys per-job, so this is a SEPARATE cache from the
      # per-push desktop-rust one (different job, nightly vs stable). GitHub evicts
      # caches after 7 days unused — the every-6-days schedule (see the cron above)
      # is what keeps THIS cache warm run to run. Caveat: this is a third multi-GB
      # Rust cache (with desktop-rust + the e2e Docker cache); if the repo total
      # crosses GitHub's 10 GB ceiling, LRU may evict the least-used (this one)
      # regardless of the cron. Watch `gh cache list` sizes.
      - name: Keep only the pinned Rust toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Tauri dependencies (Linux)
        uses: ./.github/actions/tauri-linux-deps
        timeout-minutes: 20

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Run osv-scanner
        run: ./scripts/check/check --check osv-scanner --ci

      - name: Run cargo-deny
        run: ./scripts/check/check --check desktop-rust-cargo-deny --ci

      # cargo-udeps runs on a pinned, dated nightly so an upstream lint change
      # can't break this scheduled job at a random time. The check tool owns the
      # pin (`checks/desktop-rust-cargo-udeps.go`) and prints it here, so the
      # date lives in exactly one place.
      - name: Install nightly toolchain (for cargo-udeps)
        run: rustup toolchain install "$(./scripts/check/check --print-nightly)" --profile minimal

      - name: Run cargo-udeps
        run: ./scripts/check/check --check desktop-rust-cargo-udeps --ci

      - name: Run govulncheck
        run: ./scripts/check/check --check scripts-go-govulncheck --ci

      # Real-API smokes, one per provider whose key we hold. They catch adapter-routing /
      # auth / parse regressions the wiremock tests can't, plus the thing that only a live
      # call can see: a provider retiring the model we call.
      #
      # ⚠️ Each self-skips when its secret is absent, and a skip is a GREEN step. That is
      # how the Groq lane sat here for months without ever calling Groq. Every secret below
      # has to exist in repo settings for these to be worth anything; if you add a lane,
      # add its secret.
      - name: Run Groq smoke (real API)
        run: ./scripts/check/check --check desktop-rust-groq-smoke --ci
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Run Fireworks AI smoke (real API)
        run: ./scripts/check/check --check desktop-rust-fireworks-smoke --ci
        env:
          FIREWORKS_AI_API_KEY: ${{ secrets.FIREWORKS_AI_API_KEY }}

      - name: Run Anthropic smoke (real API)
        run: ./scripts/check/check --check desktop-rust-anthropic-smoke --ci
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run OpenAI smoke (real API)
        run: ./scripts/check/check --check desktop-rust-openai-smoke --ci
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Gemini's free tier flaps hard (200, 503, and a bodyless 404 to the same request
      # within minutes), so this lane has a THIRD outcome: it retries, and reports a yellow
      # warn rather than a red step when it still can't get through. A warn is a passing
      # step — read the log, don't assume green means Gemini answered.
      - name: Run Google Gemini smoke (real API)
        run: ./scripts/check/check --check desktop-rust-gemini-smoke --ci
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # ===========================================
  # Fuzz (the parsers that read attacker-chosen bytes)
  # ===========================================
  # The long run: every target in `fuzz/` for 20 minutes on the pinned nightly, over its
  # committed seeds, its unpacked large seeds, and the corpus the previous run grew
  # (cached; a target's corpus past 32 MiB is minimized after its run, so the cache stays
  # small). Ten targets come to about 200 minutes plus the build. A finding fails the job
  # and uploads the crashing input; `fuzz/DETAILS.md` has the reproduce-and-fix loop.
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      # Keyed on the fuzz lockfile; `fuzz/target/` (the instrumented build) and the
      # cargo registry. Separate from the other Rust caches: different toolchain, flags,
      # and target dir.
      - name: Keep only the pinned Rust toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      - name: Cache fuzz build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz

      # The grown corpus is what makes each run start where the last one stopped.
      - name: Cache fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      # `cmdr-fs` links `libacl` through `exacl` on Linux, so every target that pulls it
      # in fails to link without the dev package.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libacl1-dev

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Install nightly toolchain (for cargo-fuzz)
        run: rustup toolchain install "$(./scripts/check/check --print-nightly)" --profile minimal

      - name: Run the long fuzz
        run: ./scripts/check/check --check desktop-rust-fuzz --ci
        env:
          CMDR_FUZZ_SECONDS: '1200'

      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # ===========================================
  # Miri (undefined behavior in unsafe Rust)
  # ===========================================
  # The modules whose `unsafe` is pure Rust, interpreted by Miri on the pinned nightly
  # (`checks/desktop-rust-miri.go` lists them). macOS because every target is the macOS build
  # of its module. About a minute warm; the cold part is Miri building its own sysroot.
  miri:
    name: Miri
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Keep only the pinned Rust toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      # Keyed per job like the others here; it holds `target/miri/`, Miri's own build.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Install nightly toolchain with Miri
        run:
          rustup toolchain install "$(./scripts/check/check --print-nightly)" --profile minimal --component
          miri,rust-src

      - name: Run Miri
        run: ./scripts/check/check --check desktop-rust-miri --ci

  # ===========================================
  # Kani proofs (the small safety decisions, for every input up to a bound)
  # ===========================================
  # Every `#[kani::proof]`, one `cargo kani` per crate. The check installs the pinned Kani,
  # which brings its own nightly and CBMC. No build cache: Kani builds only the crates
  # under proof, in seconds. `docs/tooling/testing.md` § "Kani proofs".
  kani:
    name: Kani proofs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Keep only the pinned Rust toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      # Same reason as the fuzz job: `cmdr-fs` links `libacl` on Linux.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libacl1-dev

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Run Kani proofs
        run: ./scripts/check/check --check desktop-rust-kani --ci

  # ===========================================
  # Property mutants (each property fails under its recorded mutant)
  # ===========================================
  # Applies every `*.mutants.json` record in a mirror of the tree and runs its catcher, so
  # a property that can't fail turns this job red. A build per mutant: a fuzz record on the
  # fuzz nightly, a Kani record on the Kani the check installs.
  # No build cache on purpose: the repo's Rust caches already press GitHub's 10 GB ceiling,
  # and a cold run every six days costs less than evicting a per-push one.
  # `scripts/check/checks/DETAILS.md` § Property mutants.
  property-mutants:
    name: Property mutants
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Keep only the pinned Rust toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      # Same reason as the fuzz job: `cmdr-fs` links `libacl` on Linux.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libacl1-dev

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Install nightly toolchain (for cargo-fuzz)
        run: rustup toolchain install "$(./scripts/check/check --print-nightly)" --profile minimal

      - name: Run property mutants
        run: ./scripts/check/check --check desktop-rust-property-mutants --ci

  # ===========================================
  # Thread interleavings (Shuttle)
  # ===========================================
  # The `shuttle_*` tests, built with each crate's `shuttle` feature in a target dir of
  # their own. Seconds to run, minutes to build cold, hence here rather than per push.
  # `scripts/check/checks/DETAILS.md` § Interleaving tests (Shuttle).
  shuttle:
    name: Thread interleavings (Shuttle)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Keep only the pinned Rust toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      # `cmdr-fs` links `libacl` on Linux.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libacl1-dev

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Run the interleaving tests
        run: ./scripts/check/check --check desktop-rust-shuttle --ci

  # ===========================================
  # Pre-release gates
  # ===========================================
  # The checks `release.sh` runs before every tag (`IsPreRelease`: clippy with mimalloc on
  # macOS, the desktop bundle-size gate). They also run here so a regression surfaces within
  # six days instead of on release morning. macOS because `clippy-mimalloc` lints macOS-only
  # code (it skips anywhere else). Lane and decision: `scripts/check/DETAILS.md` § Pre-release lane.
  pre-release:
    name: Pre-release gates
    # The release builder's image; see the `runs-on` comment in `release-pipeline.yml` for why
    # it's never `macos-latest`.
    runs-on: macos-26
    # A cold ~1000-crate clippy build in the lane's private target dir, on a 3-core runner.
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Keep only the pinned Rust toolchain
        uses: ./.github/actions/pinned-rust-toolchain

      # Its own per-job cache, kept warm by the six-day cron like the others here.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Run the pre-release lane
        run: ./scripts/check/check --pre-release --ci

  # ===========================================
  # Website Docker build
  # ===========================================
  # The website deploys as a Docker image built on the server; per-push CI only
  # builds the site itself. This periodic full image build catches Dockerfile /
  # .dockerignore drift before it breaks a real deploy, then probes the built image's nginx.
  website-docker:
    name: Website Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Build check tool
        run: go build -o check .
        working-directory: ./scripts/check

      - name: Build website Docker image
        run: ./scripts/check/check --check website-docker-build --ci

  # ===========================================
  # SMB soak test (manual trigger only)
  # ===========================================
  # 30-minute repeated SMB→Local copy loop that watches for accumulating bugs
  # (credit leaks, FD leaks, memory growth, per-iteration drift). Nightly is
  # too aggressive for a soak this long; `workflow_dispatch` runs it on demand
  # when we want the signal (pre-release, after SMB refactors, etc.).
  smb-soak:
    name: SMB soak (30 min)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    # The soak itself is a fixed 30 minutes, and everything before it (mise,
    # a cold Cargo build, the Tauri Linux packages, the Docker SMB containers)
    # took ~20 on the 2026-08-19 run, which hit the old 50-minute ceiling with
    # the soak still running and reported the job as cancelled. Sized so the
    # setup can grow without the deadline eating the signal we asked for.
    timeout-minutes: 80

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install tools with mise
        run: mise install

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry/cache
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri dependencies (Linux)
        uses: ./.github/actions/tauri-linux-deps
        timeout-minutes: 20

      - name: Start Docker SMB containers
        run: ./apps/desktop/test/smb-servers/start.sh core

      - name: Run SMB soak (30 min)
        run: ./scripts/soak-smb.sh 1800
        env:
          RUST_LOG: info

      - name: Stop Docker SMB containers
        if: always()
        run: ./apps/desktop/test/smb-servers/stop.sh || true
