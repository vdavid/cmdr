name: Release

on:
  push:
    tags:
      - 'v*'
  # The second half of a release whose update archives are signed on the laptop
  # (`RELEASE_UPDATE_SIGNING=local`): `scripts/release-finish.sh` runs
  # `gh workflow run release.yml --ref vX.Y.Z` once its signatures are on the draft. The pipeline's
  # guard refuses a dispatch on anything but a tag.
  workflow_dispatch:

# The `release` job below grants what the pipeline needs; nothing else in this file gets a token.
permissions:
  contents: read

jobs:
  # Every job lives in `release-pipeline.yml`, a reusable workflow, so the build provenance the
  # `attest` job signs names that file as the signer rather than this one. That's what lifts the
  # attestation to SLSA Build Level 3 on GitHub. ❌ Don't move jobs back in here: anything this file
  # runs itself would sit outside that signer. `docs/guides/releasing.md` § Provenance and SBOM
  # attestations.
  release:
    name: Release
    uses: ./.github/workflows/release-pipeline.yml
    # The union of what the pipeline's jobs need; each job there narrows it to its own.
    permissions:
      contents: write # create the release, upload assets, push `latest.json` to main
      actions: read # `ci-gate` lists CI runs
      security-events: read # `ci-gate` lists open CodeQL alerts
      id-token: write # `attest` requests the Sigstore signing certificate
      attestations: write # `attest` stores the attestations
    # The repo-level secrets (`DEPLOY_WEBHOOK_SECRET`, `HOMEBREW_TAP_TOKEN`, and the signing secrets
    # still held at repo level). The `build` job's `release` environment secrets don't pass through
    # here; that job reads them itself, and they win over a same-named secret passed from here.
    secrets: inherit
