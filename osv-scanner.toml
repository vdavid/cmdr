[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
reason = "braces 3.0.3, via micromatch in lint and test tooling (devDependencies of desktop and the dashboard). It expands only our own glob patterns. No fixed version exists."

[[IgnoredVulns]]
