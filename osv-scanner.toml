reason = "deepmerge 4.3.1 (prototype poisoning of mergeObject's result), via @sveltejs/vite-plugin-svelte under SvelteKit, devDependencies of desktop and the dashboard. It runs only at build time, merging the plugin's options with our own Svelte config (`src/utils/options.js`); nothing it merges is bundled into the app or the dashboard. No fixed version exists. Verified with `pnpm why -r deepmerge`, 2026-10-27."

[[IgnoredVulns]]
id = "GHSA-jmr9-qjv8-65gv"
reason = "extract-zip 2.0.1: same Lighthouse CI-only path as GHSA-7pqw-9j4j-h8q3. No fixed version exists."

# Scoped to one version, so the zod 4 line (which has the fix, pinned in `pnpm-workspace.yaml`) stays watched.
[[PackageOverrides]]
name = "zod"
version = "3.25.76"
ecosystem = "npm"
vulnerability.ignore = true
reason = "zod 3.25.76 (GHSA-mrhx-c7xc-m3w5, memory exhaustion validating oversized collections), via chromium-bidi under puppeteer-core under Lighthouse CI (@lhci/cli, a website devDependency), validating protocol messages from the Chrome it launched against our own built site. The only fix is zod 4.6.6, a major chromium-bidi doesn't take yet. Verified with `pnpm why zod -r`, 2026-10-25."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch 3.1.5 and 10.2.6 (glob-pattern amplification in preprocessing, a CPU and memory denial of service for an attacker-supplied pattern). Both are devDependencies only: 10.2.6 via eslint's config-array and typescript-eslint in every app's lint run, 3.1.5 via glob 7 under Lighthouse CI's chrome-launcher and via serve-handler under `serve` (website devDependencies). They only ever see our own checked-in patterns (eslint file globs, serve's own config), never input from outside, and nothing here ships in the app or the website. The fix is 11.0.1, a major that eslint 10 and glob 7 don't accept (a forced override wasn't taken in #855). Verified with `pnpm why minimatch -r`, 2026-10-31."
