reason = "sprintf-js 1.0.3, via js-yaml 3 under Lighthouse CI (@lhci/cli, a website devDependency), formatting its own messages. No fixed version exists."

[[IgnoredVulns]]
id = "GHSA-7pqw-9j4j-h8q3"
reason = "extract-zip 2.0.1, via @puppeteer/browsers under Lighthouse CI (website devDependency), unpacking Chrome downloads from Google's own CDN. No fixed version exists."

[[IgnoredVulns]]
