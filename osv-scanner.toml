# OSV-Scanner (and OpenSSF Scorecard's Vulnerabilities check, which runs it) reads this file for the
# lockfiles beside it: `Cargo.lock` and `pnpm-lock.yaml`. It doesn't apply to subdirectories, which
# carry their own. Each entry says why the advisory doesn't put the shipped macOS app at risk: it
# can't reach the app, it's an "unmaintained" notice with no known vulnerability, or (only `rsa`)
# its attack needs a shape the app doesn't have, argued in full in `deny.toml`.
# ❌ Never ignore a vulnerability that applies to the shipped app: fix it, or leave it visible.
# Reasons verified with `cargo tree -i <crate> -e normal --target aarch64-apple-darwin` and
# `pnpm why -r`, 2026-10-08.

# --- Rust: in the shipped app, but no exploitable vulnerability ---

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "rsa (Marvin attack: private-key timing side channel, no patched version exists). Reaches the app only through russh in cmdr-sftp, our SSH client, which signs one auth challenge per connect with the user's own RSA key file; it never decrypts, and an attacker can't drive private-key operations at will. Full analysis, and when to re-check, in deny.toml."

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
reason = "block-buffer (a panic inside the caller's block callback, caught with catch_unwind, can leave the buffer's cursor corrupt). Fixed in 0.12.1, which we use; the 0.10.4 copy under digest 0.10 (md-5, sha1, sha2 0.10) has no fixed release on its line. Not exploitable here: the only callbacks digest 0.10 passes are the hashes' own fixed compression functions, which don't panic on any input, so no input can trigger it. Goes away when md-5, sha1, and sha2 0.10's dependents move to digest 0.11 (`cargo tree -i block-buffer@0.10.4 -e normal --target aarch64-apple-darwin`, 2026-10-27)."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0192"
reason = "ttf-parser is unmaintained (notice only, no known vulnerability): pulled in by lopdf 0.42 under pdf-extract (the AI agent's PDF text reader), whose latest release still pins lopdf ^0.42. lopdf 0.45 swapped it for skrifa, so this goes away when pdf-extract moves up."

# --- Rust: can't reach the shipped app ---

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
reason = "glib 0.18 (unsound VariantStrIter): Tauri's GTK stack, built only for Linux, where we run E2E tests. Not in the macOS graph."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
reason = "proc-macro-error is unmaintained: a build-time proc macro under Tauri's Linux GTK stack. Not in the macOS graph."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0194"
reason = "quick-xml 0.39 (quadratic duplicate-attribute check) reaches us only through wayland-scanner, a Linux build-time proc macro parsing Wayland's own protocol XML. Our runtime XML parsing uses quick-xml 0.41, which has the fix."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0195"
reason = "quick-xml 0.39 (NsReader allocation): same Linux build-time-only path as RUSTSEC-2026-0194; our runtime copy is 0.41, which has the fix."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
reason = "zvariant is unmaintained (notice only, no known vulnerability): Linux-only D-Bus plumbing under zbus (our Linux secret-service store, Tauri's notification and opener plugins). Not in the macOS graph (`cargo tree -i zvariant@5.15.0 --target aarch64-apple-darwin` prints nothing, 2026-10-17)."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
reason = "zbus_names is unmaintained (notice only): same Linux-only zbus path as RUSTSEC-2026-0370."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0372"
reason = "zvariant_derive is unmaintained (notice only): a proc macro on the same Linux-only zbus path as RUSTSEC-2026-0370."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = "paste is unmaintained: a proc macro, so it runs at compile time and leaves nothing in the binary."

# --- npm (all dev/build-time; nothing here ships in the app or on the website) ---

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
reason = "deepmerge 4.3.1 (prototype poisoning of mergeObject's result), via @sveltejs/vite-plugin-svelte under SvelteKit, devDependencies of desktop and the dashboard. It runs only at build time, merging the plugin's options with our own Svelte config (`src/utils/options.js`); nothing it merges is bundled into the app or the dashboard. No fixed version exists. Verified with `pnpm why -r deepmerge`, 2026-10-27."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch 10.2.6 (glob-pattern amplification in preprocessing, a CPU and memory denial of service for an attacker-supplied pattern; 3.1.5, also in the tree, is below the affected range). A devDependency only: via eslint's config-array and typescript-eslint's typescript-estree in every app's lint run, which only ever see our own checked-in patterns (eslint file globs), never input from outside; nothing here ships in the app or the website. The fix is 11.0.1, a major that eslint 10.14, config-array 0.23.5, and typescript-estree 8.72.2 (all latest) don't accept, and 11 changes matching semantics (empty path portions, `**` partial matches), so a forced override could silently change which files get linted. Verified with `pnpm why minimatch -r`, 2026-11-11."
