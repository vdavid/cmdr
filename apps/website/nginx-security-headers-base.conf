# The security headers every location shares, the site's pages and the browser demo alike, included
# by nginx-security-headers.conf and nginx-demo-security-headers.conf. Only the CSP differs per
# area, so it lives in those two.
#
# Permissions-Policy turns off device features the site never uses. `payment` is deliberately
# absent: Paddle's checkout iframe may need it for Apple Pay and Google Pay.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=(), hid=(), bluetooth=(), midi=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Reporting-Endpoints 'csp="https://api.getcmdr.com/csp-report"' always;
