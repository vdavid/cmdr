# Access log: one file per UTC day, WITHOUT the client IP, in a host-mounted directory so it survives
# a container recreate (every website deploy does one). It exists to answer "where did this traffic
# come from?": link-preview bots (TelegramBot, Twitterbot, ...) mark the minute a link was shared, and
# referrer, user agent, Accept-Language, and the `?r=`/`?ref=` query tell the rest. The IP is left out
# on purpose: the privacy policy promises we keep no raw IPs, and the host deletes files after 30 days
# (a systemd-tmpfiles rule from the infra repo's Hetzner Ansible `docker` role).
map $time_iso8601 $access_log_day {
    "~^(?<day>\d{4}-\d{2}-\d{2})" $day;
    default "unknown";
}

# Files from `public/` keep their names across deploys, so they're only cached for a year when the
# URL carries the content version `src/plugins/asset-versions.ts` adds (`?v=<hash>`): a changed file is
# then a new URL. Without one, browsers revalidate (a 304 with the ETag when nothing changed).
map $arg_v $public_asset_cache_control {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

# The browser demo's precompressed Brotli (nginx-demo-precompressed.conf): `.br` when the client
# accepts it, else nothing, so `try_files` falls back to the plain file. A `br;q=0` refusal is too
# rare to model; Cloudflare, the only client nginx sees in production, sends `br, gzip`.
map $http_accept_encoding $demo_br_suffix {
    "~*(^|[\s,])br($|[\s,;])" ".br";
    default "";
}

# `try_files` rewrites `$uri` to the file it picked, and `add_header` reads this after that, so the
# header says `br` exactly when the twin went out (a file with no twin goes out plain, unlabeled).
map $uri $demo_content_encoding {
    "~\.br$" "br";
    default "";
}

log_format site_no_ip '$time_iso8601 "$request_method $request_uri" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" "$http_accept_language"';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at Cloudflare, so nginx thinks it's serving http and its directory redirect
    # (`/features` → `/features/`) would say `Location: http://...`. CSP `'self'` refuses that
    # https → http hop, which broke every prefetch of a slash-less link. A relative Location keeps
    # the scheme the visitor used.
    absolute_redirect off;

    access_log /var/log/nginx/site/access-$access_log_day.log site_no_ip;

    # Astro builds `src/pages/404.astro` to `/404.html`; the `.html` location serves it, uncached.
    error_page 404 /404.html;

    # No compression here on purpose: Cloudflare compresses at the edge with Brotli or zstd, but
    # only when the origin sends plain bytes. A gzipped response is passed through as gzip, which
    # is 15–20% bigger. The one exception is the browser demo's bundle, which ships its own Brotli
    # quality-11 twins, smaller than the edge's (the `/demo/_app/immutable/` location).

    # Sets `$csp_script_hashes`, which the CSP in security-headers.conf uses.
    include /etc/nginx/snippets/csp-script-hashes.conf;
    # Sets `$csp_demo_script_hashes`, which the browser demo's CSP uses (demo-security-headers.conf).
    include /etc/nginx/snippets/csp-demo-script-hashes.conf;

    # Security headers: every location block that serves content includes
    # nginx-security-headers.conf (it says why it has to be per location), or, under `/demo/`,
    # nginx-demo-security-headers.conf.
    #
    # Edge caching: `Cloudflare-CDN-Cache-Control` sets how long Cloudflare keeps a response, and
    # browsers ignore it, so pages stay `no-cache` for them. Cloudflare's cache rule for this host
    # only caches what declares a lifetime (infra repo, `cloudflare/getcmdr.com-cache.tf`), and every
    # deploy purges the zone (`infra/deploy-webhook/deploy-website.sh`), so an hour is a safety bound,
    # not a staleness window. Without `always`, a 404 or 5xx never gets edge-cached.

    # The browser demo (issue #302, `apps/website/DETAILS.md` § Browser demo): the desktop frontend
    # as a SvelteKit SPA under `/demo/`, with its own security headers and `noindex`. `^~` keeps the
    # extension-matching regex locations below from serving its files with the site's headers.
    location = /demo {
        return 301 /demo/;
    }

    # SvelteKit's bundle (the `.wasm` included, which nginx's mime table serves as
    # `application/wasm`): content-hashed names, so a year. A missing file is a real 404, never the
    # app page.
    location ^~ /demo/_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/demo-security-headers.conf;
        try_files $uri =404;

        # The large `.wasm`, `.js`, and `.css` files have a Brotli quality-11 twin, `<file>.br`
        # (`apps/desktop/scripts/precompress-demo.ts`). One location per type, because `try_files`
        # picks the twin in place and nginx then types the response by ITS extension: each
        # `types` maps `br` to the original's type. The snippet says how the encoding header stays
        # honest. Cloudflare asks with `accept-encoding: br, gzip` and passes `br` through
        # (`apps/website/DETAILS.md` § Browser demo has the post-deploy check).
        location ~ \.wasm$ {
            types { application/wasm wasm br; }
            include /etc/nginx/snippets/demo-precompressed.conf;
        }
        location ~ \.js$ {
            types { application/javascript js br; }
            include /etc/nginx/snippets/demo-precompressed.conf;
        }
        location ~ \.css$ {
            types { text/css css br; }
            include /etc/nginx/snippets/demo-precompressed.conf;
        }
    }

    # Everything else: the file if it exists, else the app page (the SPA fallback adapter-static
    # assumes), so a deep link or a reload under `/demo/` boots the app. Always revalidated, so a
    # deploy's new asset hashes reach the next visit.
    location ^~ /demo/ {
        add_header Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=3600";
        include /etc/nginx/snippets/demo-security-headers.conf;
        try_files $uri /demo/index.html;
    }

    # Astro's bundled output: the content hash is in the file name, so it never changes in place.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Files from `public/`: a year when versioned, else revalidate (the `map` above says why).
    # Keep the extension list in sync with `VERSIONED_EXTENSIONS` in `src/plugins/asset-versions.ts`.
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|avif|mp4|webm|woff|woff2|ttf|otf|eot|js|css)$ {
        add_header Cache-Control $public_asset_cache_control;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # HTML files - always revalidate to pick up new asset hashes. `always` covers the 404 page too.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # JSON data files (like latest.json) - revalidate frequently
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=60";
        add_header Cloudflare-CDN-Cache-Control "max-age=60";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Markdown mirrors of blog posts (for AI agents). nginx's default mime table has no .md
    # entry, so without this block they'd be served as application/octet-stream.
    location ~* \.md$ {
        types {
            text/markdown md;
        }
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "no-cache";
        add_header Cloudflare-CDN-Cache-Control "max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The sample MDM files linked from /trust#mdm. nginx's default mime table knows neither
    # extension; the Apple type is what makes Safari hand a profile to System Settings.
    location ^~ /mdm/ {
        types {
            application/x-apple-aspen-config mobileconfig;
            application/x-plist plist;
        }
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Always-latest download links, for example getcmdr.com/download/latest/universal. Published
    # wherever we can't edit the URL per release (app directories, the README, blog posts). The API
    # server resolves `latest` to the current version, records the download, and redirects to the
    # DMG, so this stays a dumb pass-through that keeps the query string (?ref=, ?src=) intact.
    location ~ ^/download/latest/(aarch64|x86_64|universal)$ {
        return 302 https://api.getcmdr.com/download/latest/$1$is_args$args;
    }

    # The release's SHA-256 list, linked from the download card so a website download can be checked.
    # Its own location because the arch pattern above is an allowlist: adding `checksums` to that
    # group would read as a fourth architecture, and the API server deliberately treats it as neither
    # (no `downloads` row, absent from `validArchitectures`).
    location = /download/latest/checksums {
        return 302 https://api.getcmdr.com/download/latest/checksums$is_args$args;
    }

    # Bare /download/latest: hand out the universal build, which runs on every Mac.
    location = /download/latest {
        return 302 https://api.getcmdr.com/download/latest/universal$is_args$args;
    }

    # Pages: `/features` → `/features/` (directory redirect) → its `index.html`. Anything else is a
    # real 404 with the site's own page, never the home page served as a 200 (a "soft 404" search
    # engines penalize, and a broken link that looks fine).
    location / {
        add_header Cache-Control "no-cache";
        add_header Cloudflare-CDN-Cache-Control "max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }
}
