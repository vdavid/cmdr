# Security headers, included by every location block in nginx.conf but `/demo/`, which has its own
# policy (nginx-demo-security-headers.conf). nginx drops ALL
# server-level add_header directives in a location that sets its own, so each location has to
# carry the full set; the include keeps it one copy.
#
# `connect-src` must list every origin the site's JS fetches: the browser blocks anything else
# before it leaves the page, and the caller sees only a generic network failure. The
# `website-csp-connect-src` check enforces it for code in apps/website. Violations that slip past
# it (third-party scripts, code the check can't read) are reported to the API server, which
# alerts Discord (apps/api-server/src/website/csp-report.ts). `report-uri` is for Firefox and
# Safari; Chromium prefers `report-to` when both are set.
#
# The Report-Only policy is the stricter one we're moving to: inline scripts only by the hashes the
# build computed (`$csp_script_hashes`, from src/plugins/csp-hashes.ts), images only from us and
# the two embeds, no plugins, no `<base>` hijack. Browsers report what it would block without
# blocking it, with a sample of each inline script (`'report-sample'`), and the API server logs
# those reports without alerting. Once the logs stay clean, it replaces the enforced policy.

# The headers every page shares, the browser demo included.
include /etc/nginx/snippets/security-headers-base.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://comments.getcmdr.com https://*.paddle.com 'unsafe-inline'; style-src 'self' https://*.paddle.com 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.getcmdr.com https://comments.getcmdr.com https://*.paddle.com; worker-src 'self' blob: data:; frame-src https://comments.getcmdr.com https://*.paddle.com; report-uri https://api.getcmdr.com/csp-report; report-to csp" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://comments.getcmdr.com https://*.paddle.com $csp_script_hashes 'report-sample'; style-src 'self' https://*.paddle.com 'unsafe-inline'; img-src 'self' data: https://comments.getcmdr.com https://*.paddle.com; font-src 'self'; connect-src 'self' https://api.getcmdr.com https://comments.getcmdr.com https://*.paddle.com; worker-src 'self' blob: data:; frame-src https://comments.getcmdr.com https://*.paddle.com; object-src 'none'; base-uri 'self'; report-uri https://api.getcmdr.com/csp-report; report-to csp" always;
