# Security headers for the browser demo at `/demo/` (issue #302), included by every `/demo/`
# location in nginx.conf in place of nginx-security-headers.conf. The demo is a different app (the
# desktop frontend on a fake backend, `apps/desktop/src/lib/demo/`), so it gets its own policy,
# and nothing here loosens the rest of the site.
#
# - `script-src`: only our own files, the demo page's inline scripts by the hashes the build
#   computed (`$csp_demo_script_hashes`, from src/plugins/demo.ts), and `'wasm-unsafe-eval'`,
#   which compiling the listing engine's WebAssembly needs (it allows WASM, not JS `eval`).
# - `style-src 'unsafe-inline'`: Svelte's `style:` directives and `style="…"` attributes.
# - `connect-src 'self'`: the demo fetches only its own `.wasm`; every backend call is in-page.
# - `frame-ancestors 'self'`: our own pages may embed the demo (a landing-page embed later),
#   nobody else may. X-Frame-Options SAMEORIGIN (the base headers) says the same to old browsers.
# - `frame-src 'self' blob:`: the demo's secondary windows (Settings and the like) are same-origin
#   iframes of `/demo/<route>` (`apps/desktop/src/lib/demo/CLAUDE.md`). `blob:` is the viewer's PDF:
#   its `<embed>` loads a `blob:` URL the page made (`object-src blob:`), and Chrome's PDF viewer
#   checks `frame-src` too, showing "This content is blocked" without it (Chrome 156, 2026-11-05).
# - Violations report to the API server like the site's (nginx-security-headers.conf says where).
include /etc/nginx/snippets/security-headers-base.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' $csp_demo_script_hashes; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'self'; object-src blob:; base-uri 'self'; form-action 'none'; report-uri https://api.getcmdr.com/csp-report; report-to csp" always;
# Unlaunched and unlinked: no search engine lists any of it until David launches the demo.
add_header X-Robots-Tag "noindex, nofollow" always;
