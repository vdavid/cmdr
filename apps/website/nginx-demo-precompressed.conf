# Serves the browser demo's precompressed Brotli twin (`<file>.br`, written by
# `apps/desktop/scripts/precompress-demo.ts`) to a client that accepts `br`, else the plain file,
# with no third-party module (nginx's `brotli_static` would need ngx_brotli). Included by the
# per-type locations under `/demo/_app/immutable/` in nginx.conf, which set the `types` that
# label a `.br` with its original's Content-Type.
#
# - `$demo_br_suffix` is `.br` when `Accept-Encoding` lists `br` (a `map` in nginx.conf), so
#   `try_files` tries the twin first and falls back to the plain file, then a real 404.
# - `$demo_content_encoding` is `br` only when the file served ends in `.br`; an empty value sends
#   no header, so a plain fallback is never mislabeled.
# - `Vary: Accept-Encoding` goes on both, since the same URL answers differently per client.
# - A nested location's `add_header` replaces its parent's, so this repeats the parent's headers.
add_header Cache-Control "public, max-age=31536000, immutable";
add_header Vary "Accept-Encoding";
add_header Content-Encoding $demo_content_encoding;
include /etc/nginx/snippets/demo-security-headers.conf;
try_files $uri$demo_br_suffix $uri =404;
