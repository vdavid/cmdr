# What a Mac-friendly NAS runs: `catia` maps the private-use names, `fruit` gives
# macOS its AFP_AfpInfo and AFP_Resource streams, and `streams_xattr` stores
# named streams as xattrs. For testing Finder tags and other macOS xattrs.
[global]
server role = standalone server
server string = Mac-friendly NAS
server min protocol = SMB2_02
server max protocol = SMB3_11
map to guest = Bad User
log level = 1
vfs objects = catia fruit streams_xattr
fruit:metadata = stream
fruit:resource = stream
fruit:encoding = private

[public]
path = /shares/public
read only = no
guest ok = yes
browseable = yes
create mask = 0666
directory mask = 0777
