[package]
name = "cmdr"
version = "0.41.0"
description = "A blazing fast, keyboard-driven, two-pane file manager built, Rust, Tauri, and ❤️"
authors = ["David Veszelovszki <david@getcmdr.com>"]
edition = "2024"
license = "LicenseRef-BSL-1.1"
default-run = "Cmdr"
publish = false  # Private application, not for crates.io

# The house lint set lives in the workspace root's `[workspace.lints]`, so every
# crate we write shares one definition. Unlike the crate-root `#![deny(…)]` block
# it replaced, this also covers the bins, tests, benches, and build script.
[lints]
workspace = true

[features]
# Playwright E2E testing plugin (socket bridge to real webview). Never enable in production builds.
playwright-e2e = ["dep:tauri-plugin-playwright", "cmdr-fs/playwright-e2e"]
# Virtual MTP device for E2E testing (registers a fake Android device). Never enable in production builds.
virtual-mtp = ["mtp-rs/virtual-device"]
# Virtual SMB hosts for E2E testing (injects synthetic network hosts). Never enable in production builds.
#
# It forwards through `cmdr-smb`, which owns the SMB protocol layer, rather than
# naming `smb2/testing` directly: cargo unifies features across the graph, so the
# one `smb2` everything resolves to gets `testing` turned on and this crate's own
# direct `smb2` calls (`network::virtual_smb_hosts`) see it too.
smb-e2e = ["cmdr-smb/testing"]
# "This is a test build.", forwarded to the two crates that act on it. They widen
# their test-only scaffolding (`cmdr_index::testing`, `cmdr_fs::testing`) from
# `#[cfg(test)]` to `pub`, which is the only way this crate's tests can reach it:
# `cfg(test)` is set only while a crate compiles its OWN test target, never when a
# consumer compiles it as a dependency.
# Enabled automatically for every dev target and only for those; see the self
# dev-dependency under `[dev-dependencies]`. Never enable in production builds.
# `cmdr-smb/testing` is in the list for `cmdr_smb::volume::testing` (the shared
# Docker fixtures the app's SMB suites connect through). It also turns
# `smb2/testing` on for every dev target, which is harmless: `smb-e2e` already
# does that, and nothing here reads `smb2::testing`.
# `cmdr-sftp/testing` is in the list for `cmdr_sftp::volume::testing` (the shared
# Docker fixtures the app's SFTP suites connect through), the same reason
# `cmdr-smb/testing` is.
testing = [
  "cmdr-archive/testing",
  "cmdr-fs/testing",
  "cmdr-index/testing",
  "cmdr-smb/testing",
  "cmdr-sftp/testing",
  "cmdr-adb/testing",
]

[[bin]]
name = "Cmdr"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cmdr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Filesystem vocabulary and host primitives shared across the workspace: the
# `Volume` trait and its data types, `FileEntry`, the typed error classification,
# thread QoS, process memory, poison-free locking. No Tauri, no index.
cmdr-fs = { path = "../../../crates/cmdr-fs" }
# The archive backend: a `Volume` over a zip / tar / 7z file. Its own crate, with
# no `tauri` in its tree, so the ~10 codec crates it needs stay out of this
# manifest and `cargo check -p cmdr-archive` verifies it without building the app.
cmdr-archive = { path = "../../../crates/cmdr-archive" }
# The SMB protocol layer: the share-listing vocabulary, the smb2 error
# classification, and the address builder. No `tauri` in its tree, so
# `cargo check -p cmdr-smb` verifies it without building the app. Discovery,
# mounts, the keychain, and every event stay here in `network/`.
cmdr-smb = { path = "../../../crates/cmdr-smb" }
# The SFTP backend: the `Volume` over one SSH connection, the auth ladder, the
# host-key trust decision, and the byte path. No `tauri` in its tree, so
# `cargo check -p cmdr-sftp` verifies it without building the app. The trusted-key
# store, the secret store, the server list, and every command stay here.
cmdr-sftp = { path = "../../../crates/cmdr-sftp" }
# The Android-over-ADB backend: a real-filesystem `Volume` per device behind the
# ADB server, beside MTP. No `tauri`, no user-facing words; `docs/specs/android-adb-backend.md`.
cmdr-adb = { path = "../../../crates/cmdr-adb" }
# The index: the file index, the media index, and folder importance, behind one
# `Index` handle. Tauri-free by design and enforced — the app is its host, which
# is why every seam it needs is answered in `src/index_host.rs` and nowhere else.
cmdr-index = { path = "../../../crates/cmdr-index" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-mcp-bridge = "0.12"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2.6"
tauri-plugin-notification = "2.3.3"
# Global system-wide keyboard shortcut (default ⌃⌥⌘J for "reveal latest download"). On
# macOS, the plugin uses Carbon's `RegisterEventHotKey` so it needs no extra TCC grant
# (Accessibility/Input Monitoring not required). Pinned at 2.3.2 (published 2026-05-28).
tauri-plugin-global-shortcut = "=2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
dirs = "6"
image = "0.25.10"
base64 = "0.23.0"
rayon = "1.11.0"
regex = "1"
uuid = { version = "1.19.0", features = ["v4", "v7"] }
tauri-plugin-clipboard-manager = "2"
notify-debouncer-full = "0.7.0"
bincode2 = "2"
tauri-plugin-fs = "2.4.4"
alphanumeric-sort = "1.5"
chrono = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
# Device ID hashing for fair-use license tracking
sha2 = "0.11"
log = "0.4"
# fern: hand-rolled log dispatch tree with per-output filtering. Replaces tauri-plugin-log
# (which routes everything through a single global level). The crate was already in the
# tree as a transitive of tauri-plugin-log; pinned at 0.7.1 (latest stable, ~17 months old).
fern = "0.7.1"
# file-rotate: size+count log rotation behind a `Write` impl. Dropped tauri-plugin-log,
# so we own the rotation now. 0.8.0 (latest stable, ~14 months old, MIT). Pulls in
# `chrono`/`filetime`/`flate2` are all already in our dep tree.
file-rotate = "0.8.0"
# Memory allocator: returns memory to OS faster than system malloc, reduces fragmentation
mimalloc = "0.1"
# HTTP client for API server validation and AI downloads
reqwest = { version = "0.13", features = ["json", "rustls", "stream", "multipart"], default-features = false }
# MCP server
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "process"] }
futures-util = "0.3"
# tokio-util: provides `CancellationToken` for cooperative cancellation of streaming
# AI suggestions (`ai/suggestions.rs::stream_folder_suggestions`). The `rt` feature
# enables runtime integration (token wakeups via tokio's reactor). 0.7.18 is the latest
# stable (published 2026-01-04). MIT license; tracks tokio's release cadence.
tokio-util = { version = "0.7.18", features = ["rt"] }
tower-http = { version = "0.7", features = ["cors"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
memchr = "2"
# File-viewer encoding decoder (UTF-16, Windows-1252, ISO-8859-1, Mac Roman, US-ASCII).
# Pinned 2026-05-28 against crates.io v0.8.35 (released 2024-10-24, well past 14-day gate).
# Apache-2.0 OR MIT.
encoding_rs = "0.8.35"
# Lock-free atomic Arc swap used by the file viewer to replace the active backend
# (ByteSeek/LineIndex) without taking a write lock on the read path. Already pulled
# in transitively; declaring it makes the dependency explicit.
arc-swap = "1.9.1"
walkdir = "2"
# Drive indexing: SQLite store and macOS FSEvents watcher (the parallel directory
# walker is now the in-tree `indexing::scanner::walker`, not a dependency)
rusqlite = { version = "0.40", features = ["bundled", "collation", "fallible_uint"] }
# For chunked copy metadata preservation (network filesystems)
xattr = "1"
filetime = "0.2"
exacl = "0.13"
sysinfo = { version = "0.39.0", default-features = false, features = ["system"] }
time = { version = "0.3", features = ["parsing", "macros", "formatting"] }
# Playwright E2E testing plugin: socket bridge for direct webview injection (optional, feature-gated, dev-only).
# Provides multi-window command targeting and label-aware macOS native screenshots (so E2E can capture
# non-frontmost windows like Settings or the viewer).
tauri-plugin-playwright = { version = "0.4.1", optional = true }
# Error reporter: zip the bundle (manifest + redacted log files). `deflate` is the default
# compression algorithm; we don't need bzip2/zstd/etc. for log text. The archive backend's own
# use of this crate (the write side, and the decrypt path rc-zip can't serve) lives in
# `cmdr-archive`; `aes-crypto` is declared there and unifies here, so the feature set is a
# superset of both. `aes 0.9.1` (stable) unifies with `smb2`'s SMB3 AEAD stack.
zip = { version = "8.6", default-features = false, features = ["deflate", "aes-crypto"] }
# `write_operations/compress_estimate.rs` sizes a deflate stream with `flate2`. The archive
# backend declares its own copies (plus the other tar codecs and 7z) in `cmdr-archive`.
# `tar` is NOT here: its only production caller is the macOS updater, so it's declared
# per-target below plus as a dev-dependency for the cross-platform test that builds one.
flate2 = "1"
# Error reporter: short-ID generation (`ERR-XXXXX`) using rejection sampling.
rand = "0.10"
# Pure-Rust git library for the git browser (M1: discover, repo info, status).
# Pinned at 0.85.0 (published 2026-06-22, ~4 weeks old at landing) per
# project rule on avoiding 0-day vulns. Default features include `status`,
# `basic`, and `extras` which cover discover + ahead/behind + status walk.
# `Repository::edit_tree()` is used by `file_system/git/test_fixtures.rs` so
# test fixtures build via gix instead of dozens of `git` CLI `fork+exec` calls
# (each ~50-150 ms on a loaded machine; one fixture chain used to spawn ~31 of
# them and time out the 8 s nextest cap under check.sh contention). It needed a
# `tree-editor` feature through 0.86 and rides the default set from 0.87 on.
gix = { version = "0.87" }
# Multi-provider LLM client. Normalizes OpenAI / OpenAI Responses / Anthropic / Gemini /
# xAI / Groq / DeepSeek / Ollama / OpenRouter / etc. Auto-routes `gpt-5*` / `*-codex` /
# `*-pro` to the Responses API; uses native protocols for Anthropic + Gemini. Replaces
# hand-rolled chat-completions JSON in `ai/client.rs`, which broke on (1) reasoning models
# that reject custom `temperature` (HTTP 400) and (2) Responses-only models that 404 on
# `/v1/chat/completions`.
#
# Pinned at the EXACT 0.6.5 (published 2026-06-06). The 0.6 line ships often, so pin exact
# to avoid surprise breakage on `cargo update` — 0.6.5 added the required `ToolResponse.fn_name`
# field, which is the kind of churn a caret range would have landed silently. The 0.7 line is
# still in beta. Solo maintainer; MIT/Apache-2.0; ~25k LOC if we ever need to fork.
genai = "=0.6.5"
# Type-safe IPC: typed Rust↔TS bindings for tauri commands and events.
# Generated `bindings.ts` lands in `apps/desktop/src/lib/ipc/`; the frontend
# imports `commands.commandName(args)` instead of `invoke('command_name', ...)`.
# Pinned at 2.0.0-rc.25 (published 2026-05-08); the
# v1 line is for Tauri 1, v2 RC line is the active branch for Tauri 2.
tauri-specta = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.24", features = ["derive", "serde_json"] }
# Fuzzy matcher for the in-directory "type to jump" feature. Helix's matcher, also used
# by Zellij and several TUI projects; fast (microseconds per match), smart-case, good
# scoring. Pinned at 0.3.1 (published 2024-02-20, well over a month old). MPL-2.0;
# already in the `deny.toml` allowlist. See `file_system/listing/fuzzy_jump.rs` for usage.
nucleo-matcher = "0.3.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
trash = "5.2"
# Credential storage via Linux secret service (GNOME Keyring / KDE Wallet).
# `keyring` 4.0 was a full architectural rewrite; the cross-platform API moved to
# `keyring-core` and each backend (Secret Service, etc.) is a separate crate. Picking
# the zbus-based backend keeps everything pure-Rust and matches our existing tokio +
# zbus + RustCrypto stack; no system libdbus needed at build time.
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }
# Encrypted file-based credential storage fallback when no secret service is available
cocoon = "0.5"
# D-Bus client for XDG Desktop Portal (accent color, appearance settings)
zbus = "5"
# Native file icons: XDG icon theme lookup (pure Rust, no GTK dependency)
freedesktop-icons = "0.4"
# MIME type guessing from file extensions (for icon name resolution)
mime_guess = "2"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# MTP (Android device) support via pure Rust implementation.
mtp-rs = "0.32.0"
bytes = "1"
# mDNS discovery for network host browsing (pure Rust, cross-platform)
mdns-sd = { version = "0.20", features = ["logging"] }
# SMB2/3 protocol client for share enumeration (pure Rust, pipelined I/O).
# When bumping: also re-vendor the test containers per
# apps/desktop/test/smb-servers/.compose/VENDORED.md
smb2 = { version = "0.20.1", features = ["serde"] }
# NFD normalization for APFS collation and SMB path normalization
unicode-normalization = "0.1"
# Percent-decoding for MCP resource URI query strings (cross-platform).
urlencoding = "2.1.3"
# Semver comparison: the custom updater (macOS) and the cross-platform What's-new changelog slicer.
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# The custom updater unpacks its release tarball with this. `mod updater` is
# macOS-only, so on Linux the lib never touches `tar` and a plain `[dependencies]`
# entry tripped `unused_crate_dependencies` there (CI red on the `Desktop (Rust)`
# lane). The cross-platform test that BUILDS a tarball gets it from
# `[dev-dependencies]` instead.
tar = "0.4"
file_icon_provider = "1.0.0"
core-foundation = "0.10.1"
core-services = "1.0.0"
icns = "0.4.0"
plist = "1.8.0"
objc2 = { version = "0.6", features = ["std", "exception"] }
objc2-foundation = { version = "0.3", features = [
    "NSURL", "NSString", "NSDictionary", "NSDate", "NSArray", "NSValue", "NSError",
    "NSData", "NSFileManager", "NSNotification", "NSBundle", "NSDistributedNotificationCenter", "NSUserDefaults",
    # `NSCurrentLocaleDidChangeNotification`, half of the live-language-change signal (`intl/live_locale.rs`).
    "NSLocale",
    "NSOperation", "NSProcessInfo",
    # `NSSearchPathDirectory::TrashDirectory`, how `trash_dir_for_path` asks Cocoa which
    # trash a given volume uses instead of reconstructing it from `statfs` + `getuid`.
    "NSPathUtilities",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSDragging", "NSDraggingItem", "NSImage", "NSColor", "NSColorSpace",
    "NSApplication", "NSMenu", "NSMenuItem", "NSPasteboard", "NSRunningApplication",
    "NSWorkspace", "NSPanel", "NSOpenPanel", "NSSavePanel", "NSWindow", "NSResponder",
    "NSEvent",
    # Startup "Cmdr is already running" alert (instance_lock.rs). NSAlert runs its own modal
    # loop, so it works inside Tauri's `setup` hook, before the event loop starts.
    "NSAlert",
    # File promises (drag out from MTP/SMB panes): NSFilePromiseProvider +
    # its delegate's writePromiseToURL:completionHandler: (block2 completion).
    "NSFilePromiseProvider", "block2",
    # TIFF→PNG conversion for paste-clipboard-as-file (NSBitmapImageRep +
    # representationUsingType:properties:); NSImageRep is its parent class.
    "NSBitmapImageRep", "NSImageRep",
] }
# Native macOS Quick Look panel (QLPreviewPanel + protocols). Published 2025-10-04, well
# outside the 14-day cool-off; tracks the same objc2 0.6 family as the other bindings above.
objc2-quick-look-ui = { version = "0.3.2", features = ["QLPreviewPanel", "QLPreviewItem", "objc2-app-kit"] }
block2 = "0.6"
security-framework = "3.2"
# Raw `SecItemCopyMatching` + keychain query constants, for reading SMB passwords that
# Finder/macOS saved (internet-password items the high-level crate can't filter by
# server/protocol). Already in the lockfile as a transitive dep of `security-framework`.
security-framework-sys = "2.17"
# Custom updater: signature verification (tarball extraction uses `tar` + `flate2`
# from the untargeted archive codec block above).
minisign-verify = "0.2"
# `CFUserNotification` (+ its `CFDate` / `CFURL` prerequisites) powers the instance-lock refusal
# alert: it's the one alert API that doesn't pump our run loop (see `instance_lock.rs`).
objc2-core-foundation = { version = "0.3.2", features = ["CFData", "CFDictionary", "CFString", "CFNumber", "CFBase", "CFCGTypes", "CFUserNotification", "CFDate", "CFURL"] }


[dev-dependencies]
# `volume_strategy_sequential_tests.rs` builds a tarball fixture and is NOT
# platform-gated, so `tar` has to be reachable from tests on every target. The
# production side is macOS-only (see the per-target section above).
tar = "0.4"
# Depending on ourselves turns the `testing` feature on for every DEV target
# (tests, benches, examples) and leaves it off for the lib and the `Cmdr` bin, so
# the shipped binary carries no test scaffolding. Verified both ways: `cargo check
# --lib` builds with the feature off, `cargo check --all-targets` with it on.
# The alternative, `required-features = ["testing"]` on the bench targets, would
# make `cargo clippy --all-targets` silently SKIP them, and an unlinted,
# never-compiled benchmark harness rots before the next person needs it.
cmdr = { path = ".", features = ["testing"] }
# Same crate as the normal dependency above, with the test-wait helpers
# (`cmdr_fs::testing::wait_until`) switched on for dev targets only.
cmdr-fs = { path = "../../../crates/cmdr-fs", features = ["testing"] }
# SMB integration tests hash source and destination bytes to catch pipeline
# corruption (dropped/duplicated chunks, concurrency bleed) that a simple
# size-check or `Vec<u8>` equality would either miss or report uselessly
# (a 20 MB diff isn't actionable). Pinned about a month old (published
# 2026-01-08) to avoid 0-day vulns in the freshest release.
blake3 = "1.8.3"
# Used only by the `#[ignore]`'d `ipc::tests::export_bindings_test`, invoked
# via `pnpm bindings:regen` to write `apps/desktop/src/lib/ipc/bindings.ts`.
# Not needed by release builds.
specta-typescript = "=0.0.11"
criterion = { version = "0.8.1", features = ["html_reports"] }
# Dev-only env-driven logger. Tests don't use `tauri-plugin-log` (it requires
# a Tauri runtime), so this gives us `RUST_LOG`-controlled logs for wire
# traces in integration benches.
env_logger = "0.11.10"
# For test-only cryptographic key generation (compatible with ed25519-dalek's rand_core 0.6)
rand_core = { version = "0.6", features = ["getrandom"] }
# Every app-side use is inside a `#[cfg(test)] mod tests`.
tempfile = "3"
# Property-based testing. Used for algorithmic functions where the input space
# is too large for example tests to cover meaningfully (parser, glob→regex,
# topological sort, Unicode collation). Pinned at 1.11.0 (published 2026-03-24,
# ~7 weeks old at landing). MIT OR Apache-2.0.
proptest = "1.11.0"
# HTTP mock server for AI client integration tests. Verifies request shape (temperature
# present on chat/completions, omitted on /v1/responses) and parsing without burning
# real API quota. Pinned at 0.6.5 (latest stable, published 2025-08-24).
wiremock = "0.6.5"

[[example]]
name = "smb_compose"
required-features = ["smb-e2e"]

[[example]]
name = "docker_smb_test"
required-features = ["smb-e2e"]

[[bench]]
name = "icon_benchmarks"
harness = false
