# The IDE the plugin compiles, tests, and runs against. A local installation, so there's no multi-gigabyte download and
# no licensing question. Override with `-PcmdrIdePath=…` or in `~/.gradle/gradle.properties` when the app moves.
cmdrIdePath=/Applications/IntelliJ IDEA 2026.2 EAP.app

# The Svelte plugin (`dev.blachut.svelte.lang`), taken from the local IDE's plugin dir rather than the marketplace so
# the version always matches the IDE. Empty or missing means the Svelte tests skip themselves; see `DETAILS.md`.
cmdrSveltePluginPath=~/Library/Application Support/JetBrains/IntelliJIdea2026.2/plugins/svelte

# The platform provides `kotlin-stdlib`; bundling a second copy is the classic plugin-loading break.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.configuration-cache=true
