[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/cmdr-adb",
  "crates/cmdr-archive",
  "crates/cmdr-collation",
  "crates/cmdr-fs",
  "crates/cmdr-git",
  "crates/cmdr-http",
  "crates/cmdr-index",
  "crates/cmdr-listing",
  "crates/cmdr-local",
  "crates/cmdr-mtp",
  "crates/cmdr-operation-log",
  "crates/cmdr-operations",
  "crates/cmdr-s3",
  "crates/cmdr-sftp",
  "crates/cmdr-smb",
  "crates/cmdr-update-trust",
  "crates/cmdr-webdav",
  "crates/fsevent-stream",
  "crates/index-query",
  "crates/operation-log-dump",
]
exclude = ["benchmarks/smb", "vendor/tauri-plugin-store", "vendor/zip"]
resolver = "2"

# Third-party crates we patch, each identical to its crates.io release apart from the fix, which
# its `vendor/<crate>/CMDR-PATCH.md` lists. `desktop-rust-vendor-patch-applied` fails when a bump
# past the vendored version makes cargo resolve crates.io again.
[patch.crates-io]
# `Store::save` writes a synced temp file and renames it over the store, so a crash mid-save
# can't leave `settings.json`, `shortcuts.json`, or `license.json` truncated (#461), and it
# refuses to save over a store file that didn't load (#506).
tauri-plugin-store = { path = "vendor/tauri-plugin-store" }
# A raw copy keeps an entry's name bytes and UTF-8 flag as stored, so editing a zip with
# Shift-JIS, GBK, or CP866 names leaves every one of them readable (#514).
zip = { path = "vendor/zip" }

# Optimized builds cross crate boundaries. Cargo's default (`lto = false`,
# `codegen-units = 16`) inlines only `#[inline]` and generic functions between
# crates, so any hot path that gets split across a crate boundary silently loses
# the inlining it had inside one crate. Thin LTO restores it at a fraction of
# `lto = "fat"`'s build cost.
#
# It IS a real tradeoff: release builds get meaningfully slower, and that includes
# the sign-and-notarize pipeline. Measured both ways in
# `docs/notes/index-extraction-baseline.md`.
#
# `[profile.bench]` inherits this, which is deliberate: the benches call the index
# across a crate boundary the same way the app does, so they have to be optimized
# the same way or their numbers describe a build nobody ships.
[profile.release]
lto = "thin"

# The Linux Docker E2E build (`apps/desktop/scripts/e2e-linux.sh`), and nothing else. It's
# `release` minus thin LTO, whose build cost (+35% on a clean build, measured above) lands on
# the CI job that gates every land, where it buys nothing: that binary is a test target we
# never ship (we ship macOS). `debug-assertions` and `overflow-checks` stay pinned to release's
# values, so the app under test behaves the way a release build does. #557.
[profile.e2e]
inherits = "release"
lto = false
debug-assertions = false
overflow-checks = false

# Debug builds carry line tables instead of full DWARF. Panics, `backtrace`, and every log line still
# resolve to file and line; what's gone is inspecting variables in a debugger, which isn't how we work.
#
# This is not a size-for-speed trade, it's both: a from-scratch build of `cmdr_lib` plus its 648 deps
# went 11 GB -> 7.5 GB and 193s -> 125s (measured on rustc 1.97.1, macOS 15, four counterbalanced
# clean builds, 2026-08-10). Full DWARF dominates the `.rcgu.o` files that make up most of `target/`.
#
# `[profile.test]` inherits this; `[profile.bench]` inherits `release` and is untouched, so benchmark
# numbers are unaffected. Release builds keep full debug info, so shipped crash reports still symbolicate.
[profile.dev]
debug = "line-tables-only"

# The regex engines, optimized even in debug and test builds. `redact` matches Unicode word
# boundaries over lines that carry its non-ASCII span markers, so `regex` falls back from the lazy
# DFA to the PikeVM, which unoptimized runs ~20 ms per 1 KB line. That made the redact property
# tests the CI macOS lane's slowest (6–8 s, starved past the 8 s cap twice in three runs, each
# costing a contention re-run). These are leaf deps, so the cost is one slower compile that
# rust-cache keeps; release is untouched.
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3

# The same for the hash under `cocoon`'s key derivation (PBKDF2-SHA256, 100,000 rounds per open).
# Unoptimized, each open or save of the Linux encrypted secrets file costs about a second, which made
# `secrets::encrypted_file`'s tests the CI macOS lane's new tail (up to 7.9 s against the 8 s cap).
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
# The generic PBKDF2-over-HMAC is monomorphized in `cocoon`, so it needs the flag too.
[profile.dev.package.cocoon]
opt-level = 3

# The house lint set, in ONE place. A member opts in with `lints.workspace = true`
# rather than repeating a `#![deny(…)]` block at its crate root, so a new crate
# can't quietly become a lint-free zone and the set can't drift between crates.
#
# Cargo passes these as rustc flags, so they cover every target of an opted-in
# package (lib, bins, tests, benches, build script), not just the lib. A crate-root
# or item-level `#[allow(…, reason = "…")]` still wins where a member genuinely
# needs an exception.
#
# One lint deliberately stays OUT of this table and lives at each crate root
# instead: `unused_crate_dependencies`. It's judged per compilation unit, so as a
# package-wide flag every bin, integration test, and bench reports ~100 "unused
# extern crate" errors for deps only the lib uses. It belongs on the lib target
# alone, which only a `#![warn(…)]` in `lib.rs` can express.
#
# Who opts in: `cmdr` and any crate under `crates/` that we wrote.
# `crates/fsevent-stream` does NOT: it's a vendored third-party fork, and the
# `unused_crate_dependencies` / `unwrap_used` churn would bury the upstream diff.
# `crates/index-query` and `crates/operation-log-dump` do NOT: they're CLIs whose
# job is to print to stdout, which `print_stdout` / `print_stderr` deny by design.
[workspace.lints.rust]
# Dead code caught early (the Rust counterpart of knip for TypeScript). It's a
# lint GROUP containing the two below, so it takes a lower priority; Cargo ignores
# table order and would otherwise reject the ambiguity.
unused = { level = "deny", priority = -1 }
# Redundant path prefixes (`std::path::Path` where `Path` is already imported).
unused_qualifications = "warn"

[workspace.lints.clippy]
# Use the `log::*` macros, so error-report bundles capture the context.
# See `apps/desktop/src-tauri/src/logging/CLAUDE.md`.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# No leftover stubs reaching a build (`unreachable!()` stays allowed).
todo = "deny"
unimplemented = "deny"
# Every `#[allow]` states why.
allow_attributes_without_reason = "warn"
# Every `unsafe {}` block carries a `// SAFETY:` comment naming the invariant that
# makes it sound. Rote FFI is documented per site, never blanket-exempted.
undocumented_unsafe_blocks = "warn"
# No silent `.unwrap()` in production: each is a handled error or a documented
# `.expect("why")`. `#[test]` fns are exempt via `clippy.toml`.
unwrap_used = "warn"
# A std/parking_lot guard alive across an `.await` parks a lock on a task the runtime
# may not poll again for a long time, or ever. The whole app can hang on it, and the
# symptom (one subsystem stops, the rest looks fine) reads as anything but a lock.
# The tree is clean today, so this only has to stay clean.
await_holding_lock = "deny"
