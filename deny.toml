# cargo-deny configuration
# See https://embarkstudios.github.io/cargo-deny/

# Only the targets we ship. Tauri drags in the whole GTK3 stack for Linux, which
# carries ~11 permanently-unmaintained advisories and, at times, real CVEs in crates
# no macOS build ever links (`quick-xml` via `wayland-scanner`, for two). Vetting them
# buried the findings that do reach users. Add a triple here the moment we ship one.
[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
version = 2
# Only flag unmaintained crates we could actually act on: a direct workspace
# dependency. The transitive ones (`paste`, the `unic-*` family via tauri's codegen)
# are Tauri's to replace, and denying them means a red check nobody can fix.
# Vulnerabilities are NOT scoped this way: every RUSTSEC vuln in the macOS graph,
# transitive or not, still fails this check.
unmaintained = "workspace"
ignore = [
  # `async-std` is discontinued and reaches us as a dev-dependency of our vendored
  # `cmdr-fsevent-stream` fork, where it backs the `async-std` feature and the crate's
  # own tests (`crates/fsevent-stream/src/tests.rs`). Test-only, never in a shipped
  # binary. Drop this entry if the fork moves those tests to tokio.
  "RUSTSEC-2025-0052",
  # The Marvin attack: `rsa`'s private-key operations aren't constant-time, so an
  # observer who can time them may eventually recover the key. No patched version
  # exists, so the only lever is whether we compile RSA at all.
  #
  # It reaches us through `russh` -> `ssh-key`, both of which gate RSA behind
  # russh's default-on `rsa` feature. Turning that feature off drops the crate
  # entirely, at the cost of two things users will notice: Cmdr could no longer
  # verify a server that presents an `ssh-rsa` host key (old NAS firmware still
  # does), and it could no longer sign in with an `id_rsa` key file, which is
  # still the most common key people have.
  #
  # What is actually exposed, which is narrower than the advisory's headline:
  #
  #   - Verifying a server's host key is a PUBLIC-key operation, and this
  #     advisory is about private-key timing, so supporting an `ssh-rsa` host key
  #     carries ZERO exposure. That half of the cost buys us nothing back.
  #   - An agent-held RSA key is signed by ssh-agent, not by this crate, and the
  #     password and keyboard-interactive rungs involve no RSA at all.
  #     Unaffected.
  #   - The ONE exposed path is a user with an RSA private key FILE, which we
  #     sign with in-process: one signature per connect attempt, over a
  #     transcript the server only partly controls, against a key the user could
  #     rotate to ed25519. Marvin is a chosen-ciphertext DECRYPTION oracle;
  #     recovering a key from signatures is a harder shape needing far more
  #     samples, and each sample here costs a full handshake.
  #
  # The escape hatch, so nobody re-derives it: russh's manifest is
  # `default = ["flate2", "aws-lc-rs", "rsa"]` with
  # `rsa = ["dep:rsa", "dep:pkcs1", "ssh-key/rsa"]`, and NEITHER `aws-lc-rs` nor
  # `ring` supplies RSA (they're the symmetric and EC backends), so there's no
  # feature flip that keeps RSA and drops this crate (verified against the
  # russh 0.62.7 registry source, 2026-08-23). The real fix routes RSA
  # PRIVATE-key ops through `aws-lc-rs` (already in our graph, AWS-LC/BoringSSL
  # derived and side-channel-hardened) while `rsa` keeps parsing and
  # verification. That needs a russh fork or an upstream PR, and we are
  # deliberately NOT doing it now.
  #
  # ⚠️ This is a judgment call rather than a settled one: it trades a narrow
  # timing exposure against silently refusing servers and keys that work
  # everywhere else.
  #
  # When to re-check (verified 2026-08-23): the advisory's `patched` list is
  # still empty in `rustsec/advisory-db`, the issue it points at,
  # `RustCrypto/RSA#626` (padding isn't constant-time), is open, and so is the
  # `rsa` 0.10 release those fixes ride on, `RustCrypto/RSA#647`, where the
  # maintainer said on 2026-07-13 that it still needs significant work. We
  # already build `rsa 0.10.0-rc.18`, so being on the 0.10 line is NOT the fix.
  # Watch those two issues, and drop this entry the day a patched version exists.
  "RUSTSEC-2023-0071",
]

[licenses]
version = 2
# Shrink-wrap for the allow list: an allowed license no longer used by any
# dependency fails the check, so the list can't accumulate stale entries.
unused-allowed-license = "deny"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  "LicenseRef-BSL-1.1", # Our own crate (Business Source License 1.1)
  "BSL-1.0", # For clipboard-win (transitive dependency of tauri-plugin-clipboard-manager)
  "bzip2-1.0.6", # For libbz2-rs-sys (bzip2 codec for archive browsing); permissive BSD-style
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = true # cmdr is private (BSL)

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git sources today: `smb2` and `mtp-rs` both resolve from crates.io. cargo-deny
# reports an `allow-git` entry nothing matches as `unmatched-source`, so this list
# stays empty until a git dependency actually lands.
allow-git = []
