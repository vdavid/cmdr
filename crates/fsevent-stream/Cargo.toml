[package]
name = "cmdr-fsevent-stream"
version = "0.3.0"
authors = ["LightQuantum <self@lightquantum.me>", "David Veszelovszki <david@veszelovszki.com>"]
edition = "2021"
description = "Stream-based macOS FSEvents bindings for Cmdr, forked from `fsevent-stream` and maintained in the Cmdr monorepo."
license = "MIT"
keywords = ["filesystem", "events", "watch", "notify", "macos"]
repository = "https://github.com/vdavid/cmdr"
homepage = "https://github.com/vdavid/cmdr/tree/main/crates/fsevent-stream"
# No `publish = false`: cargo-about's `[private] ignore` would then drop the crate,
# and with it the upstream MIT credit `THIRD-PARTY-NOTICES.md` must keep.

# This crate compiles on Apple targets only: `ffi.rs` declares
# `#[link(name = "CoreServices", kind = "framework")]`, which is an E0455 compile
# error anywhere else. `cmdr` depends on it under a `cfg(target_os = "macos")`
# target section, so a dependency graph never reaches it off macOS — but a
# `cargo --workspace` SELECTION does, and the target gate no longer applies there.
# The check runner reads this key to drop the crate from non-macOS lanes
# (`scripts/check/checks/cargo-workspace.go`).
[package.metadata.cmdr]
# Our code now (upstream is dead), held to the workspace lints. `vendored` still
# keeps the house source scanners (poison handling, no fixed sleeps in tests, …)
# off it until it's brought up to them; then this becomes the default `app`.
# The check runner reads this key.
kind = "vendored"
platforms = ["macos"]

# The house lint set lives in the workspace root's `[workspace.lints]`, so this
# crate can't quietly become a lint-free zone. `unused_crate_dependencies` is the
# one lint that stays at the crate root instead (it's judged per compilation unit).
[lints]
workspace = true

# Tokio only: every Cmdr consumer runs on it, and upstream's alternative
# `async-std` arm (discontinued, RUSTSEC-2025-0052) was mutually exclusive with
# it, so `--all-features` couldn't even build the crate.
[dependencies]
bitflags = "2.6"
core-foundation = "0.10"
futures-core = "0.3"
futures-util = "0.3"
log = "0.4"
tokio = { version = "1.14", features = ["sync"] }
tokio-stream = "0.1"

[dev-dependencies]
libc = "0.2"
tempfile = "3.12"
tokio = { version = "1.14", features = ["rt-multi-thread", "sync", "macros", "time"] }
