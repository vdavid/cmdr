[package]
name = "index-query"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"
publish = false

[dependencies]
# `tooling` is what makes the importance corpus and measurement entry points
# visible here; see `importance::tooling` for why it is a feature and not
# `#[cfg(test)]`.
cmdr-index = { path = "../cmdr-index", features = ["tooling"] }
rusqlite = { version = "0.40", features = ["bundled", "collation"] }

[package.metadata.cmdr]
# A standalone developer CLI, not code linked into the Cmdr app process. That's
# what exempts it from the rules written for the app: stdout IS its output (so it
# opts out of the workspace `print_stdout` deny), and its own SQLite connection is
# the first in its own process (so the shared-page-cache factory has nothing to
# protect here). The check runner reads this key.
kind = "tool"
