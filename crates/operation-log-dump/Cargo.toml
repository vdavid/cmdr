[package]
name = "operation-log-dump"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"
publish = false

[dependencies]
# The operation log's own read functions, so the dump decodes exactly what the
# app reads. The log is a crate of its own, so this tool builds without the app.
cmdr-operation-log = { path = "../cmdr-operation-log" }
rusqlite = { version = "0.41", features = ["bundled"] }

[package.metadata.cmdr]
# A standalone developer CLI, not code linked into the Cmdr app process. Same
# exemption as `index-query`: stdout IS its output, and its own SQLite connection
# is the first in its own process, so the shared-page-cache factory has nothing to
# protect here. The check runner reads this key.
kind = "tool"
# Not on Windows yet; see `docs/tooling/ci.md` § Windows lane.
platforms = ["linux", "macos"]
