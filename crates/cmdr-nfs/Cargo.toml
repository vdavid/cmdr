[package]
name = "cmdr-nfs"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"
publish = false

[package.metadata.cmdr]
# Not on Windows yet; see `docs/tooling/ci.md` § Windows lane.
platforms = ["linux", "macos"]

# The house lint set lives in the workspace root's `[workspace.lints]`, so this
# crate can't quietly become a lint-free zone. `unused_crate_dependencies` is the
# one lint that stays at the crate root instead (it's judged per compilation unit).
[lints]
workspace = true

# Every dependency below is already in `Cargo.lock`, at the version and with the
# features pinned here, so the crate adds no package and no second configuration
# of one. Keep it that way: `cargo tree -d` before and after any change here.
[features]
# "This is a test build." Widens `volume::testing` (the Docker fixture
# connection) from `#[cfg(test)]`-only to `pub`, so the app's NFS suites share
# one set of fixtures with this crate's own. Forwards `cmdr-fs/testing`.
#
# Never enable in a production build.
testing = ["cmdr-fs/testing"]
# Lets `CMDR_NFS_PORTMAP_PORT` move where `NfsServer::new` asks the portmapper,
# so the app's E2E build reaches the Docker fixture's relocated `rpcbind`
# (`params.rs`). Never enable in a production build; the app's `playwright-e2e`
# forwards to it.
playwright-e2e = []
# Exposes `fuzzing`, the entry point the `nfs_reply` target in `fuzz/` (repo
# root) drives: every reply decoder over one record. Never enable in a
# production build.
fuzzing = []

[dependencies]
# The `Volume` trait, every type it exchanges, the id funnel and app-path
# spelling, and the host seams this backend asks the app through.
cmdr-fs = { path = "../cmdr-fs" }
# `CancellationToken`, on the connect and discovery paths. Default features off,
# the shape `cmdr-fs` pins.
tokio-util = { version = "0.7.18", default-features = false }
# The wire: XDR decodes slice the received record (`Bytes`), so a READ payload
# reaches the caller with no copy, and every length is checked against what's
# left of the record before anything is sliced or allocated.
bytes = "1"
# The transport: `net` for the TCP connection (`TcpSocket` binds the reserved
# source port before connecting), `io-util` for the record reads, `sync` for the
# pending-call map's oneshots, `time` for the per-call budgets and the stuck-call
# timer, `macros` for `select!`, `rt` to spawn the reader and writer tasks.
# Deliberately NOT `rt-multi-thread`: the runtime is the app's.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# `buffered`, which pipelines the per-entry LOOKUPs a listing needs.
futures-util = "0.3"
log = "0.4"
# `gethostname`, for the machine name `AUTH_SYS` carries.
libc = "0.2"

[dev-dependencies]
# Depending on ourselves turns `fuzzing` on for every DEV target and leaves it
# off for the lib, so clippy lints the seam and a shipped build carries none.
cmdr-nfs = { path = ".", features = ["fuzzing"] }
# `simulate_loss`, `set_silence_timings`, and the recording event sink.
cmdr-fs = { path = "../cmdr-fs", features = ["testing"] }
# `start_paused` clocks for the transport's timing cells (the stuck-call resend,
# the silence ladder), so a 60 s rule costs no wall time; `rt-multi-thread` for
# the loopback and fixture cells.
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
