# Clippy reads the FIRST `clippy.toml` it finds walking up from this package's
# manifest directory, and never merges, so this file replaces the workspace root's
# for `cmdr-viewer`. It carries the root's general settings below; the root's
# `disallowed-methods` / `disallowed-types` name `tauri`, `objc2_app_kit`, and
# `reqwest`, none of which this crate can reach (`index-crate-isolation`), so they
# have nothing to guard here.

# Complexity threshold of 15 matches ESLint's complexity rule for consistency across Rust and TypeScript
cognitive-complexity-threshold = 15

# Tests legitimately `.unwrap()` everywhere; this exempts unwraps inside `#[test]` fns. Helper fns in
# `#[cfg(test)] mod`s aren't covered, so those use the sanctioned `.expect("…")` form.
allow-unwrap-in-tests = true

# Every background job starts in `worker.rs`, and every async volume call goes through `bridge.rs` on
# the runtime the `Viewer` was handed: a viewer job runs on a plain thread with no ambient runtime, and a
# browser host has no threads at all. The clock goes through `cmdr_fs::rt`: `std`'s panics on
# `wasm32-unknown-unknown`. `worker.rs` and `bridge.rs` lift the bans they implement; tests drive the
# viewer from threads of their own (`lib.rs` lifts them under `cfg(test)`).
# ❗ METHOD bans, not `disallowed-types`: natively `rt::Instant` and `rt::Runtime` ARE `std::time::Instant`
# and `tokio::runtime::Handle`, so a type ban would fire on the seam itself.
disallowed-methods = [
  { path = "std::thread::spawn", reason = "start a viewer job through `worker::spawn` / `worker::after`: a browser host has no threads" },
  { path = "tokio::spawn", reason = "hand a future off through `bridge::spawn_detached` on the viewer's runtime: a worker thread has no ambient one" },
  { path = "tokio::task::spawn", reason = "hand a future off through `bridge::spawn_detached` on the viewer's runtime: a worker thread has no ambient one" },
  { path = "tokio::task::spawn_blocking", reason = "a viewer job runs on its own thread (`worker.rs`), never the runtime's blocking pool" },
  { path = "tokio::runtime::Handle::current", reason = "use the viewer's runtime (`Viewer::runtime`): a worker thread has no ambient one" },
  { path = "tokio::runtime::Handle::try_current", reason = "use the viewer's runtime (`Viewer::runtime`): a worker thread has no ambient one" },
  { path = "std::time::Instant::now", reason = "read the clock through `cmdr_fs::rt::now()`: `std`'s panics in the browser build" },
  { path = "std::time::Instant::elapsed", reason = "use `cmdr_fs::rt::since(start)`: `std`'s clock panics in the browser build" },
  { path = "std::time::SystemTime::now", reason = "`std`'s wall clock panics in the browser build; add a `cmdr_fs::rt` wrapper if the viewer needs one" },
  { path = "tokio::time::sleep", reason = "the viewer sleeps through `worker::after`: tokio's timer panics in the browser build" },
]
