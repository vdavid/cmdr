[package]
name = "cmdr-media-meta"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"
publish = false

[package.metadata.cmdr]
# Not on Windows yet; see `docs/tooling/ci.md` § Windows lane.
platforms = ["linux", "macos"]

# The house lint set lives in the workspace root's `[workspace.lints]`, so this
# crate can't quietly become a lint-free zone. `unused_crate_dependencies` is the
# one lint that stays at the crate root instead (it's judged per compilation unit).
[lints]
workspace = true

[features]
# "This is a test build." Consumers turn it on through a dev-dependency, which keeps
# it off in every shipped build. It publishes `test_fixtures`, so the app's tests
# write real photos, songs, and movies the same way this crate's tests do.
testing = []

[dependencies]
# The `Volume` the byte source reads through (`read_range`), its errors, and the
# `Deadline` a file's read runs under. The only crate below this one.
cmdr-fs = { path = "../cmdr-fs" }
# `MediaFacts::taken` is a local wall-clock `NaiveDateTime`, as the mask's other
# dates are.
chrono = "0.4"
# EXIF from JPEG, TIFF, HEIF, PNG, WebP, and TIFF-based RAW. Declared under its lib
# name `exif` (the package is `kamadak-exif`), the same version the app pins.
exif = { package = "kamadak-exif", version = "0.6.1" }
# Media tags (ID3, MP4 `ilst`, Vorbis comments, APE, RIFF/AIFF chunks), pure Rust,
# MIT OR Apache-2.0. Default features; `flate2` (compressed ID3 frames) is already in
# the graph.
lofty = "0.25.5"
log = "0.4"
# `MediaField` crosses IPC inside the app's statuses. Pinned to the EXACT version
# `cmdr-fs` and the app use: two `specta` crates in one graph would make these
# `Type` impls stop satisfying `tauri-specta`.
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.24", features = ["derive"] }
# `Handle::block_on` for the byte source's bridge from a blocking thread to the
# async `Volume::read_range`.
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
# `InMemoryVolume` and `WedgedVolume` (`testing`) for the byte source's tests.
cmdr-fs = { path = "../cmdr-fs", features = ["testing"] }
# The wire names the frontend keys messages off.
serde_json = "1"
# `#[tokio::test]`, on a multi-threaded runtime: the byte source blocks on it from
# `spawn_blocking`.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
