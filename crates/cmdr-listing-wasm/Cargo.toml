[package]
name = "cmdr-listing-wasm"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"
publish = false

# The house lint set lives in the workspace root's `[workspace.lints]`, so this
# crate can't quietly become a lint-free zone. `unused_crate_dependencies` is the
# one lint that stays at the crate root instead (it's judged per compilation unit).
[lints]
workspace = true

[lib]
# `cdylib` is the `.wasm` the website loads; `rlib` lets the native tests link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The real listing engine, and the vocabulary its answers are made of. No app
# crate: this is the engine's second host, beside `apps/desktop/src-tauri/src/listing_host/`.
cmdr-listing = { path = "../cmdr-listing" }
cmdr-fs = { path = "../cmdr-fs" }
# Brief mode's column widths and the font metrics the page measures for them,
# the same code the desktop's commands run.
cmdr-brief-columns = { path = "../cmdr-brief-columns" }
# The menu bar as data, its enabled fold, and what a click asks for: the demo
# draws the same macOS bar the desktop builds (`src/menu.rs`).
cmdr-menu = { path = "../cmdr-menu" }
# The write engine and its journal, on the same volume the listing engine reads
# (`src/operations_host/`), sorting names with the panes' collator.
cmdr-operations = { path = "../cmdr-operations" }
cmdr-operation-log = { path = "../cmdr-operation-log" }
cmdr-collation = { path = "../cmdr-collation" }
# The operation log's read connection type (`commands/history.rs`), the version
# `cmdr-operation-log` links.
rusqlite = { version = "0.41", features = ["bundled", "collation", "fallible_uint"] }
# The file viewer's core, over the same volume, answering the viewer's commands.
cmdr-viewer = { path = "../cmdr-viewer" }
# The drive search's core, over the same volume, answering ⌘F (`src/search.rs`), and the
# recents-list rules its session list of recent searches follows.
cmdr-search = { path = "../cmdr-search" }
cmdr-recents = { path = "../cmdr-recents" }
log = "0.4"
# The wire shapes: every answer and event crosses as the same JSON Tauri sends.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
# The JS API (`src/bindings.rs`) and its `Promise`s.
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
# `JSON.parse` / `JSON.stringify` at the boundary, and the event callback's `Function`.
js-sys = "0.3.103"

[dev-dependencies]
# The golden-trace scenarios the native engine blesses, replayed on the demo's
# host (`src/operations_host/golden_test.rs`), natively and as a wasm test build.
cmdr-operations = { path = "../cmdr-operations", features = ["golden"] }

# Native-only: the wasm test build compiles just the golden replay, and these
# (threaded runtimes, `tempfile`, `tokio/net`) don't build for wasm32.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# The listing engine's fixtures (`TestEngine`, `TestListing`) for the backend-listings cells.
cmdr-listing = { path = "../cmdr-listing", features = ["testing"] }
# `wait_until_async`, the write cells' one way to wait on an event, and
# `wait_until`, for the viewer tests' native search thread.
cmdr-fs = { path = "../cmdr-fs", features = ["testing"] }
# The shim's tests run natively, on a real runtime, against the same engine.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
# The golden replay's wasm tests, run under Node by `wasm-bindgen-test-runner`
# (the `wasm-bindgen-cli` the build script installs to match `Cargo.lock`).
# Pinned to the release that pairs with the locked `wasm-bindgen` 0.2.126.
wasm-bindgen-test = "=0.3.76"
