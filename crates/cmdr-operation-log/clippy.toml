# Clippy reads the FIRST `clippy.toml` it finds walking up from this package's
# manifest directory, and never merges, so this file replaces the workspace root's
# for `cmdr-operation-log`. It carries the root's general settings below; the root's
# `disallowed-methods` / `disallowed-types` name `tauri`, `objc2_app_kit`, and
# `reqwest`, none of which this crate can reach (`index-crate-isolation`), so they
# have nothing to guard here.

# Complexity threshold of 15 matches ESLint's complexity rule for consistency across Rust and TypeScript
cognitive-complexity-threshold = 15

# Tests legitimately `.unwrap()` everywhere; this exempts unwraps inside `#[test]` fns. Helper fns in
# `#[cfg(test)] mod`s aren't covered, so those use the sanctioned `.expect("…")` form.
allow-unwrap-in-tests = true

# An ambient spawn runs on whichever runtime the calling thread happens to have; the log spawns
# only on the handle its host passes in (retention's `Handle`, the injected rollback spawn), so the
# one pool everything shares is the host's decision. The writer is a dedicated, NAMED
# `std::thread::Builder` thread, which stays fine.
#
# `cmdr-operations` also bans `libc::sync`; this crate has no `libc` dependency, so it can't call
# it, and a path that doesn't resolve has nothing to guard.
disallowed-methods = [
  { path = "tokio::spawn", reason = "spawn on the handle the host passed in, never whichever runtime is ambient" },
  { path = "tokio::task::spawn", reason = "spawn on the handle the host passed in, never whichever runtime is ambient" },
  { path = "tokio::task::spawn_blocking", reason = "use the blocking pool of the handle the host passed in, never whichever runtime is ambient" },
  { path = "std::thread::spawn", reason = "a thread the log owns is a NAMED `std::thread::Builder` one" },
  # The clock and the timers go through `cmdr_fs::rt` (`crate::rt` here): `std`'s clock panics on
  # `wasm32-unknown-unknown`, which takes tokio's timer with it, and this crate runs in the browser
  # demo. Same list as `crates/cmdr-listing/clippy.toml`. ❗ METHOD bans, not `disallowed-types`:
  # natively `rt::Instant` IS `std::time::Instant`, so a type ban would fire on the seam itself.
  { path = "std::time::Instant::now", reason = "read the clock through `crate::rt::now()`: `std`'s panics in the browser build" },
  { path = "std::time::Instant::elapsed", reason = "use `crate::rt::since(start)`: `std`'s clock panics in the browser build" },
  { path = "std::time::SystemTime::now", reason = "use `crate::rt::wall_now()`: `std`'s wall clock panics in the browser build" },
  { path = "tokio::time::Instant::now", reason = "read tokio's clock through `crate::rt::time::now()`: it panics in the browser build" },
  { path = "tokio::time::Instant::elapsed", reason = "use `crate::rt::time::now() - start`: tokio's clock panics in the browser build" },
  { path = "tokio::time::sleep", reason = "sleep through `crate::rt::time::sleep`: tokio's timer panics in the browser build" },
  { path = "tokio::time::sleep_until", reason = "sleep through `crate::rt::time::sleep_until`: tokio's timer panics in the browser build" },
  { path = "tokio::time::timeout", reason = "time out through `crate::rt::time::timeout`: tokio's timer panics in the browser build" },
  { path = "tokio::time::timeout_at", reason = "time out through `crate::rt::time::timeout_at`: tokio's timer panics in the browser build" },
  { path = "tokio::time::interval", reason = "tick with `crate::rt::time::interval_delayed`: tokio's timer panics in the browser build" },
  { path = "tokio::task::yield_now", reason = "yield through `crate::rt::task::yield_now`: tokio's never reaches the page's event loop" },
]
