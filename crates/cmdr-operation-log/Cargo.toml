[package]
name = "cmdr-operation-log"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"
publish = false

# The house lint set lives in the workspace root's `[workspace.lints]`, so this
# crate can't quietly become a lint-free zone. `unused_crate_dependencies` is the
# one lint that stays at the crate root instead (it's judged per compilation unit).
[lints]
workspace = true

[features]
# "This is a test build." Consumers turn it on through a dev-dependency, which
# keeps it off in every shipped build. It widens what a host's tests reach from
# `#[cfg(test)]` to `pub`: putting a journal straight into the slot
# (`OperationLog::set_journal`), resetting the recording gate, and reading the
# writer behind a `WriterJournal`. `cfg(test)` can't: it's set only while a
# crate compiles its OWN test target.
testing = ["cmdr-fs/testing"]

[dependencies]
# The `Volume` trait the rollback planner reads and acts through, `FileEntry`,
# and the host primitives: poison-free locking and the SQLite connection factory
# that installs the process-wide page cache before the first open.
cmdr-fs = { path = "../cmdr-fs" }
log = "0.4"
# The journal's store. The features match every other copy in the workspace
# (`bundled` most of all), so the graph links one SQLite.
rusqlite = { version = "0.41", features = ["bundled", "collation", "fallible_uint"] }
# The read API's rows and the typed tokens derive the IPC wire form; the host
# decides what crosses to a UI.
serde = { version = "1", features = ["derive"] }
# Type export for the Rust↔TS bindings. Pinned to the EXACT same version the app
# uses: two `specta` crates in one graph would make these `Type` impls stop
# satisfying `tauri-specta`, and the app's command signatures collect them
# transitively.
specta = { version = "=2.0.0-rc.24", features = ["derive"] }
# `fold_name`: the NFC half of the case-folded name column search matches on.
unicode-normalization = "0.1"
# Operation ids. UUIDv7, never v4 (`new_operation_id` says why).
uuid = { version = "1.29.1", features = ["v7"] }

[dev-dependencies]
# Depending on ourselves turns the `testing` feature on for every DEV target and
# leaves it off for the lib, so a shipped build carries none of it.
cmdr-operation-log = { path = ".", features = ["testing"] }
# `sqlite_util::open_in_memory`, which only a test build exposes.
cmdr-fs = { path = "../cmdr-fs", features = ["testing"] }
# Scratch directories for the store and writer cells' databases.
tempfile = "3"
# `hooks` (an empty feature, no extra crates) for `Connection::progress_handler`, which
# is how the item tree's structural gate COUNTS SQLite's VM steps per read
# (`src/tree/scale_tests.rs`). Dev-only, so no shipped build carries the hook machinery.
rusqlite = { version = "0.41", features = ["hooks"] }
