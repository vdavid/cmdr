[package]
name = "cmdr-sort"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"
publish = false

# The house lint set lives in the workspace root's `[workspace.lints]`, so this
# crate can't quietly become a lint-free zone. `unused_crate_dependencies` is the
# one lint that stays at the crate root instead (it's judged per compilation unit).
[lints]
workspace = true

[dependencies]
# The three enums are wire shapes: the persisted sort settings and every IPC
# command that names a sort carry them in the frontend's camelCase words.
serde = { version = "1", features = ["derive"] }
# Type export for the Rust↔TS bindings. Pinned to the EXACT version the app uses:
# two `specta` crates in one graph would make these `Type` impls stop satisfying
# `tauri-specta`.
specta = { version = "=2.0.0-rc.24", features = ["derive"] }

[dev-dependencies]
# The wire-word tests read each variant's serialized form.
serde_json = "1"
