[package]
name = "cmdr-fs"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"
publish = false

# The house lint set lives in the workspace root's `[workspace.lints]`, so this
# crate can't quietly become a lint-free zone. `unused_crate_dependencies` is the
# one lint that stays at the crate root instead (it's judged per compilation unit).
[lints]
workspace = true

[features]
# The `Volume::inject_error` E2E hook (and `InMemoryVolume`'s implementation of
# it), which lets a Playwright spec make the next `list_directory` fail with a
# chosen errno. The app's feature of the same name turns this one on; never
# enable it in a production build.
playwright-e2e = []
# "This is a test build." Consumers turn it on through a dev-dependency, which
# keeps it off in every shipped build. Three effects:
#
# 1. Widens the test helpers (`TestDir`, `wait_until` / `wait_until_async`) from
#    `#[cfg(test)]`-only to `pub`, so OTHER crates' tests can get a scratch
#    directory and wait on a condition instead of sleeping.
# 2. Makes `thread_qos::set_current_thread_qos` a no-op, matching what `cfg(test)`
#    used to do while this code lived in the app. `cfg(test)` is NOT set when a
#    consumer compiles us as a dependency, so without this the real Utility QoS
#    would start applying inside every consumer's parallel test run.
# 3. Adds the recording and scripted fakes for the `volume::host` seams, so a
#    backend crate's tests can assert on what their backend told its host.
# 4. Pulls in `tempfile`, which only `TestDir` needs.
testing = ["dep:tempfile"]

[dependencies]
# The digest half of every volume ID (`volume::ids`). Cryptographic on purpose:
# an ID is identity, and a volume name is user-controlled, so a *chosen*
# collision (name a USB stick so it steals another volume's index and saved
# paths) has to be out of reach, which a fast non-cryptographic hash wouldn't
# manage. Same version the app pins.
blake3 = "1.8.3"
serde = { version = "1", features = ["derive"] }
# Type export for the Rust↔TS bindings. Pinned to the EXACT same version the app
# uses: two `specta` crates in one graph would make these `Type` impls stop
# satisfying `tauri-specta`, and the app's command signatures collect them
# transitively.
specta = { version = "=2.0.0-rc.24", features = ["derive"] }
log = "0.4"
# The process-wide SQLite page-cache slab and the connection factories that
# install it (`sqlite_util`). Every store in the app — the three index DBs plus
# the agent's and the operation log's — shares that one slab, so the helpers have
# to live in the crate all of them already depend on. `bundled` so the linked
# SQLite is ours, `collation` for the index store's `name_folded` collation, and
# `fallible_uint` for the app-side stores; the feature set has to be a superset of
# every consumer's or Cargo unification silently drops one.
rusqlite = { version = "0.40", features = ["bundled", "collation", "fallible_uint"] }
# Standard-location resolution for the special-system-folder icon classifier.
dirs = "6"
# uid/gid → name resolution for `FileEntry`'s owner and group columns.
uzers = "0.12.2"
# Reading the private File Provider domain-id extended attribute (`file_provider`),
# the marker that tells a cloud provider's tree from an ordinary folder.
xattr = "1"
# The unique suffix every staged scratch name ends in (`staging`). A caller can
# also supply one, so the type is part of the mint API rather than an internal
# detail: a safe-overwrite gives its temp and its aside the same UUID.
uuid = { version = "1.19.0", features = ["v4"] }
# `rt` for the runtime seam: `volume::host` hands backends a `tokio::runtime::Handle`
# the app injects, because a backend's watcher threads have no ambient runtime to
# inherit and `tokio::spawn` panics there. `rt-multi-thread` builds the fallback that
# keeps benches, tools, and tests working with a detached host. `time` is
# `wait_until_async`'s: it polls on tokio's clock, so a `start_paused` runtime
# auto-advances through the wait instead of burning wall-clock. `sync` is
# `ChannelReadStream`'s: the bounded chunk channel every network backend's read
# path is built on.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
# `testing` only: `TestDir` wraps a `tempfile::TempDir` and hands it back to its
# caller. ❌ Don't "clean this up" into a dev-dependency: a dev-dependency isn't
# linkable when ANOTHER crate compiles this one as a library, so `TestDir` would
# stop existing for every consumer's tests. The dev-dependency below is a
# separate thing, covering this crate's OWN tests, where the feature is off. Same
# shape, and the same reason, as `cmdr-index`'s optional `tempfile`.
tempfile = { version = "3", optional = true }
# `CancellationToken`, the ONE cancellation primitive every layer speaks. The
# `Volume` trait's cancel-aware methods take it, so it has to live here rather
# than in either consumer. `default-features = false` keeps it to `tokio_util::sync`,
# which is all any layer uses.
tokio-util = { version = "0.7.18", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Mach `task_info`, the malloc-zone walk, and `pthread_set_qos_class_self_np`.
# macOS-only on purpose: every `libc::` call in this crate is behind
# `#[cfg(target_os = "macos")]`, so declaring it for all of unix would make it an
# unused crate dependency on Linux. `cfg-gate` watches this block.
libc = "0.2"
# The raw mimalloc FFI, for `mi_process_info` (how many bytes the app's allocator
# has committed). mimalloc is not a registered macOS malloc zone, so
# `malloc_zone_statistics` can't see the Rust heap at all; `process_memory.rs`
# explains it. macOS-only because `query_mimalloc_heap` is the sole caller and is
# itself macOS-gated.
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }

[dev-dependencies]
serde_json = "1"
# `sqlite_util`'s tests open real on-disk databases: the page-cache budget and the
# freelist reclamation only mean anything against a file-backed connection.
tempfile = "3"
# `#[tokio::test]` needs the `macros` feature, which the lib build has no use for.
tokio = { version = "1", features = ["macros"] }
