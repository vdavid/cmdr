[package]
name = "cmdr-fs"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"
publish = false

# The house lint set lives in the workspace root's `[workspace.lints]`, so this
# crate can't quietly become a lint-free zone. `unused_crate_dependencies` is the
# one lint that stays at the crate root instead (it's judged per compilation unit).
[lints]
workspace = true

[features]
# The `Volume::inject_error` E2E hook (and `InMemoryVolume`'s implementation of
# it), which lets a Playwright spec make the next `list_directory` fail with a
# chosen errno. The app's feature of the same name turns this one on; never
# enable it in a production build.
playwright-e2e = []
# "This is a test build." Consumers turn it on through a dev-dependency, which
# keeps it off in every shipped build. Two effects:
#
# 1. Widens the test-wait helpers (`wait_until` / `wait_until_async`) from
#    `#[cfg(test)]`-only to `pub`, so OTHER crates' tests can wait on a condition
#    instead of sleeping.
# 2. Makes `thread_qos::set_current_thread_qos` a no-op, matching what `cfg(test)`
#    used to do while this code lived in the app. `cfg(test)` is NOT set when a
#    consumer compiles us as a dependency, so without this the real Utility QoS
#    would start applying inside every consumer's parallel test run.
testing = ["dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# Type export for the Rust↔TS bindings. Pinned to the EXACT same version the app
# uses: two `specta` crates in one graph would make these `Type` impls stop
# satisfying `tauri-specta`, and the app's command signatures collect them
# transitively.
specta = { version = "=2.0.0-rc.24", features = ["derive"] }
log = "0.4"
# Standard-location resolution for the special-system-folder icon classifier.
dirs = "6"
# uid/gid → name resolution for `FileEntry`'s owner and group columns.
uzers = "0.12.2"
# `testing` only: `wait_until_async` polls on tokio's clock, so a `start_paused`
# runtime auto-advances through the wait instead of burning wall-clock.
tokio = { version = "1", features = ["time"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Mach `task_info`, the malloc-zone walk, and `pthread_set_qos_class_self_np`.
# macOS-only on purpose: every `libc::` call in this crate is behind
# `#[cfg(target_os = "macos")]`, so declaring it for all of unix would make it an
# unused crate dependency on Linux. `cfg-gate` watches this block.
libc = "0.2"
# The raw mimalloc FFI, for `mi_process_info` (how many bytes the app's allocator
# has committed). mimalloc is not a registered macOS malloc zone, so
# `malloc_zone_statistics` can't see the Rust heap at all; `process_memory.rs`
# explains it. macOS-only because `query_mimalloc_heap` is the sole caller and is
# itself macOS-gated.
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }

[dev-dependencies]
serde_json = "1"
# This crate's own tests exercise `testing` under plain `cfg(test)`, where the
# optional dependency above isn't switched on.
tokio = { version = "1", features = ["rt", "macros", "time"] }
