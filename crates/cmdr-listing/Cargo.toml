[package]
name = "cmdr-listing"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"
publish = false

# The house lint set lives in the workspace root's `[workspace.lints]`, so this
# crate can't quietly become a lint-free zone. `unused_crate_dependencies` is the
# one lint that stays at the crate root instead (it's judged per compilation unit).
[lints]
workspace = true

[features]
# "This is a test build." Consumers turn it on through a dev-dependency, which
# keeps it off in every shipped build. It widens the engine's test scaffolding
# (`cmdr_listing::testing`: an engine of a test's own, one fake per seam, listings
# put straight into a cache) from `#[cfg(test)]` to `pub`, so the host's tests can
# drive the engine the way this crate's own tests do. `cfg(test)` can't: it's set
# only while a crate compiles its OWN test target.
testing = ["cmdr-fs/testing"]
# `Listings::flush_pending_diffs`, which the host's E2E bridge calls so a test
# sees a pane's diff without waiting out the 50 ms coalescing window. Never
# enable in a production build; the app's `playwright-e2e` forwards to it.
playwright-e2e = []

[dependencies]
# The filesystem vocabulary every listing is made of: `FileEntry`, the `Volume`
# trait a read goes through, `DirectoryChange`, the typed error classification,
# the scratch-name rules, and the host primitives (poison-free locking, the
# benchmark log, the fallback runtime).
cmdr-fs = { path = "../cmdr-fs" }
log = "0.4"
# The wire shapes the host serializes (sort settings, diff batches, pane
# answers). The engine only derives; the host decides what crosses to a UI.
serde = { version = "1", features = ["derive"] }
# Type export for the Rust↔TS bindings. Pinned to the EXACT same version the app
# uses: two `specta` crates in one graph would make these `Type` impls stop
# satisfying `tauri-specta`, and the app's command signatures collect them
# transitively.
specta = { version = "=2.0.0-rc.24", features = ["derive"] }
# `rt` for the injected `Handle` every spawn goes to (never `rt-multi-thread`:
# the engine builds no runtime, it's handed one), `sync` for the read gates and
# the stall notifier, `time` for the 50 ms diff flush, the stall clock, and the
# orphan reaper's tick, `macros` for the `select!` a stalled read waits in.
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
# `CancellationToken`: cancel detaches a read without aborting it. Same version
# and feature shape as `cmdr-fs`'s, so no second copy enters the graph.
tokio-util = { version = "0.7.18", default-features = false }
# How file names rank (`NameCollator`, re-exported at the root so a host sorts
# the way a listing does). Its own crate, so code that only orders names (the
# write engine's tree order) needn't depend on the listing engine.
cmdr-collation = { path = "../cmdr-collation" }
# The stall watch polls every read of a volume at once (`FuturesUnordered`).
futures-util = "0.3"
# Fuzzy matcher for the in-directory "type to jump" feature (`fuzzy_jump.rs`).
# Helix's matcher, also used by Zellij and several TUI projects: fast
# (microseconds per match), smart-case, good scoring. MPL-2.0, already in the
# `deny.toml` allowlist.
nucleo-matcher = "0.3.1"

[dev-dependencies]
# Depending on ourselves turns the `testing` feature on for every DEV target and
# leaves it off for the lib, so a shipped build carries no fakes.
cmdr-listing = { path = ".", features = ["testing"] }
# `TestDir`, `wait_until`, `wait_until_async`, and `InMemoryVolume`.
cmdr-fs = { path = "../cmdr-fs", features = ["testing"] }
# `#[tokio::test]` with a multi-threaded flavor, and `start_paused` clocks.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
# Unique volume and listing ids for the tests that share a real registry slot.
uuid = { version = "1.29.0", features = ["v4"] }
# The stall probe's symlink cells need a real directory to resolve through.
tempfile = "3"
# The `errno`s a stalled network read fails with (`ENOTCONN`, `ETIMEDOUT`).
libc = "0.2"
