# Clippy reads the FIRST `clippy.toml` it finds walking up from this package's
# manifest directory, and never merges, so this file replaces the workspace root's
# for `cmdr-listing`. It carries the root's general settings below; the root's
# `disallowed-methods` / `disallowed-types` name `tauri`, `objc2_app_kit`, and
# `reqwest`, none of which this crate can reach (`index-crate-isolation`), so they
# have nothing to guard here.

# Complexity threshold of 15 matches ESLint's complexity rule for consistency across Rust and TypeScript
cognitive-complexity-threshold = 15

# Tests legitimately `.unwrap()` everywhere; this exempts unwraps inside `#[test]` fns. Helper fns in
# `#[cfg(test)] mod`s aren't covered, so those use the sanctioned `.expect("…")` form.
allow-unwrap-in-tests = true

# Every spawn goes through the engine's injected runtime (`Inner::runtime`). An ambient spawn INHERITS
# whatever runtime the calling thread has, and a watcher's OS thread has none, so it panics there; on a
# thread that has one, it quietly lands the engine's work on a pool the host never handed over. Tests
# drive the engine from threads and tasks of their own, so `lib.rs` lifts this under `cfg(test)`.
disallowed-methods = [
  { path = "tokio::spawn", reason = "spawn on the engine's runtime (`self.runtime.spawn`): a watcher's OS thread has no ambient one" },
  { path = "tokio::task::spawn", reason = "spawn on the engine's runtime (`self.runtime.spawn`): a watcher's OS thread has no ambient one" },
  { path = "tokio::task::spawn_blocking", reason = "use the engine's runtime (`self.runtime.spawn_blocking`): a watcher's OS thread has no ambient one" },
  { path = "std::thread::spawn", reason = "the engine owns no threads; blocking work goes to the runtime's blocking pool" },
  # The clock and the timers go through `cmdr_fs::rt` (named `crate::rt` here): `std`'s clock panics
  # on `wasm32-unknown-unknown`, which takes tokio's timer with it, so a direct call compiles for the
  # browser build and traps only at runtime. `crates/cmdr-listing/DETAILS.md` § "The browser build".
  # ❗ These are METHOD bans, not `disallowed-types`: natively `rt::Instant` and `rt::Runtime` ARE
  # `std::time::Instant` and `tokio::runtime::Handle` (re-exports resolve to the same type), so a type
  # ban would fire on every use of the seam itself. Banning every way to READ the clock or reach an
  # ambient runtime is what closes the hole.
  { path = "std::time::Instant::now", reason = "read the clock through `crate::rt::now()`: `std`'s panics in the browser build" },
  { path = "std::time::Instant::elapsed", reason = "use `crate::rt::since(start)`: `std`'s clock panics in the browser build" },
  { path = "std::time::SystemTime::now", reason = "`std`'s wall clock panics in the browser build; add a `crate::rt` wrapper if the engine needs one" },
  { path = "tokio::time::Instant::now", reason = "read tokio's clock through `crate::rt::time::now()`: it panics in the browser build" },
  { path = "tokio::time::Instant::elapsed", reason = "use `crate::rt::time::now() - start`: tokio's clock panics in the browser build" },
  { path = "tokio::time::sleep", reason = "sleep through `crate::rt::time::sleep`: tokio's timer panics in the browser build" },
  { path = "tokio::time::sleep_until", reason = "sleep through `crate::rt::time::sleep_until`: tokio's timer panics in the browser build" },
  { path = "tokio::time::timeout", reason = "time out through `crate::rt::time::timeout`: tokio's timer panics in the browser build" },
  { path = "tokio::time::interval", reason = "tick with a `crate::rt::time::sleep` loop: tokio's timer panics in the browser build" },
  { path = "tokio::runtime::Handle::current", reason = "spawn on the engine's runtime (`self.runtime`): an ambient one may not exist" },
  { path = "tokio::runtime::Handle::try_current", reason = "spawn on the engine's runtime (`self.runtime`): an ambient one may not exist" },
]
