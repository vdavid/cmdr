services:
  listmonk-db:
    image: postgres:18-alpine
    container_name: listmonk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: listmonk
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD}
    volumes:
      # Postgres 18 images put PGDATA in a major-version subdirectory
      # (`/var/lib/postgresql/18/docker`), so the mount sits one level up at
      # `/var/lib/postgresql`. Mounting the old `/var/lib/postgresql/data` path makes the
      # container refuse to start. The volume is new on purpose: the Postgres 17 volume
      # stays untouched as the rollback. See README.md, "Upgrading Postgres".
      - listmonk-data-pg18:/var/lib/postgresql
    networks:
      - listmonk-internal

  listmonk:
    build: .
    container_name: listmonk
    restart: unless-stopped
    depends_on:
      - listmonk-db
    command: >
      sh -c "./listmonk --static-dir=/listmonk/custom-static --install --idempotent --yes --config '' && ./listmonk
      --static-dir=/listmonk/custom-static --upgrade --yes --config '' && ./listmonk
      --static-dir=/listmonk/custom-static --config ''"
    environment:
      TZ: Europe/Stockholm
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: 5432
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_app__address: 0.0.0.0:9000
    networks:
      - listmonk-internal
      - proxy-net

volumes:
  # The Postgres 17 volume (`listmonk_listmonk-data`) is deliberately not declared here any
  # more. It still holds the pre-upgrade cluster and is the rollback path, so leave it on the
  # box until the upgrade has proven itself.
  listmonk-data-pg18:

networks:
  listmonk-internal:
  proxy-net:
    external: true
