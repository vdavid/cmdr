packages:
  - apps/*
  # The ESLint rules shared across apps. A package (not a loose folder) so it can carry the
  # `eslint` devDependency its RuleTester unit tests import.
  - eslint-plugins

# ── Supply-chain defences (pnpm 11+) ────────────────────────────────────────
# Project-side belt-and-suspenders so anyone cloning Cmdr gets the same
# install-side guarantees even without the matching keys in their `~/.npmrc`.
# Read alongside `AGENTS.md` § Dependencies — Renovate already
# enforces a 3-day cooldown at PR-open time; this is the install-side
# guardrail for anything that bypasses Renovate (manual `pnpm add`, a fresh
# clone, a contributor without our Renovate config).

# Block installs of versions published less than 3 days ago. pnpm 11 ships
# with a 1440 min (1 day) default; we tighten it. Value is minutes (4320 = 3
# days). Use `minimumReleaseAgeExclude` to bypass per-package for hot-fix CVE
# patches.
minimumReleaseAge: 4320

# Refuse to install a package whose trust level has dropped since the last
# successful resolve (publisher loses verified status, package transferred to
# an unknown owner). Default is `off`. The win is mitigation against the
# publisher-takeover class.
#
# pnpm 11 re-verifies the WHOLE lockfile against this policy on every install
# (so `pnpm check` and CI hit it too, not just `pnpm add`). A `--trust-policy-exclude`
# CLI flag is scoped to one command and never persists, so it can't keep `pnpm
# check` green for a flagged transitive dep — the exclusion has to live here.
# `trustPolicyExclude` (below) is therefore the home for vetted, version-pinned
# approvals; we keep them explicit per version rather than blanket-trusting old
# publish dates via `trustPolicyIgnoreAfter`, so a genuine takeover of an
# untouched version still trips.
#
# To approve a new downgrade: vet it on npmjs.com (same maintainer + repo, the
# flagged version merely lacks a provenance attestation from npm's uneven
# rollout rather than showing a real ownership transfer), then add the exact
# `name@version` to `trustPolicyExclude`.
trustPolicy: no-downgrade

# Vetted trust downgrades: mainstream deps whose old versions predate npm's
# provenance rollout (canonical maintainer + repo confirmed), not takeovers.
# Pinned to exact versions so a future republish of the same string re-trips.
#   chokidar@4.0.3  → paulmillr/chokidar (via svelte-check)
#   semver@5.7.2, semver@6.3.1 → npm/node-semver (old major lines, transitive)
#   chromium-bidi@157.0.8090-0 → GoogleChromeLabs/chromium-bidi, whose source moved into the
#     Chromium tree (`third_party/chromium-bidi`); Google's `chrome-devtools-npm` account, a
#     listed maintainer, now publishes it from there without GitHub provenance. Pinned exactly by
#     puppeteer-core 25.16.0 under Lighthouse CI (website devDependency). Vetted 2026-11-11.
trustPolicyExclude:
  - chokidar@4.0.3
  - chromium-bidi@157.0.8090-0
  - semver@5.7.2
  - semver@6.3.1

# Explicit even though pnpm 11 defaults to true: only direct dependencies may
# use exotic sources (git repos, tarball URLs). A compromised tree can't pull
# anything unaudited via a nested git+https://…
blockExoticSubdeps: true

# Pin transitive deps to fix CVEs in older indirect ranges.
overrides:
  serialize-javascript: '>=7.0.3'
  lodash: '>=4.17.23'
  # cookie <0.7.0 accepts out-of-bounds characters in name/value
  # (GHSA-pxg6-pf52-xh8x). Scoped to the vulnerable range so every parent keeps
  # its own major: SvelteKit 3 needs cookie 2's renamed API, while astro and
  # express still ask for the older lines.
  cookie@<0.7.0: ^0.7.0
  tmp: '>=0.2.4'
  # Dependabot fixes for transitive deps whose parents still request the vulnerable
  # version. All are dev/build-time only (lint, test, Lighthouse CI, wrangler,
  # Astro's static build); none reach a shipped bundle. Each key is scoped to one
  # major (`name@N`) so a parent that later moves to the next major isn't dragged
  # back. Drop an entry once `pnpm why <name>` shows every parent past the fix.
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  compression@1: ^1.8.2
  fast-uri@3: ^3.1.9
  # `@astrojs/rss` asks for `^5.5.7`, which still allows the quadratic stop-node scan
  # (GHSA-474x-hrwr-fgx4). It parses only our own feed XML at build time.
  fast-xml-parser@5: ^5.12.0
  # `satori` pins `fflate` to exactly 0.7.3, even in its latest release.
  fflate@0.7: ^0.8.0
  http-cache-semantics@4: ^4.3.0
  ip-address@10: ^10.7.4
  postcss-selector-parser@7: ^7.1.6
  proxy-addr@2: ^2.0.8
  qs@6: ^6.16.1
  # `miniflare` (under `wrangler` and `@cloudflare/vitest-plugin`) pins these exactly.
  sharp@0.35: ^0.35.4
  undici@7: ^7.30.1
  undici@8: ^8.12.2
  # `astro`, `@astrojs/*`, `knip`, `chromium-bidi`, and `@cloudflare/vitest-plugin`
  # ask for zod 4 with ranges still allowing 4.6.5 (GHSA-mrhx-c7xc-m3w5).
  zod@4: ^4.6.6
  smol-toml@1: ^1.9.0
  source-map-js@1: ^1.2.2
  # Cross-major, only under `@lhci/cli` (Lighthouse CI) via `get-uri`, whose latest
  # release still asks for `basic-ftp` 5. 6's only break is refusing a separate FTP
  # transfer host, and lhci never fetches over FTP.
  # At least 6.2.4: earlier 6.x crash on a hostile listing or a CR/LF in a password
  # (GHSA-5pm8-86m8-9m6r, GHSA-r4jh-29pc-gfqr).
  basic-ftp@5: ^6.2.4

# pnpm 11 requires explicit per-package build-script approval. The legacy
# `pnpm.onlyBuiltDependencies` field in package.json is ignored.
allowBuilds:
  esbuild: false
  sharp: true
  workerd: true

# Peer ranges that lag a major we've verified. Drop an entry once its package
# publishes a range that covers the version (then `pnpm peers check` stays clean
# without it).
peerDependencyRules:
  allowedVersions:
    # 3.0.0 asks for `stylelint ^17`, but it only calls `createPlugin` and the
    # rule utils that 18 keeps; its rule still reports on 18 (checked
    # 2026-11-10 by linting a probe `.svelte` file with `width` under
    # `display: inline`).
    stylelint-declaration-block-no-ignored-properties>stylelint: '18'
    # 3.2.6 (under puppeteer-core under Lighthouse CI) asks for the optional peer
    # `proxy-agent >=8.0.1`, but `@lhci/cli` 0.16.0 brings 6.5.0. Only its
    # browser-download path (`lib/httpUtil.js`) imports it, and lhci launches the
    # installed Chrome through chrome-launcher, so it never downloads one
    # (checked 2026-11-11 by grepping the installed package).
    '@puppeteer/browsers>proxy-agent': '6'
minimumReleaseAgeExclude:
  # Renovate security update: hono@4.13.16
  - hono@4.13.16
  # Renovate security update: astro@7.4.7
  - astro@7.4.7
