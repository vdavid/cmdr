# cargo-nextest configuration
# See https://nexte.st/docs/configuration/ for full documentation
#
# Default test timeout policy
# ---------------------------
# Every Rust test must complete in ≤ 8 s, matching the Playwright E2E suite's
# default. Anything slower is a bug: a real-time-dependent test, an unguarded
# network/IPC call, or an environment race. The cap is intentionally tight so a
# hung test fails the suite in seconds instead of blocking CI for the legacy
# 120 s nextest default. Background:
#
#   2026-05-19/20: `accent_color_linux::tests::read_accent_color_returns_valid_hex`
#   hit nextest's prior 120 s cap because `zbus::blocking::Connection::session()`
#   had no timeout and the GitHub Actions runner had a half-configured D-Bus
#   (orphan socket, no daemon). Cost: 4 days of red main CI before anyone
#   noticed. Fix combined a 500 ms probe timeout in the production code with
#   this tightened nextest cap so the suite shouts immediately next time.
#
# Exceptions
# ----------
# To grant a higher cap, add a `[[profile.default.overrides]]` block matching
# the specific test(s) by name and explain WHY in a comment alongside it. The
# bar is high: the test must exercise something that can't be made faster
# without losing coverage (a real network call, a build artifact materialisation,
# etc.). "It just takes that long" is not a reason — refactor the test instead.
#
# ❗ Every `test(x)` below is a SUBSTRING match on a test's FULL path, so a filter
# spelling a module path stops matching the moment that module moves — and nextest
# says nothing. Its tests silently fall back to the 8 s cap and full parallelism,
# and the symptom is a flake weeks later that reads like host contention. Three
# refactors detached seven filters that way in five weeks. `nextest-filter-coverage`
# now fails on a filter that selects nothing, so RENAMING a test module means
# running `pnpm check nextest-filters`, not hoping. Prefer a bare test name over a
# module path where one is unique: it survives the move.

[test-groups]
# NOTE: there is deliberately no `virtual-mtp` group. Virtual-MTP tests used to
# need one because `setup_virtual_mtp_device()` wiped a single shared backing-dir
# root, so concurrent tests deleted each other's fixtures. Each call now gets its
# own temp root, and nextest forks a process per test, so nothing is shared —
# they run fully parallel. (Under plain `cargo test`, where one process runs them
# all, they still share the virtual device's serial; `virtual_device_test_lock()`
# in `mtp::virtual_device` serializes that.) Don't reintroduce a group here to
# fix a virtual-MTP flake: find the shared resource instead.
# Tests that block on REAL OS file-watcher delivery (FSEvents). Running several
# at once multiplies live watches and event storms, and under a saturated suite
# (which grew with the archive milestones' real zip I/O) delivery starvation
# beats a single delivery attempt. Serializing them removes the
# self-interference; the 20 s cap (plus, for the tests that still block on one
# delivery, retries) covers load from the rest of the suite. See the two
# overrides below for which tests self-heal in-test and which lean on retries.
#
# ❌ Membership is "blocks on a delivery", NOT "touches a watcher". A test that
# merely ARMS a watch and then asserts on lifecycle has no event to starve on, so
# putting it here only serializes something fast; give it a cap-only override
# instead (see the arming-only block below).
real-notify = { max-threads = 1 }
# Real disk-image tests (macOS-only, `#[ignore]`d — run via `--run-ignored`): the
# FAT32/exFAT fixtures (`indexing::tests::external_drive_fixture`), and the APFS/HFS+
# harness (`cmdr_fs::testing::disk_images`) with the pins built on it. Each attaches a
# real disk image via hdiutil, and the FAT live-FSEvents probes block on real event
# delivery. Serialize them: concurrent attach/detach churn on the same FSKit service is
# exactly the surface the FAT-unmount panic incident warns about, and multiplying live
# watches starves delivery. Across runs (two worktrees), the harness's machine-wide lock
# does the same job. See the overrides below for the timeout headroom. The APFS/HFS+
# ones run in `pnpm check disk-images`, whose filter (`desktop-rust-disk-images.go`)
# must name the same paths as their overrides; the FAT/exFAT ones stay hand-run.
disk-image = { max-threads = 1 }
# SMB streaming STRESS tests hammer the SHARED Docker Samba stack with heavy
# concurrent I/O (hundreds of MB). Running them at once — or alongside each other
# — self-contends on the one server. Serialize them.
smb-stress = { max-threads = 1 }
# The SFTP window measurements. They share one bench server over one `netem`-shaped
# link, so two of them at once measure each other rather than the window: running the
# ratio cell alongside the depth curve read 4.3x where the same cell alone reads 6.2x
# (measured 2026-08-22). Serializing them is what makes a number reproducible.
sftp-bench = { max-threads = 1 }
# The tests that call REAL Vision. macOS loads Apple's OCR, classifier, and
# feature-print models on first use and keeps them in a system-wide daemon, so
# exactly one call per machine pays for it and every later one is instant
# (measured on macOS 27.0, 2026-09-19: 33.8 s for the first, then 0.61 s for all
# nine vision tests in one warm process). Run in parallel they each race that one
# load and ALL of them blow their cap together, which is what a cold `pnpm check`
# looked like. Serialized, one test pays and the rest are free.
vision-model = { max-threads = 1 }
# Every S3 fixture cell (the app crate's `s3_integration_` ones and `cmdr-s3`'s own).
# They all talk to the one shared VersityGW + Garage stack, many move tens of MiB
# (a 140 MiB multipart upload, a 1,005-object rename, a 70 MiB upload copied and
# moved), and each lands in 1–5 s alone. Ninety-odd of them at full parallelism on a
# loaded machine all hit the 8 s cap together (measured 2026-10-02, load average 9:
# every one killed; at four at a time, every one green). Four at a time keeps the
# stack busy without starving it; the 30 s cap below is the hang backstop.
s3-fixture = { max-threads = 4 }

[[profile.default.overrides]]
# Disk-image fixtures: hdiutil create+attach+detach plus, for the FSEvents
# probes, a 15 s internal wait for real live delivery — all past the global 8 s
# cap. 30 s matches the harness runner's per-call SIGKILL deadline, so a
# genuinely wedged FSKit service is killed by the runner first and the cap
# stays a backstop. Serialized via the `disk-image` group above.
# allowed-unmatched-nextest-filter: macos-only, hdiutil and FSKit `msdos` have no Linux counterpart
filter = 'test(indexing::tests::external_drive_fixture::)'
test-group = 'disk-image'
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.default.overrides]]
# The APFS/HFS+ disk-image harness's own real-image tests (`cmdr_fs::testing::disk_images`,
# macOS-only, `#[ignore]`d — run via `--run-ignored`). Serialized in the `disk-image`
# group; ACROSS runs (two worktrees), the harness's session lock keeps them apart. 30 s
# matches the harness's per-call SIGKILL deadline, so a wedged tool is killed by the
# runner first and the cap stays a backstop.
# allowed-unmatched-nextest-filter: macos-only, hdiutil and diskutil have no Linux counterpart
filter = 'test(testing::disk_images::real_images::)'
test-group = 'disk-image'
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.default.overrides]]
# The eject pins on real APFS/HFS+ images (`file_system::volume::eject::real_image`,
# macOS-only, `#[ignore]`d): same group, same cap, same reason as the harness tests
# above. A held-file refusal runs the production retries, about 3 s plus the daemon's
# holder scan per attempt, inside the cap.
# allowed-unmatched-nextest-filter: macos-only, hdiutil and diskutil have no Linux counterpart
filter = 'test(file_system::volume::eject::real_image::)'
test-group = 'disk-image'
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.default.overrides]]
# The index's vanish pin on a real HFS+ image (`indexing::tests::vanish_tests`,
# macOS-only, `#[ignore]`d): a real `IndexManager` walks a tree on the image, the
# walker's test-only park point holds it between directories, and the test
# force-detaches the image there. Same group, same cap, same reason as the harness
# tests above.
# allowed-unmatched-nextest-filter: macos-only, hdiutil and diskutil have no Linux counterpart
filter = 'test(indexing::tests::vanish_tests::)'
test-group = 'disk-image'
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.default.overrides]]
# The index presence pins on real APFS/HFS+ images (`file_system::index_provider::real_image`,
# macOS-only, `#[ignore]`d): a rename keeps a filesystem's identity mounted, and a detach
# takes it out of the mount table. Serialized in the `disk-image` group, with the same
# 30 s cap as the harness tests above.
# allowed-unmatched-nextest-filter: macos-only, hdiutil and diskutil have no Linux counterpart
filter = 'test(file_system::index_provider::real_image::)'
test-group = 'disk-image'
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.default.overrides]]
# The transfer pins on a real HFS+ image (`file_system::write_operations::transfer::real_image`,
# macOS-only, `#[ignore]`d): a real local copy and move run on their own thread, park mid-file at
# the chunk seam, and the image is `detach -force`d under them. Same group and cap as the harness
# tests above: the park itself is bounded at 30 s by `chunk_park::PARK_CAP`, and the runner SIGKILLs
# any single `hdiutil` call at 30 s, so a wedged tool is caught there and this cap is the backstop.
# allowed-unmatched-nextest-filter: macos-only, hdiutil and diskutil have no Linux counterpart
filter = 'test(file_system::write_operations::transfer::real_image::)'
test-group = 'disk-image'
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.default.overrides]]
# The unmount approver's pins on real APFS/HFS+ images (`volumes::unmount_approver::real_image`,
# macOS-only, `#[ignore]`d): a real DiskArbitration approval session answers real `diskutil`
# unmounts of the test's own image.
#
# 90 s rather than the 30 s the other image blocks get, because these spend real time on purpose
# rather than on one tool call: building the two-partition image costs a `partitionDisk` plus two
# remounts, one test lets an injected stop overrun the chain's whole 7 s budget, and every resume
# waits out `RESUME_SETTLE`. The runner still SIGKILLs any single `hdiutil`/`diskutil` call at 30 s,
# so a wedged tool is caught there and this cap stays the backstop for the test as a whole.
# (Measured 2026-09-16 on macOS 27.0: 2.5-27.3 s per test, the two-partition ones slowest.)
# allowed-unmatched-nextest-filter: macos-only, DiskArbitration and diskutil have no Linux counterpart
filter = 'test(volumes::unmount_approver::real_image::)'
test-group = 'disk-image'
slow-timeout = { period = "90s", terminate-after = 1 }

[[profile.default.overrides]]
# The rename handler's pins on real APFS/HFS+ images (`volumes::rename_real_image`, macOS-only,
# `#[ignore]`d): a real `diskutil rename` moves the mount point, and the handler keeps the volume's
# id at the new root. Same group and 30 s cap as the harness tests above.
# allowed-unmatched-nextest-filter: macos-only, hdiutil and diskutil have no Linux counterpart
filter = 'test(volumes::rename_real_image::)'
test-group = 'disk-image'
slow-timeout = { period = "30s", terminate-after = 1 }

# SMB stress tests serialize on the shared server (see `smb-stress` group above).
# The concurrent-streaming one additionally wraps its copy in a 120 s internal
# `tokio::time::timeout` whose expiry dumps the last 30 `client-mutex:`/`recv:`
# lines — its deadlock diagnostic. The general 30 s `smb_integration_` cap below
# would SIGKILL the process before that fires, AND under heavy host/container
# contention (parallel integration runs sharing the one Docker Samba stack) a
# HEALTHY run can legitimately exceed 30 s. Give it 130 s so its own 120 s
# deadline stays authoritative (the diagnostic fires, nextest stays a backstop).
# This override precedes the general one so it wins slow-timeout for this test
# (nextest: the first matching override per setting wins).
[[profile.default.overrides]]
filter = 'test(smb_integration_concurrent_streaming_writes_no_deadlock)'
test-group = 'smb-stress'
slow-timeout = { period = "130s", terminate-after = 1 }

[[profile.default.overrides]]
# Serialize the other heavy SMB stress test against the concurrent-streaming one
# (shared server); its own runtime fits the general 30 s cap, so no override there.
filter = 'test(smb_integration_copy_100_unique_files_no_cross_contamination)'
test-group = 'smb-stress'

[[profile.default.overrides]]
# The two disconnect-storm stress tests run ~20 rounds × 2 volumes of FULL index-DB
# lifecycles (SQLite open, freshness churn, writer drain, delete) in one test. Idle
# macOS runtime is ~0.15 s, but on the Docker Linux lane during a saturated
# full-suite run (both e2e lanes + a workspace build on the host, measured
# 2026-07-24 at host load ~150) the ~40 real DB open/drain/delete cycles starved
# past the global 8 s cap. 20 s keeps the wedge-detection teeth (a genuinely
# wedged registry/writer still fails, in 20 s instead of 8) without flaking on
# container I/O starvation.
filter = 'test(indexing::lifecycle::state::tests::disconnect_storm_two_volumes_never_wedges_the_registry) + test(indexing::tests::stress_tests_lifecycle::disconnect_storm_writer_drain_holds_across_volumes)'
slow-timeout = { period = "20s", terminate-after = 1 }

[[profile.default.overrides]]
# The two kick tests that wait on a REAL spawned enrichment pass (tauri runtime →
# blocking pool → SQLite → media writer thread → poll). Their in-test
# `PASS_LANDS_WITHIN` wait is 10 s (saturation headroom; see its doc — and
# `has_enriched_row`'s, for the probe bug that USED to make this wait unwinnable),
# and `kick_runs_…` prefixes it with a 1 s negative window — together past the
# global 8 s cap. 20 s keeps the in-test deadline authoritative (its panic names
# the exact wait) with the cap as a hang backstop. Keep this above
# `PASS_LANDS_WITHIN`.
filter = 'test(kick_tests::wire_volume_kicks_an_initial_pass_for_a_fresh_at_launch_volume) + test(kick_tests::kick_runs_a_pass_for_a_ready_volume_only_when_enabled)'
slow-timeout = { period = "20s", terminate-after = 1 }

[[profile.default.overrides]]
# The full-concurrency SMB copy (M4.4): the automated net under the 2026-07-31
# transfer wedge. It bounds its own copy at 45 s and, on expiry, prints the
# transfer probe's LIVE in-flight table — which task is parked in which phase,
# what the driver was doing — and that dump is the entire point of the test. The
# general 30 s `smb_integration_` cap below would SIGKILL the process before the
# in-test deadline fires, leaving exactly the "it just hung, no trace" outcome the
# milestone exists to end. 75 s keeps the 45 s deadline authoritative with room
# for the 400-file fixture and the per-file hash verification either side of it,
# and nextest stays the backstop. Don't read it as a runtime: measured 2026-08-02
# on an idle M3 Max the whole test is 3.5 s (the copy itself 0.43 s). This
# override precedes the general one so it wins slow-timeout (nextest: the first
# matching override per setting wins).
filter = 'test(smb_integration_many_files_at_full_concurrency_land_intact)'
slow-timeout = { period = "75s", terminate-after = 1 }

[[profile.default.overrides]]
# SMB integration tests (`#[ignore]`-gated, only run by the
# `desktop-rust-integration-tests` check, which boots a real Docker Samba stack).
# Each test pays the SMB session setup + auth + network round-trip cost; the
# happy paths land in 1–3 s, but pathological-case tests (timeouts, slow
# servers, big-listing pagination) intentionally probe slow behavior and need
# headroom. 30 s is generous enough for those without losing the "hung forever"
# safety net.
filter = 'test(smb_integration_)'
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.default.overrides]]
# The one `cmdr-smb` cell that blocks on the fixture Samba DELIVERING a change
# notification (CHANGE_NOTIFY) to the share watcher. It re-seeds a fresh file each
# second until one is heard, inside a 20 s budget; 30 s keeps that budget the
# authority and the cap a hang-catcher.
#
# Delivery is ~0.3 s on a quiet stack, but it rides Samba's `notifyd`, one process in
# the `guest` container (`cpus: 1.0`) that fans every write on `public` out to every
# recursive watch on it (one per connected test volume), logging each failed send to
# a closing one. With several worktrees' lanes on one stack it falls behind and keeps
# draining after they stop: caught 2026-10-06 pinned at a 0.5 cap at ~7,000 failed
# sends/s with no client connected, while this cell heard nothing for its whole old
# 6 s budget, even re-run alone. A fresh stack under three concurrent `cmdr-smb`
# suites still delivered within 1.3 s. No group: the load is the rest of the lane,
# not this cell.
#
# Why it degrades over a stack's life: a test process killed mid-run (a nextest
# timeout, a cancelled lane) leaks its watches in `notifyd` until something restarts
# it. Its dead-peer cleanup, `notifyd_send_delete`, addresses the delete to the dead
# process instead of itself, so it fails `NT_STATUS_OBJECT_NAME_NOT_FOUND` on every
# write (Samba 4.23.8; 4.17 sent it to itself via `messaging_send_iov_from`). A clean
# run leaks nothing. A lease that starts with no other holder restarts `notifyd`
# (`scripts/check/stacklease/soloreset.go`), so leaks no longer pile up ACROSS runs,
# but within a busy stretch of shared lanes nobody is ever alone: under load, timeouts
# kill tests, which leak, which slows delivery further. Measured
# 2026-10-06, four concurrent `cmdr-smb` suites on a probe container: 10–14.5 s at
# `cpus: 0.5` with ~110 leaked watches; 3.5–5.3 s at 1.0, then 11–13.7 s on the next
# round once that round's timeouts had leaked theirs. So 20 s stays.
filter = 'test(an_outside_change_in_an_accented_directory_names_the_path_the_pane_opened)'
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.default.overrides]]
# `cmdr-git`'s virtual-category tests, which build their fixtures by shelling out to
# real `git` (stash create, worktree add, submodule add — `test_fixtures::git_cli`,
# because gix exposes no public API for those three). Each test pays a handful of
# process spawns before it asserts anything, and spawning is the first thing to
# degrade once the suite saturates every core.
#
# The 8 s default is sized for an in-process test and leaves them no margin. Measured
# 2026-09-08 on an M3 Max, `cargo nextest run -p cmdr-git -E '<this filter>'` runs all
# 23 in 0.50 s wall-clock, the slowest single test being 0.50 s — yet a loaded
# full-suite run had 11 of them killed at the 8 s cap, and `profile.contention-probe`
# then cleared every one alone at that same cap. Starved, not slow. 30 s is ~60x the
# slowest real runtime: enough that only a genuine hang (a `git` blocking on a
# credential prompt, say) fails, which is what the `smb_integration_` block above buys
# for the same reason.
#
# ❗ Not a runtime. If these ever stop shelling out to `git`, delete this block rather
# than keep the headroom.
filter = 'package(cmdr-git) & (test(category_tests::) + test(column_meta_tests::))'
slow-timeout = { period = "30s", terminate-after = 1 }

# Real OS file-watcher delivery is inherently laggy AND lossy under load on
# macOS: FSEvents is documented as "~100 ms idle, seconds under load" (see
# `file_viewer/CLAUDE.md`). Under a saturated full-suite run (every core busy)
# two things go wrong that never happen in isolation: the mutation right after a
# just-registered watch is dropped outright (arming isn't finished), and even on
# a live watch a lone create/rename can be coalesced away. Both are unrecoverable
# by waiting — the event is gone. The tests below all block on real delivery and
# use a 15 s internal wait (recv fails cleanly BELOW the 20 s cap so a merely-slow
# event still arrives; the cap stays a hang-catcher). They split into two classes.

[[profile.default.overrides]]
# `entries_that_went_with_a_replaced_watch_root_leave_the_listing` waits 30 s for
# the watch to prove itself with a probe file, then 45 s for the replaced
# directory's contents to reach the listing. Under the global 8 s cap those waits
# were unreachable: nextest SIGKILLed the test long before either could fail with
# its own message, so the test could only ever pass when everything landed inside
# 8 s and otherwise died saying nothing. 90 s puts the cap above the in-test
# budget (30 + 45) so the waits stay authoritative — their panics name WHICH stage
# starved — with nextest as the hang backstop. Don't read it as a runtime:
# measured 0.9 s on an idle machine; it only elapses if the watcher stops
# delivering entirely.
# allowed-unmatched-nextest-filter: macos-only, the replaced-watch-root case is FSEvents-specific
filter = 'test(file_system::watcher_test::entries_that_went_with_a_replaced_watch_root_leave_the_listing)'
test-group = 'real-notify'
slow-timeout = { period = "90s", terminate-after = 1 }

[[profile.default.overrides]]
# The file-viewer SESSION tests that block on a real watcher (distinct from
# `file_viewer::watcher_test::` below, which was already covered). Membership is
# exactly "calls `wait_for_watcher_subscribed`" — that helper is what parks on a
# real subscribe, and its `GATE_TIMEOUT` is 30 s, so 40 s keeps the gate
# authoritative with the cap as a backstop.
#
# ❌ Deliberately NOT `test(file_viewer::session_test::)`: that module is ~69 tests
# and most of them just read files, so the prefix would serialize a pile of fast
# tests behind the group for no reason.
filter = '''
    test(file_viewer::session_test::test_session_close_stops_watcher)
  + test(file_viewer::session_test::test_session_tail_mode_off_does_not_extend_index)
  + test(file_viewer::session_test::test_session_emits_file_changed_on_append)
  + test(file_viewer::session_test::test_session_rotation_reopens_backend)
  + test(file_viewer::session_test::tail_mode_on_extends_backend_when_watcher_reports_grew)
'''
test-group = 'real-notify'
slow-timeout = { period = "40s", terminate-after = 1 }

[[profile.default.overrides]]
# The cold-drive tests that block on a REAL FSEvents delivery, so they run on the
# real journal (`ColdDrive::watched_for_real`); every other cold-drive test is on
# the fake one (`watch/watcher/fake_journal.rs`) and needs no override.
# `a_change_inside_a_walked_branch_...` proves `ensure_branch_watch` starts a
# watcher that actually delivers; the three `moves::` tests prove the index is live
# at a renamed drive's new mount point by a file landing through the watcher. All
# four are SELF-HEALING (`until_the_watcher_delivers` redoes the change on a fresh
# name, defeating the arming window and a dropped event), so no retries. 70 s puts
# the cap over the worst in-test budgets (20 s first index + 30 s restart catch-up
# + 15 s delivery, for the rename test) so their panics name the stage that starved.
filter = '''
    test(indexing::lifecycle::cover::cold_drive_tests::branches::a_change_inside_a_walked_branch)
  + test(a_drive_renamed_while_it_indexes_keeps_indexing_at_its_new_mount_point)
  + test(a_rename_inside_a_drain_window_moves_the_start_that_window_carries)
  + test(a_rename_while_a_scan_starts_restarts_the_drive_at_the_handback)
'''
test-group = 'real-notify'
slow-timeout = { period = "70s", terminate-after = 1 }

[[profile.default.overrides]]
# Tests that move a REAL file to the macOS Trash (`trashItemAtURL`). Not an `fseventsd` case:
# no watcher is involved. The call serializes on a shared OS path, so each takes ~0.2 s alone
# but ~1.2 s when the 29 trash-adjacent tests run together (3.1 s for all of them serially,
# 2026-10-08), and under a saturated full suite they timed out together at 8 s on four days
# (2026-08-13, 08-23, 09-07, 09-09; check-runner `test-log.csv`). There's nothing in-process to
# fake without dropping what they prove, the OS's own trash move, so they get headroom, not a group.
# allowed-unmatched-nextest-filter: macos-only, the real-Trash tests only compile on macOS
filter = '''
    test(test_move_to_trash_sync_)
  + test(trash_dir_for_path_matches_where_the_item_actually_landed)
  + test(failed_trash_item_records_no_search_leaves_but_a_sibling_keeps_its_own)
  + test(over_cap_trash_is_top_level_only_capped_but_still_rollbackable)
  + test(trashed_dir_records_search_leaves_and_stays_full)
  + test(commands::rename::tests::test_move_to_trash_success)
'''
slow-timeout = { period = "20s", terminate-after = 1 }

[[profile.default.overrides]]
# Tests that ARM a real OS watch (or real drive/disk I/O behind one) without
# blocking on a specific delivery: the reaper dropping a watcher with its listing,
# an LRU eviction releasing one, the coverage answer flipping with the watcher
# lifecycle. There's no event to
# wait for, so they need neither retries nor the group — ❌ don't add them to
# `real-notify`, which is for delivery-blocking tests and would serialize a pile of
# fast ones for nothing. What they DO need is headroom over the global 8 s cap,
# because arming and tearing down a real FSEvents stream (or standing up an index
# on a real tree) is itself slow on a saturated host.
#
# All of these timed out together on 2026-08-10 during a full run that overlapped a
# release benchmark in another worktree (host load ~30). Every one passed when the
# check runner re-ran it alone at the SAME deadline, which is the contention
# signature rather than a defect, and each takes well under a second when idle.
filter = '''
    test(file_system::listing::caching_reaper_test::)
  + test(file_system::listing::archive_watch_integration_test::)
  + test(file_system::volume::backends::local_posix_test::test_listing_watch_coverage_flips_with_watcher_lifecycle)
  + test(downloads::commands::tests::go_to_latest_)
  + test(downloads::runtime::tests::note_pending_write_for_cmdr_)
  + test(downloads::watcher_test::note_pending_write_never_resolves_the_path)
'''
slow-timeout = { period = "20s", terminate-after = 1 }

[[profile.default.overrides]]
# The git portal's ONE real-`.git/*` watcher cell. It arms a real `notify` debouncer on a
# repository's gitdir (one recursive watch), writes two bursts of five commits plus a
# branch switch, and blocks on each debounced delivery — so it is squarely the
# delivery-blocking class this group exists for. Measured on an M1 Max: 1.8 s idle with both
# bursts (2026-09-06), against the global 8 s cap. 20 s puts the cap above its own two 10 s
# settle waits' worst case so the assertion (which names the reports it got) decides, and the
# group keeps its live streams from multiplying the other watcher tests' starvation.
#
# ❗ It is one of only TWO cells that arm a real git watcher, and it has to stay that way:
# every other subscription cell takes `GitPortal::with_scripted_watcher` and runs in ~0.05 s.
# The second burst lives inside THIS cell for that reason; it proves the watch survives git's
# rename over `HEAD`, which is what broke on Linux and what no scripted backend can stand in
# for. `crates/cmdr-git/DETAILS.md` § "The watcher splits into bookkeeping and a backend".
#
# The other is `cmdr-git`'s `a_deleted_repository_stops_reporting_...`: what deleting a
# repository does to its OWN watch is the operating system's to answer, so a scripted
# backend could only assert the fake. It waits for quiet rather than a delivery, but arming
# the stream is itself a slow `fseventsd` round trip under load (it starved past 8 s on
# 2026-10-07), and the group keeps its stream from adding to the others' starvation.
filter = '''
    test(a_burst_reports_its_end_state_and_the_watch_survives_for_the_next_one)
  + test(a_deleted_repository_stops_reporting_and_still_gives_its_hold_back)
'''
test-group = 'real-notify'
slow-timeout = { period = "20s", terminate-after = 1 }

[[profile.default.overrides]]
# SELF-HEALING real-FSEvents tests — no retries. Each keeps producing the
# observable mutation until the watch delivers, so neither the just-registered
# arming window nor a lone coalesced/dropped event can starve it, all inside one
# 15 s budget (no second budget stacks). A real regression — the watcher stops
# emitting — therefore surfaces immediately here instead of being masked by a
# retry. Mechanisms:
#   - `downloads/watcher_test.rs` tests: `observe_mutation` redoes the real
#     create/rename on a fresh name until a matching emit; `prime_watch` proves
#     the watch live before the ring-order mutation;
#     `note_pending_write_suppresses_matching_event` redoes a
#     registered-write + unregistered-control pair until the control emits, then
#     asserts the registered sibling stayed silent (proves suppression against a
#     provably-live watch, no vacuous pass); `scan_latest_fallback_...` is
#     delivery-independent but opens a live watch, so it's grouped to not add to
#     the others' starvation.
#   - `cmdr-archive`'s `watch::host_seam_test` rewrite tests: `drive_until_refreshed`
#     redoes the zip rewrite (in place, or via temp+rename) until the watch reaches
#     the host's archive-refresh seam. ❌ These names are crate-relative and carry no
#     `archive::` prefix — a `test()` filter is a substring match on the test's own
#     name, so a stale prefix here matches NOTHING and silently drops the pair back to
#     the 8 s global cap, under their own 15 s budget.
# They still need this override: the redo/continuous loops can run ~11 s under
# saturation, past the global 8 s cap, and `real-notify` serialization keeps
# their live watches from multiplying each other's starvation. NOTE this group
# only serializes under `cargo nextest` (process-per-test); under plain
# `cargo test` the whole module shares one process, where a `WATCH_SERIAL` mutex
# in `downloads::watcher_test` does the equivalent. Proof: 10/10 saturated
# full-suite `cargo nextest run` loops green at `retries = 0`, and 10/10
# `cargo test --lib downloads::watcher_test` loops green (verified 2026-07 on a
# 16-core M-series; baseline before the in-test fix was ~2/3 runs failing).
filter = 'test(downloads::watcher_test::dropping_a_file_emits_one_event) + test(downloads::watcher_test::partial_rename_to_final_emits_for_final_path) + test(downloads::watcher_test::latest_download_returns_ring_value_after_event) + test(downloads::watcher_test::note_pending_write_suppresses_matching_event) + test(downloads::watcher_test::scan_latest_fallback_finds_file_with_no_events) + test(watch::host_seam_test::a_rewrite_asks_the_host_to_refresh_the_archive_listings) + test(watch::host_seam_test::a_temp_rename_swap_still_asks_for_a_refresh)'
test-group = 'real-notify'
slow-timeout = { period = "20s", terminate-after = 1 }

[[profile.default.overrides]]
# The vendored `cmdr-fsevent-stream` fork's own delivery test — SELF-HEALING, no retries.
# One `#[test]` runs FIVE real-FSEvents scenarios back to back (one per create-flag
# combination), and each pays a hard 200 ms create/delete separation (macOS Sequoia
# coalesces a faster pair into one event). A producer thread keeps redoing that pair on a
# fresh name until the watch delivers a matching file-level create AND removal, inside a
# per-scenario 8 s budget, so neither the just-armed-watch drop nor a coalesced lone pair
# can starve it. So the floor is structural, not slowness: 4.6–14.8 s over 8 runs on an
# M3 Max under concurrent load, 2026-08-08. The test's own shared budget is 25 s, so its
# assertion (which names the flags and dumps the events) fires before this cap does;
# 30 s covers the saturated case while keeping the hang backstop;
# `real-notify` stops its five live streams from multiplying the other watcher tests'
# starvation.
#
# Splitting it into five `#[test]`s would fit the global cap and is the cleaner test, but
# `crates/fsevent-stream/` is a vendored fork of a third-party crate where diff-vs-upstream
# is load-bearing (it's how a rebase onto upstream stays reviewable), so the structural
# divergence costs more than the override does.
# allowed-unmatched-nextest-filter: macos-only, `cmdr-fsevent-stream` builds on macOS alone
filter = 'package(cmdr-fsevent-stream) & test(tests::must_receive_fs_events)'
test-group = 'real-notify'
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.default.overrides]]
# File-viewer session watchers — same real-FSEvents class, but these still block
# on a SINGLE delivery (subscribe/start a watch, then rewrite/append/rename once
# and wait). They haven't been restructured to redo the mutation, so a starved or
# coalesced event is unrecoverable within the run. Grant retries: each retry
# re-runs the one test in a fresh process with a fresh watch, which reliably
# catches the event. Coverage isn't lost — the assertions are unchanged, only
# real-OS event timing is tolerated. If these ever get the `observe_mutation` /
# `drive_until_refreshed` redo treatment (see the self-healing override above),
# drop the retries. (The archive live-watch tests already made that move.)
# The retries are NOT free and NOT silent: `rust-tests` parses nextest's `FLAKY n/m`
# lines and downgrades a retry-rescued run from pass to WARN, naming each test and the
# attempt that rescued it. So the budget reads as a flake-rate meter, not a hiding
# place, and a rising rate here is visible without anyone re-measuring. Don't add
# retries anywhere without that reporting in place (see `docs/testing.md`).
filter = 'test(file_viewer::watcher_test::)'
test-group = 'real-notify'
slow-timeout = { period = "20s", terminate-after = 1 }
retries = 2

[[profile.default.overrides]]
# Every S3 fixture cell, the app crate's (`s3_integration_`) and `cmdr-s3`'s own
# (named `…_on_versitygw` / `…_on_garage`, plus the connection-drop and reconnect
# cells): queued four at a time on the `s3-fixture` group (see its note above),
# with the `smb_integration_` block's 30 s hang backstop. The slowest by design:
# the 140 MiB multipart copy onto a bucket (7.2 s alone on Garage under a load
# average of 10, 2026-10-01) and the 1,005-object rename. ❌ Don't read 30 s as a
# runtime, and ❌ don't raise the global cap for these: the queue is what keeps
# them under it. A new `cmdr-s3` fixture cell keeps the `_on_<fixture>` suffix.
filter = 'test(s3_integration_) | (package(cmdr-s3) & (test(_on_versitygw) | test(_on_garage) | test(connection_drop_test::) | test(reconnect_test::)))'
test-group = 's3-fixture'
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.default.overrides]]
# The sabre/dav cells (`crates/cmdr-webdav/src/volume/nextcloud_test.rs`), which
# `desktop-rust-webdav-nextcloud` runs against a real Nextcloud in Docker.
#
# Same contention signature as the arming-only block above: on 2026-09-02 they
# timed out together during a run that overlapped four other worktrees' Rust
# builds, and the check runner cleared two of them by re-running alone at the
# SAME 8 s deadline — starvation, not a defect. What makes this class slower than
# every other fixture cell is where the work happens: each request goes through
# PHP and SQLite rather than `mod_dav`'s C, and a cell is tens of round trips
# (MKCOL, a staged 1 MiB PUT, a MOVE, a read back, then a recursive clean-up).
# ❌ Don't read 30 s as a runtime — idle they fit inside the global 8 s cap, which
# is why they were only ever red under load. It is a hang backstop with enough
# headroom that a busy host doesn't decide the verdict.
filter = 'test(volume::nextcloud_test::)'
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.default.overrides]]
# Gemini alone, ahead of the general provider-smoke cap below so it wins (nextest: the first
# matching override per setting wins). Its free tier flaps — the identical request answered
# 200, then 503, then a bodyless 404 inside a few minutes on 2026-09-04 — so
# `client_real_gemini_test` retries four times with 5/10/20 s backoff before it will call the
# run inconclusive. That's ~35 s of deliberate waiting plus four live round trips, which the
# 60 s cap below would SIGKILL mid-retry, turning "Google was busy" into a red lane: exactly
# the false alarm the retry exists to prevent. 150 s keeps the test's own budget authoritative
# with the cap as a hang backstop. ❌ Don't read it as a runtime: a healthy attempt answers
# first try in ~2 s.
filter = 'test(ai::client_real_gemini_)'
slow-timeout = { period = "150s", terminate-after = 1 }

[[profile.default.overrides]]
# The real-API provider smokes (`ai::client_real_*_test`, `#[ignore]`-gated, run only by the
# `<provider>-smoke` check lanes). A live LLM round trip is the one thing they exist to do, so
# the global 8 s cap can't be met without deleting the coverage — the exception the policy at
# the top of this file describes.
#
# ❌ Don't read 60 s as a runtime. Measured 2026-09-04 on an idle M3 Max: Groq 1.2 s, Fireworks
# 4.5–7.5 s. But every provider's small model reasons before it answers now, so latency is set
# by how long the model thinks, not by us; the OpenAI Responses leg is the slowest. Fireworks
# already blew the 8 s cap on its first lane run. 60 s is a hang backstop with enough headroom
# that a thinking model or a busy provider doesn't decide the verdict.
#
# No `test-group`: each lane runs one provider's module and the lanes are `Exclusive` on the
# cargo build dir, so they never overlap. Nothing here contends with anything.
filter = 'test(ai::client_real_)'
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.default.overrides]]
# The SFTP window measurements, read and write (`crates/cmdr-sftp/src/volume/streams_bench.rs`).
# ❗ Deliberately NOT `#[ignore]`d — the integration lane runs `--run-ignored only`
# over that whole package, so an ignored measurement would gate CI on a throughput
# ratio taken under runner contention. They gate on `CMDR_SFTP_BENCH=1` instead and
# cost nothing in every other run; with it set, one cell moves hundreds of MiB over
# a `netem`-delayed link, which is minutes. The group above keeps two of them off
# each other's link.
filter = 'test(streams_bench::)'
test-group = 'sftp-bench'
slow-timeout = { period = "600s", terminate-after = 1 }

[[profile.default.overrides]]
# The real-Vision tests. The cap covers ONE cold model load, which is macOS's to
# pay and not something a refactor can shorten without giving up the real
# framework call this exists to exercise; the `vision-model` group above is what
# keeps it to one. 90 s against a measured 33.8 s leaves room for a saturated
# suite, and it stays a backstop: warm, the whole family is under a second.
# `what_one_vision_analyze_leaves_resident` is `#[ignore]`d and hand-run, but it
# calls Vision the same way, so it belongs to the same group and cap.
# allowed-unmatched-nextest-filter: macos-only, the Vision framework has no Linux counterpart
filter = 'test(media_index::backend::vision::tests::real_) + test(media_index::backend::vision::tests::what_one_vision_analyze_leaves_resident)'
test-group = 'vision-model'
slow-timeout = { period = "90s", terminate-after = 1 }

[profile.default]
# Show test output for failing tests only
failure-output = "immediate"
# Show test output for successful tests
success-output = "never"
# Number of retries for failing tests (useful for flaky tests)
retries = 0
# Run tests with all available threads
test-threads = "num-cpus"
# Fail fast - stop on first failure
fail-fast = false
# How long to wait for a finished test's stdout/stderr pipes to reach EOF before
# calling the test "leaky". nextest's shipped default is 200 ms, which on macOS
# mislabels ~30% of our runs.
#
# Why it is a false positive here: the check runs AFTER the child is reaped, so the
# kernel has already closed its fds — only ANOTHER live process holding an inherited
# duplicate of the pipe can withhold EOF. Darwin has no `pipe2(O_CLOEXEC)`, so Rust's
# std sets `FD_CLOEXEC` in a second, non-atomic syscall, and a concurrent `posix_spawn`
# can inherit the write end in between. The victim is always the SHORTER-lived process
# of the pair, which is why the label tracks duration rather than resources: the tests
# it lands on average 0.25-1.2 s when marked leaky and 1.7-2.4 s when not, and the
# Linux lane (which does have `pipe2`) sees 0.008 leaks per run against macOS's 0.30.
#
# ❗ Keep `result = "pass"`. A macOS spawn artifact must not turn a run red, and a
# genuine leak still surfaces — 800 ms later, on a test that already passed. Only a
# test that would be labelled leaky ever pays this wait, and only once.
leak-timeout = { period = "1s", result = "pass" }
# Hard cap on every test (see policy at top of file). period × terminate-after
# = 8 s × 1 = kill after 8 s of wall-clock.
slow-timeout = { period = "8s", terminate-after = 1 }

# ── Contention re-run profiles ───────────────────────────────────────────────
# Used ONLY by the check runner when a run goes red, to tell a starved test from a
# genuinely slow or broken one. Never select them by hand for a normal run.
# Mechanics: `scripts/check/checks/rust-test-contention.go`.

[profile.contention-probe]
# Stage 1: re-run just the failing tests, ALONE, with every deadline exactly as the
# failing run had them (hence `inherits`, which carries the per-test overrides above).
# Changing nothing but the parallelism is what makes a pass here mean "the suite was
# starving it" rather than "we gave it more time".
inherits = "default"
test-threads = 1
retries = 0
fail-fast = false

[profile.contention-retry]
# Stage 2: only for tests stage 1 could NOT clear. Grants headroom to separate "got
# slower" from "broken".
#
# ❌ Deliberately NO `inherits`: an inherited per-test override BEATS a profile-level
# `slow-timeout` (verified against nextest 0.9.136, 2026-07-29: a test with a 4 s
# override still died at 4 s under a profile declaring 30 s). Inheriting would silently
# keep the tight caps this stage exists to lift, so the per-test overrides above don't
# apply here.
#
# 40 s clears every lane's real runtime by a wide margin. Don't read the big per-test
# caps above as runtimes: they're hang backstops. Measured 2026-07-29 on an idle M3 Max,
# the slowest SMB integration test (`..._concurrent_streaming_writes_no_deadlock`, whose
# cap is 130 s) actually runs in 2.8 s, and the whole 53-test integration suite is 5.3 s
# wall-clock. So 40 s is ~14x the slowest real test, enough that only a genuine hang
# fails, while bounding the pathological case (15 hung tests) to ~10 minutes.
test-threads = 1
retries = 0
fail-fast = false
failure-output = "immediate"
slow-timeout = { period = "40s", terminate-after = 1 }

[profile.own-server]
# For `CMDR_WEBDAV_TEST_URL`: the `cmdr-webdav` suite aimed at a real server
# (a Nextcloud, a Synology, a Fastmail account) instead of the Docker fixtures.
# `apps/desktop/test/webdav-servers/README.md` § "Against a server of your own"
# is the recipe; this is the profile it tells you to pass.
#
# ❗ No `inherits`, so the per-test caps above don't apply. They are tuned for a
# `mod_dav` container on loopback, and every one of these cells is tens of round
# trips: aimed at a real server the same cells all died at the global 8 s cap
# (13 of 26, measured 2026-09-02 against the Nextcloud fixture, which is only a
# PHP hop away — a server across the internet is worse). 120 s is a hang
# backstop, not a runtime.
#
# ❌ Not the default profile's problem to solve. Against the fixtures these cells
# run in milliseconds, and loosening the global cap for everyone would spend the
# fast feedback the 8 s policy buys on a case nothing automated ever hits.
# `test-threads = 4` because the far side is somebody's real account, not a
# container we own.
test-threads = 4
retries = 0
fail-fast = false
failure-output = "immediate"
success-output = "immediate"
slow-timeout = { period = "120s", terminate-after = 1 }

[profile.ci]
# Inherit from default profile
inherits = "default"
# In CI, show output for both passing and failing tests
success-output = "immediate-final"
# In CI, fail fast to save time
fail-fast = true
# JUnit report for CI integration
[profile.ci.junit]
path = "target/nextest/ci/junit.xml"

[profile.default.junit]
path = "target/nextest/default/junit.xml"
